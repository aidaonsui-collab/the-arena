<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arena — Fair launches on Sui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1C1D21; --card:#26272C; --ink:#EDECE8; --muted:#9A9BA3; --line:#33343A;
  --lift:#2E2F35; --sui:#298DFF; --lime:#C8F135; --up:#3DDC84; --down:#FF6640;
  --radius:32px; --shadow:0 10px 32px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
html{overflow-x:hidden}
body{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100dvh;overflow-x:hidden}
a{color:var(--sui);text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(200,241,53,.45)}
.shell{width:min(1180px,calc(100% - 32px));margin:0 auto}
.serif{font-family:"Instrument Serif",Georgia,serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:40;background:rgba(28,29,33,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:14px;padding:14px 0;min-height:64px}
.brand{display:flex;align-items:center;gap:9px;flex:none;cursor:pointer}
.brand svg{display:block}
.brand-name{font-family:"Instrument Serif",Georgia,serif;font-size:18px;letter-spacing:.2em;line-height:1;text-transform:uppercase}
.nav-pill{display:flex;align-items:center;gap:4px;margin:0 auto;background:#16171A;border-radius:999px;padding:4px}
.nav-item{padding:8px 18px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.nav-item.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.nav-item:hover{color:var(--ink)}
.btn-connect{background:var(--lime);color:#111;border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;flex:none;transition:filter .15s}
.btn-connect:hover{filter:brightness(.97)}
.search-row{display:flex;align-items:center;gap:10px;margin:8px auto 6px}
.search-bar{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:12px 16px;box-shadow:var(--shadow);min-width:0}
.search-bar svg{flex:none;opacity:.45}
.search-bar input{flex:1;border:0;outline:none;background:transparent;min-width:0;font-size:15px}
.search-bar input::placeholder{color:#9CA3AF}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);background:#16171A;border-radius:6px;padding:3px 7px;flex:none}
.btn-create{background:var(--card);border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;cursor:pointer;color:var(--ink)}
.btn-create:hover{background:var(--lift)}
main{padding:18px 0 72px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.explore-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:10px 0 22px}
.explore-head h1{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-size:clamp(28px,4vw,40px);font-weight:700;margin:0;letter-spacing:-.03em;line-height:1.1}
.explore-head p{margin:8px 0 0;color:var(--muted);max-width:42ch}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:0;background:#16171A;color:var(--muted);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.pill.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pill:hover{color:var(--ink)}
.sec-label{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 12px;font-weight:600}
.sec-label span{color:var(--muted);font-weight:500;font-size:13px}
.featured{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.feat{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .18s,box-shadow .18s}
.feat:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.feat-top{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.diamond{width:11px;height:11px;transform:rotate(45deg);background:#fff;border-radius:2px}
.feat-name{font-weight:650;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-tick{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.btn-buy{margin-left:auto;background:var(--lime);border:0;border-radius:999px;padding:7px 12px;font-weight:650;font-size:13px;flex:none}
.feat-mcap{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.chg{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.feat-meta{display:flex;gap:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.pit-strip{margin:18px 0;background:var(--card);border-radius:28px;padding:18px 22px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;cursor:pointer}
.pit-strip:hover{box-shadow:0 14px 34px rgba(0,0,0,.4)}
.pit-kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pit-pot{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(28px,4vw,40px);line-height:1;margin-top:4px;font-weight:500;letter-spacing:-.04em}
.pit-right{text-align:right}
.launches{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lcard{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);cursor:pointer;min-width:0;transition:transform .18s,box-shadow .18s}
.lcard:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.lcard-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chip{font-size:11px;font-weight:600;border-radius:999px;padding:3px 8px;background:#16171A;color:var(--muted);margin-left:auto;white-space:nowrap}
.chip.live{color:#8EC5FF;background:rgba(41,141,255,.16)}
.chip.grad{color:#111;background:var(--lime)}
.bar{height:4px;background:#16171A;border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#9BD0FF,var(--sui));border-radius:99px}
.rowlist{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 1fr 90px 72px 120px 110px;gap:12px;align-items:center;padding:14px 4px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--lift)}
.footer{margin:48px auto 0;background:var(--card);border-radius:var(--radius);padding:28px 32px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px;color:var(--muted);font-size:13px}
.footer h4{margin:0 0 8px;color:var(--ink);font-size:14px}
.footer a,.footer div[data-go]{display:block;padding:3px 0;cursor:pointer;color:var(--muted)}
.footer a:hover,.footer div[data-go]:hover{color:var(--ink)}
.hero-card{background:var(--card);border-radius:var(--radius);padding:clamp(28px,4vw,48px);box-shadow:var(--shadow);text-align:center}
.hero-card h1{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(40px,8vw,88px);margin:8px 0 0;line-height:1;font-weight:400}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,380px);grid-template-areas:"main ticket";gap:14px;align-items:start}
.split>.split-main{grid-area:main}
.split>.ticket{grid-area:ticket}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.stat{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:18px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}
.tv-host{height:360px;width:100%;position:relative;background:#1C1D21;border-radius:16px;overflow:hidden}
.tv-host iframe{border:0;display:block;width:100%;height:100%}
.ticket{background:var(--card);border-radius:28px;padding:18px;box-shadow:var(--shadow);position:sticky;top:84px}
.sides{display:flex;background:#16171A;border-radius:999px;padding:4px}
.sides>div{flex:1;text-align:center;padding:10px;border-radius:999px;font-weight:650;cursor:pointer;color:var(--muted)}
.sides>div.on-buy{background:var(--lift);color:var(--ink)}
.sides>div.on-sell{background:#3A2422;color:#FF8A70}
.amt{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:26px;font-weight:650;outline:none;background:#16171A;color:var(--ink)}
.amt:focus{border-color:#298DFF;background:#1C1D21}
.chips{display:flex;gap:6px;margin-top:10px}
.chips>div{flex:1;text-align:center;background:#16171A;border-radius:999px;padding:8px 0;font-size:12px;font-weight:600;cursor:pointer}
.chips>div:hover{background:var(--lift)}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.fee-chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.fee-chip{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:2px 7px;opacity:.9}
.btn-trade{width:100%;border:0;border-radius:999px;padding:14px;font-weight:700;background:var(--lime);margin-top:12px}
.btn-trade.sell{background:#FECACA}
.tape-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;flex-wrap:wrap}
.form-grid{display:grid;gap:12px;text-align:left;max-width:520px;margin:28px auto 0}
.form-grid label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.form-grid input{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#16171A;outline:none;color:var(--ink)}
.form-grid input:focus{border-color:#298DFF;background:#1C1D21}
.toggle{display:flex;gap:8px;flex-wrap:wrap}
.back{font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:12px}
.back:hover{color:var(--ink)}
.token-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.token-head h1{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-size:clamp(28px,4.5vw,44px);margin:0;font-weight:700;letter-spacing:-.03em;line-height:1}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:650;border-radius:999px;padding:5px 10px;background:var(--card);box-shadow:var(--shadow)}
.holder-card{background:var(--card);border-radius:20px;padding:14px 18px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:12px 0}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
html.shot,html.shot *{animation:none!important;transition:none!important}
@media (max-width:1100px){
  .featured{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .split,.grid-2,.footer,.stats{grid-template-columns:1fr}
  .split{grid-template-areas:"main" "ticket"}
  .ticket{position:static}
  .row{grid-template-columns:24px 1fr 64px auto; }
  .row .spark,.row .st-col{display:none}
}
@media (max-width:720px){
  .shell{width:calc(100% - 20px)}
  .topbar-inner{flex-wrap:wrap;padding:10px 0 12px}
  .nav-pill{order:3;width:100%;justify-content:center;margin:0}
  .search-row{flex-direction:column;align-items:stretch}
  .btn-create{width:100%}
  .featured,.launches{grid-template-columns:1fr}
  .kbd{display:none}
  .tv-host{height:280px}
  .explore-head h1{font-size:36px}
  .footer{padding:22px}
  .pit-right{text-align:left}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="shell topbar-inner">
    <div class="brand" data-go="explore">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#298DFF" aria-hidden="true"><path d="M17.636 10.009a7.16 7.16 0 0 1 1.565 4.474 7.2 7.2 0 0 1-1.608 4.53l-.087.106-.023-.135a7 7 0 0 0-.07-.349c-.502-2.21-2.142-4.106-4.84-5.642-1.823-1.034-2.866-2.278-3.14-3.693-.177-.915-.046-1.834.209-2.62.254-.787.631-1.446.953-1.843l1.05-1.284a.46.46 0 0 1 .713 0l5.28 6.456zm1.66-1.283L12.26.123a.336.336 0 0 0-.52 0L4.704 8.726l-.023.029a9.33 9.33 0 0 0-2.07 5.872C2.612 19.803 6.816 24 12 24s9.388-4.197 9.388-9.373a9.32 9.32 0 0 0-2.07-5.871zM6.389 9.981l.63-.77.018.142q.023.17.055.34c.408 2.136 1.862 3.917 4.294 5.297 2.114 1.203 3.345 2.586 3.7 4.103a5.3 5.3 0 0 1 .109 1.801l-.004.034-.03.014A7.2 7.2 0 0 1 12 21.67c-3.976 0-7.2-3.218-7.2-7.188 0-1.705.594-3.27 1.587-4.503z"/></svg>
      <span class="brand-name">ARENA</span>
    </div>
    <nav class="nav-pill" id="nav-pill"></nav>
    <button type="button" class="btn-connect" id="wallet-btn" data-wallet>Connect</button>
  </div>
</header>
<div class="shell search-row">
  <div class="search-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9BA3" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
    <input id="q" type="search" placeholder="Search tokens" autocomplete="off">
    <span class="kbd">⌘K</span>
  </div>
  <button type="button" class="btn-create" data-go="launch">+ Create</button>
</div>
<main class="shell" id="screens"></main>
<script src="js/indexer.js"></script>
<script>
(function(){
  const GRAD = 2000;
  const T = [
    {t:"VOLT",n:"Voltcats",b:"Nine lives, one curve. Currently clawing at graduation.",cap:4650,ch:31.3,h:612,st:"Graduating",mode:"Holders",q:"SUI",c:"#298DFF",pit:true},
    {t:"IRON",n:"Ironclad",b:"Object-centric collateral. One vault, many blows.",cap:4380,ch:18.9,h:503,st:"Graduating",mode:"Buy & burn",q:"SUI",c:"#8A99A8"},
    {t:"BRINE",n:"Brine",b:"Spreads so tight they sting. Order-book spray for Sui.",cap:2140,ch:9.6,h:466,st:"Live",mode:"Buy & burn",q:"SUI",c:"#3FA0A8"},
    {t:"HEX",n:"Hexweaver",b:"Compose Move packages like hexes. No mercy for bad bytecode.",cap:1540,ch:22.5,h:328,st:"Live",mode:"Holders",q:"SUI",c:"#9A7FB0"},
    {t:"SILK",n:"Silk",b:"Gold bout on the curve. Quote is XAUM; the pit for this bout is Pit<XAUM>.",cap:0.62,ch:16.8,h:266,st:"Live",mode:"Holders",q:"XAUM",quote:"XAUM",c:"#C9A97E"},
    {t:"NITE",n:"Night Market",b:"After-hours liquidity. The floor never really closes.",cap:1020,ch:-4.7,h:215,st:"Live",mode:"Holders",q:"SUI",c:"#5A6472"},
    {t:"RAZR",n:"Razorfin",b:"Latency as a weapon. Built for the hot path.",cap:769,ch:41.0,h:169,st:"Live",mode:"Holders",q:"SUI",c:"#C9A05A"},
    {t:"GLOW",n:"Glowmoth",b:"Drawn to the light. A moth that refuses to rug.",cap:454,ch:12.7,h:140,st:"Live",mode:"Holders",q:"SUI",c:"#93B27C"},
    {t:"PBL",n:"Pebble",b:"Small stone, long throw. Microcaps with a spine.",cap:257,ch:8.2,h:118,st:"Live",mode:"Holders",q:"SUI",c:"#7A7A70"},
    {t:"QUILL",n:"Quill",b:"Write once, settle forever.",cap:179,ch:3.1,h:96,st:"Live",mode:"Holders",q:"SUI",c:"#9A8A6E"}
  ];
  T.forEach(function(k,i){
    const base = Math.max(2.4, k.cap/34);
    k.buckets = Array.from({length:12},function(_,j){return +(base*(0.42+Math.abs(Math.sin((i+1.7)*(j+2.3)))*0.95)).toFixed(2);});
    k.fbuckets = k.buckets.map(function(v){return Math.max(1, Math.round(v/2.6));});
    k.born = i;
  });
  const GRADS = [{t:"DUNE",n:"Dune",cap:12400,c:"#C9A97E"},{t:"AXM",n:"Axiom",cap:9800,c:"#298DFF"},{t:"KRKN",n:"Kraken",cap:6100,c:"#5A6472"},{t:"ORBT",n:"Orbit",cap:3450,c:"#9A7FB0"}];
  const BELLS = [
    {t:"VOLT",n:"Voltcats",amt:34.20,ago:"1h",mode:"Holders"},
    {t:"IRON",n:"Ironclad",amt:41.90,ago:"3h",mode:"Buy & burn",burn:"9.1M"},
    {t:"BRINE",n:"Brine",amt:28.10,ago:"4h",mode:"Buy & burn",burn:"6.02M"}
  ];
  const ADDR = ["0x8f2a…ab71","0xa91c…d012","0x11c0…012f","0x70bb…4410","0xcc81…e203","0x5d0e…c801","0x09ae…3290","0xbb21…aa13"];
  const ROUND_SECONDS = 96;
  let bshift = 0, pot = 31.94, prevPot = "", roundNo = 128, secs = ROUND_SECONDS;
  let balance = 48.60;
  let xaumBal = 2.40;
  const state = {route:"explore", sym:"VOLT", filter:"All", sort:"Market cap", time:"All", side:"Buy", amt:"1", connected:false, search:"", lName:"", lTick:"", lQuote:"SUI", lMode:"Holders"};
  let hashLock = false;
  const SHOT = /Headless/i.test(String(navigator.userAgent||"")) || /(?:^|[?&])shot=1(?:&|$)/.test(location.search);
  if (SHOT) document.documentElement.classList.add("shot");
  const Index = window.ArenaIndex || window.ArenaIndexer || null;
  const DEMO_WALLET = (Index && Index.DEMO_WALLET) || "0x8f2a00000000000000000000000000000000000000000000000000000000ab71";
  const bus = { trades: [], launches: {}, index: { pools: {}, cursor: null }, sub: null };
  let tvWidget = null;
  let tvSeq = 0;
  let hydrating = true;

  function $(s,r){ return (r||document).querySelector(s); }
  function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function fmt(n){ return n >= 1000 ? (n/1000).toFixed(2)+"k" : (n >= 1 ? n.toFixed(2) : n.toFixed(n>=0.1?2:3)); }
  function money(n, q){ return fmt(n)+" "+(q||"SUI"); }
  function gradTarget(k){ return poolQuote(k) === "XAUM" ? 1 : GRAD; }
  function walletBal(q){ return (q === "XAUM" ? xaumBal : balance); }
  function clockStr(){ return Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0"); }
  function spark(seed){
    let p = "", y = 18;
    for (let i=0;i<=24;i++){
      y += Math.sin(i*seed)*2.6 + (seed > 0.5 ? -0.55 : 0.42);
      y = Math.max(4, Math.min(26, y));
      p += (i?"L":"M")+(i*3.58).toFixed(1)+" "+y.toFixed(1);
    }
    return p;
  }
  function chText(k){ return (k.ch>=0?"+":"")+k.ch.toFixed(1)+"%"; }
  function chColor(k){ return k.ch>=0 ? "#3DDC84" : "#FF6640"; }
  function rank(i){ return String(i+1).padStart(2,"0"); }
  function sortedT(){ return T.slice().sort(function(a,b){return b.cap-a.cap;}); }
  function vol(k){ return k.buckets.reduce(function(a,b){return a+b;},0); }
  function findT(sym){ return T.find(function(k){return k.t === (sym||"").toUpperCase();}) || T[0]; }
  function poolQuote(sym){
    const id = (sym && sym.t) ? sym.t : (sym || state.sym);
    const tk = findT(id);
    const rec = bus.index && bus.index.pools && (bus.index.pools[tk.t] || bus.index.pools[id]);
    if (rec && rec.quote) return rec.quote === "XAUM" ? "XAUM" : "SUI";
    const launch = bus.launches[tk.t] || bus.launches[id];
    if (launch && Index) return Index.quoteLabel(launch.quote);
    return tk.q || tk.quote || "SUI";
  }
  function isRefl(tk){
    tk = tk && tk.t ? tk : findT(tk || state.sym);
    const rec = bus.index && bus.index.pools && bus.index.pools[tk.t];
    if (rec && rec.reflection != null) return !!rec.reflection;
    const launch = bus.launches[tk.t];
    if (launch && launch.reflection != null) return !!launch.reflection;
    return tk.mode === "Holders";
  }
  function shortAddr(a){

          '<div class="card" style="padding:18px;margin-top:12px">'+
            '<div class="stat k" style="margin-bottom:6px">Tape</div>'+
            '<div id="tape">'+tapeHTML(tk.t)+'</div></div></div>'+
        '<div class="ticket">'+
          '<div class="sides">'+
            '<div data-side="Buy" id="btn-buy" class="'+(buyOn?"on-buy":"")+'">Buy</div>'+
            '<div data-side="Sell" id="btn-sell" class="'+(buyOn?"":"on-sell")+'">Sell</div></div>'+
          '<div style="display:flex;justify-content:space-between;margin:16px 0 8px;font-size:13px;color:var(--muted)"><span id="pay-label">'+meta.payLabel+'</span><span id="bal-text" class="mono">'+walletBal(q).toFixed(2)+' '+q+'</span></div>'+
          '<input id="amt" class="amt" value="'+state.amt+'">'+
          '<div class="chips">'+chips+'</div>'+
          '<div style="margin-top:16px">'+
            '<div class="kv"><span style="color:var(--muted)">You receive</span><span id="receive" class="mono">'+meta.receive+'</span></div>'+
            '<div class="kv"><span style="color:var(--muted)">Swap fee · 1%</span><span id="fee" class="mono" style="color:#298DFF">'+meta.fee+'</span></div>'+
            '<div id="fee-chips" class="fee-chips">'+meta.chips+'</div>'+
            '<div class="kv"><span style="color:var(--muted)">Venue</span><span>Bonding curve</span></div></div>'+
          '<button type="button" class="btn-trade'+(buyOn?"":" sell")+'" id="trade-btn" data-trade>'+meta.tradeLabel+'</button>'+
          '<div id="fee-note" style="margin-top:10px;text-align:center;font-size:11px;color:var(--muted)">'+meta.note+'</div>'+
        '</div></div>'+
      footerHTML()+'</div>';
  }
  function hashFor(route, sym){
    if (route === "explore" || route === "floor" || route === "discover") return "#/";
    if (route === "token") return "#/token/"+(sym||state.sym);
    return "#/"+route;
  }
  function parseHash(){
    const h = (location.hash || "#/").replace(/^#/, "");
    const parts = h.split("/").filter(Boolean);
    if (!parts.length) return {route:"explore", sym:state.sym};
    if (parts[0] === "token"){
      const raw = (parts[1]||"VOLT").toUpperCase();
      const tk = T.find(function(k){return k.t === raw;});
      return {route:"token", sym: tk ? tk.t : "VOLT"};
    }
    const r = parts[0];
    if (r === "discover" || r === "floor" || r === "home" || r === "explore") return {route:"explore", sym:state.sym};
    if (r === "pit" || r === "launch") return {route:r, sym:state.sym};
    return {route:"explore", sym:state.sym};
  }
  function paintNav(){
    const nav = [["Explore","explore"],["Pit","pit"]];
    $("#nav-pill").innerHTML = nav.map(function(n){
      const on = state.route === n[1] || (n[1]==="explore" && state.route==="token");
      return '<div class="nav-item'+(on?" on":"")+'" data-go="'+n[1]+'">'+n[0]+'</div>';
    }).join("");
  }
  function paintWallet(){
    const el = $("#wallet-btn");
    if (el) el.textContent = state.connected ? balance.toFixed(2)+" SUI" : "Connect";
  }
  function paintClocks(){
    const c = clockStr();
    $$("[data-clock]").forEach(function(el){ el.textContent = c; });
    $$("[data-round]").forEach(function(el){ el.textContent = String(roundNo); });
  }
  function paintPots(){
    const txt = money(pot);
    $$("[data-pot]").forEach(function(el){ el.textContent = txt; });
    prevPot = txt;
  }
  function paintCaps(){
    T.forEach(function(k){
      $$('[data-cap="'+k.t+'"]').forEach(function(el){
        if (el.closest("#contenders")) el.textContent = fmt(k.cap);
        else el.textContent = money(k.cap, poolQuote(k));
      });
      $$('[data-bar="'+k.t+'"]').forEach(function(el){ el.style.width = barPct(k); });
    });
  }
  function paintTicket(){
    const buy = $("#btn-buy"), sell = $("#btn-sell");
    if (!buy) return;
    const buyOn = state.side === "Buy";
    const meta = ticketMeta();
    buy.className = buyOn ? "on-buy" : "";
    sell.className = buyOn ? "" : "on-sell";
    const pl = $("#pay-label"); if (pl) pl.textContent = meta.payLabel;
    const bt = $("#bal-text"); if (bt) bt.textContent = walletBal(meta.quote).toFixed(2)+" "+meta.quote;
    const rec = $("#receive"); if (rec) rec.textContent = meta.receive;
    const fee = $("#fee"); if (fee) fee.textContent = meta.fee;
    const chips = $("#fee-chips"); if (chips) chips.innerHTML = meta.chips;
    const note = $("#fee-note"); if (note) note.textContent = meta.note;
    const tr = $("#trade-btn");
    if (tr){
      tr.textContent = meta.tradeLabel;
      tr.className = "btn-trade"+(buyOn?"":" sell");
    }
  }
  function paintPx(){
    const q = poolQuote(state.sym);
    const txt = fmtPx(lastPx(state.sym))+" "+q;
    $$("[data-px]").forEach(function(el){ el.textContent = txt; });
  }
  function paintHolder(){
    const host = $("#holder-refl");
    if (!host) return;
    const wrap = host.parentNode;
    if (!wrap) return;
    const fresh = holderHTML(findT(state.sym));
    if (!fresh){ host.remove(); return; }
    const tmp = document.createElement("div");
    tmp.innerHTML = fresh;
    wrap.replaceChild(tmp.firstChild, host);
  }
  function paintTape(){
    const tapeEl = $("#tape");
    if (tapeEl) tapeEl.innerHTML = tapeHTML(state.route === "token" ? state.sym : null);
  }
  function paintLive(){
    paintClocks();
    paintPots();
    paintCaps();
    paintTape();
    paintTicket();
    paintPx();
    updateChartLive();
  }
  function dropTv(){
    if (tvWidget){
      try { tvWidget.remove(); } catch (e) {}
      tvWidget = null;
    }
  }
  function loadTvScript(onLoad, onError){
    if (window.TradingView){ onLoad(); return; }
    const candidates = [
      "./charting_library/charting_library/charting_library.standalone.js",
      "/charting_library/charting_library/charting_library.standalone.js",
      "/charting_library/charting_library/charting_library.js"
    ];
    let idx = 0;
    (function tryNext(){
      if (idx >= candidates.length){ onError(); return; }
      const el = document.createElement("script");
      el.src = candidates[idx++];
      el.async = true;
      el.onload = function(){ window.TradingView ? onLoad() : tryNext(); };
      el.onerror = tryNext;
      document.head.appendChild(el);
    })();
  }
  function tvBars(sym){
    const id = String(sym || state.sym || '').toUpperCase();
    if (!Index || !Index.toCandles) return [];
    let trades = (bus.trades || []).filter(function(t){
      return String(t.pool_id || t.symbol || '').toUpperCase() === id;
    });
    if (!trades.length && Index.generateDemoHistory){
      const hist = Index.generateDemoHistory([findT(id)]);
      trades = hist.trades || [];
    }
    return Index.toCandles(trades, 60000).map(function(c){
      const t = Number(c.time);
      const ms = t > 0 && t < 1e12 ? t * 1000 : t;
      return {
        time: ms,
        open: c.open, high: c.high, low: c.low, close: c.close,
        volume: fromMist(c.volume)
      };
    });
  }
  function staticDatafeed(ticker, candles, res, pricescale, quote){
    const desc = ticker + " / " + quote;
    return {
      onReady: function(cb){ setTimeout(function(){ cb({ supported_resolutions: [res], supports_time: true }); }, 0); },
      searchSymbols: function(){},
      resolveSymbol: function(_n, onResolve){
        setTimeout(function(){
          onResolve({
            name: ticker, ticker: ticker, description: desc, type: "crypto", session: "24x7", timezone: "Etc/UTC",
            minmov: 1, pricescale: pricescale, has_intraday: true, has_daily: true, supported_resolutions: [res],
            volume_precision: 2, data_status: "streaming", format: "price"
          });
        }, 0);
      },
      getBars: function(_s, _r, p, onResult){
        p = p || {};
        if (!candles.length){ onResult([], { noData: true }); return; }
        if (p.firstDataRequest){ onResult(candles, { noData: false }); return; }
        function asMs(x){ x = Number(x); if (!isFinite(x)) return NaN; return x < 1e12 ? x * 1000 : x; }
        var from = asMs(p.from), to = asMs(p.to);
        var bars = candles.filter(function(c){
          if (isFinite(from) && c.time < from) return false;
          if (isFinite(to) && c.time > to) return false;
          return true;
        });
        onResult(bars, { noData: bars.length === 0 });
      },
      subscribeBars: function(){},
      unsubscribeBars: function(){},
      getServerTime: function(cb){ cb(Math.floor(Date.now() / 1000)); }
    };
  }
  function mountTvChart(){
    dropTv();
    if (state.route !== "token") return;
    const host = document.getElementById("tv-host");
    if (!host) return;
    const tk = findT(state.sym);
    const quote = poolQuote(tk);
    const ticker = tk.t;
    const seq = ++tvSeq;
    host.innerHTML = '<div style="min-height:200px;height:100%;display:flex;align-items:center;justify-content:center;color:#6B7280;font-size:13px">loading chart…</div>';
    loadTvScript(function(){
      if (seq !== tvSeq) return;
      const el = document.getElementById("tv-host");
      if (!el || !window.TradingView) return;
      dropTv();
      el.innerHTML = "";
      const candles = tvBars(ticker);
      el.setAttribute("data-tv-bars", String(candles.length));
      document.documentElement.setAttribute("data-tv-bars", String(candles.length));
      const px = candles.length ? candles[candles.length - 1].close : 0;
      const pricescale = px > 0 && px < 1 ? Math.pow(10, Math.min(12, Math.ceil(-Math.log10(px)) + 4)) : 100;
      const res = "1";
      tvWidget = new window.TradingView.widget({
        container: el,
        datafeed: staticDatafeed(ticker, candles, res, pricescale, quote),
        library_path: "/charting_library/charting_library/",
        symbol: ticker,
        interval: res,
        timezone: "Etc/UTC",
        theme: "Dark",
        style: "1",
        locale: "en",
        autosize: true,
        toolbar_bg: "#26272C",
        overrides: {
          "paneProperties.background": "#26272C",
          "paneProperties.backgroundType": "solid",
          "paneProperties.vertGridProperties.color": "rgba(237,236,232,.06)",
          "paneProperties.horzGridProperties.color": "rgba(237,236,232,.06)",
          "scalesProperties.textColor": "#9A9BA3",
          "scalesProperties.lineColor": "rgba(237,236,232,.12)",
          "mainSeriesProperties.candleStyle.upColor": "#3DDC84",
          "mainSeriesProperties.candleStyle.downColor": "#FF6640",
          "mainSeriesProperties.candleStyle.borderUpColor": "#3DDC84",
          "mainSeriesProperties.candleStyle.borderDownColor": "#FF6640",
          "mainSeriesProperties.candleStyle.wickUpColor": "#3DDC84",
          "mainSeriesProperties.candleStyle.wickDownColor": "#FF6640"
        },
        disabled_features: ["use_localstorage_for_settings","header_symbol_search","header_compare","display_market_status","go_to_date"],
        enabled_features: ["hide_last_na_study_output","move_logo_to_main_pane","volume_force_overlay"]
      });
      try {
        tvWidget.onChartReady(function(){
          document.documentElement.setAttribute("data-tv-ready","1");
        });
      } catch (e) {}
    }, function(){
      const el = document.getElementById("tv-host");
      if (el) el.innerHTML = '<div style="min-height:200px;height:100%;display:flex;align-items:center;justify-content:center;color:#9A9BA3;font-size:13px">Chart library unavailable.</div>';
    });
  }
  function updateChartLive(){ /* static datafeed */ }
  function renderScreen(){
    dropTv();
    const host = $("#screens");
    const map = {explore:exploreHTML, pit:pitHTML, token:tokenHTML, launch:launchHTML};
    host.innerHTML = (map[state.route] || exploreHTML)();
    paintNav();
    paintWallet();
    const q = $("#q");
    if (q) q.value = state.search;
    prevPot = money(pot);
    if (state.route === "token") mountTvChart();
  }
  function go(route, sym){
    const nextSym = sym || state.sym;
    if (route === state.route && (!sym || nextSym === state.sym)) return;
    window.scrollTo(0,0);
    state.route = route;
    if (sym) state.sym = nextSym;
    hashLock = true;
    const h = hashFor(route, state.sym);
    if ((location.hash || "#/") !== h) location.hash = h;
    else hashLock = false;
    renderScreen();
  }
  function applyLiveTrade(ev){
    const k = T.find(function(t){ return t.t === ev.pool_id; });
    if (!k) return;
    const amt = fromMist(ev.quote_amount);
    const gold = poolQuote(k) === "XAUM";
    k.buckets[11] += gold ? amt * 40 : amt; k.fbuckets[11] += 1;
    if (!gold) pot += fromMist(ev.pit_fee);
    if (gold){
      k.cap = Math.max(0.02, Math.min(0.95, k.cap + (ev.is_buy ? Math.min(0.04, amt*0.12) : -Math.min(0.03, amt*0.09))));
    } else {
      k.cap = Math.max(40, k.cap + (ev.is_buy ? amt*4.2 : -amt*3.1));
    }
  }
  function userFill(){
    if (!Index || !bus.sub) return;
    const tk = findT(state.sym);
    const amt = parseFloat(state.amt) || 0;
    const ev = Index.makeTrade({
      pool_id: tk.t,
      trader: DEMO_WALLET,
      is_buy: state.side === "Buy",
      quote: amt,
      price: lastPx(tk.t),
      reflection: isRefl(tk),
      raised: Math.max(40, tk.cap * 0.42),
      quote_real: Math.max(8, tk.cap * 0.36),
      ts: Date.now()
    });
    bus.sub.push(ev);
  }
  function rollover(){
    roundNo += 1;
    pot = 0.42;
    prevPot = "";
  }
  function doLaunch(){
    const name = (state.lName || ($("#l-name") && $("#l-name").value) || "").trim();
    const tick = (state.lTick || ($("#l-tick") && $("#l-tick").value) || "").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
    if (!name || !tick) return;
    if (T.some(function(k){ return k.t === tick; })) { go("token", tick); return; }
    const k = {t:tick,n:name,b:"Just entered the arena.",cap:state.lQuote==="XAUM"?0.04:48,ch:0,h:1,st:"Live",mode:state.lMode,q:state.lQuote,c:"#298DFF",born:T.length};
    const base = Math.max(2.4, k.cap/34);
    k.buckets = Array.from({length:12},function(){return +base.toFixed(2);});
    k.fbuckets = k.buckets.map(function(){return 1;});
    T.push(k);
    if (!state.connected) state.connected = true;
    go("token", tick);
  }
  document.addEventListener("click", function(e){
    const launch = e.target.closest("#launch-go");
    if (launch){ doLaunch(); return; }
    const trade = e.target.closest("[data-trade]");
    if (trade){
      if (!state.connected){ state.connected = true; paintWallet(); paintTicket(); }
      else { userFill(); paintLive(); }
      return;
    }
    const wal = e.target.closest("[data-wallet]");
    if (wal){ state.connected = !state.connected; paintWallet(); paintTicket(); return; }
    const side = e.target.closest("[data-side]");
    if (side){ state.side = side.getAttribute("data-side"); paintTicket(); return; }
    const chip = e.target.closest("[data-chip]");
    if (chip){
      const v = chip.getAttribute("data-chip");
      state.amt = v === "Max" ? walletBal(poolQuote(state.sym)).toFixed(2) : v;
      const inp = $("#amt"); if (inp) inp.value = state.amt;
      paintTicket();
      return;
    }
    const set = e.target.closest("[data-set]");
    if (set){
      const key = set.getAttribute("data-set");
      const val = set.getAttribute("data-val");
      state[key] = val;
      if (state.route === "launch") renderScreen();
      else if (state.route === "explore"){
        const keepQ = state.search;
        renderScreen();
        state.search = keepQ;
        const qel = $("#q"); if (qel) qel.value = keepQ;
      }
      return;
    }
    const goEl = e.target.closest("[data-go]");
    if (goEl){
      const v = goEl.getAttribute("data-go");
      if (v.indexOf("token:") === 0) go("token", v.slice(6));
      else go(v);
    }
  });
  document.addEventListener("input", function(e){
    if (e.target && e.target.id === "amt"){ state.amt = e.target.value; paintTicket(); }
    if (e.target && e.target.id === "q"){
      state.search = e.target.value;
      if (state.route !== "explore") { go("explore"); return; }
      const list = $("#disc-list");
      if (list){
        const pool = launchPool();
        list.innerHTML = pool.length ? pool.map(launchRow).join("") : '<div class="empty">No launches match.</div>';
        const c = $("#launch-count"); if (c) c.textContent = pool.length+" live";
      }
    }
    if (e.target && e.target.id === "l-name") state.lName = e.target.value;
    if (e.target && e.target.id === "l-tick") state.lTick = e.target.value.toUpperCase();
  });
  document.addEventListener("keydown", function(e){
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
      e.preventDefault();
      const q = $("#q"); if (q) q.focus();
    }
  });
  window.addEventListener("hashchange", function(){
    if (hashLock){ hashLock = false; return; }
    const p = parseHash();
    go(p.route, p.sym);
  });
  if (!SHOT) setInterval(function(){
    secs = secs > 0 ? secs - 1 : ROUND_SECONDS;
    if (secs === ROUND_SECONDS) rollover();
    if (++bshift >= 20){
      bshift = 0;
      T.forEach(function(k){ k.buckets.shift(); k.buckets.push(0); k.fbuckets.shift(); k.fbuckets.push(0); });
    }
    paintLive();
  }, 1000);
  if (Index){
    hydrating = true;
    bus.index = Index.demoSnapshot(T, DEMO_WALLET);
    bus.sub = Index.subscribe({
      packageId: window.ARENA_PACKAGE_ID || "",
      rpc: window.SUI_RPC || "https://fullnode.mainnet.sui.io:443",
      tokens: T,
      live: !SHOT,
      demoMs: 1000,
      onTrade: function(ev){
        if (hydrating) return;
        if (Date.now() - (ev.ts||0) < 8000) applyLiveTrade(ev);
        paintTape();
        paintPx();
        updateChartLive();
      },
      onLaunch: function(l){
        bus.launches[l.pool_id] = l;
        if (l.symbol) bus.launches[l.symbol] = l;
      }
    });
    bus.trades = bus.sub.trades;
    hydrating = false;
    if (!SHOT){
      Index.loadIndex(window.ARENA_INDEX_URL).then(function(res){
        if (res && res.index) bus.index = res.index;
        paintHolder();
      }).catch(function(){ paintHolder(); });
    }
  }
  const parsed = parseHash();
  state.route = parsed.route;
  state.sym = parsed.sym;
  renderScreen();
})();
</script>
