<style>
:root{
  --bg:#120814; --card:#1c101c; --ink:#F4EEF2; --muted:#A898A8; --line:#3A2438;
  --lift:#261626; --sui:#298DFF; --up:#298DFF; --down:#FF6640; --pink:#FF2EA6;
  --silver:#C0C7D1; --gold:#C9A97E;
  --radius:14px; --shadow:0 8px 22px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
html{overflow-x:hidden}
body{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:#120814}
a{color:var(--sui);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(41,141,255,.45)}
.shell{width:min(1180px,calc(100% - 32px));margin:0 auto}
.serif{font-family:"Instrument Serif",Georgia,serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:40;background:rgba(18,8,20,.9);backdrop-filter:blur(16px);border-bottom:1px solid transparent}
.topbar-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:12px 0;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;flex:none;cursor:pointer}
.brand-mark{width:36px;height:36px;border-radius:10px;display:block;object-fit:cover;background:#140818}
.brand-name{font-family:"Bagel Fat One","Grandstander",system-ui,sans-serif;font-size:30px;font-style:normal;font-weight:400;letter-spacing:.01em;line-height:1;text-transform:none;display:inline-block;color:var(--pink);-webkit-text-fill-color:var(--pink);-webkit-text-stroke:0.7px var(--sui);paint-order:stroke fill}
.nav-pill{display:flex;align-items:center;gap:8px;margin:0;justify-self:center;background:transparent;border-radius:0;padding:0}
.nav-item{padding:10px 12px 12px;border-radius:0;font-size:15px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);cursor:pointer;transition:color .2s;white-space:nowrap;border-bottom:2px solid transparent}
.nav-item.on{background:transparent;color:var(--ink);box-shadow:none;border-bottom-color:var(--sui)}
.nav-item:hover{color:var(--ink)}
.btn-connect{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;justify-self:end;transition:filter .15s;position:relative;z-index:41}
.btn-connect:hover{filter:brightness(.97)}
.wallet-overlay{position:fixed;inset:0;z-index:80;background:rgba(12,6,14,.72);display:grid;place-items:center;padding:20px}
.wallet-overlay[hidden]{display:none}
.wallet-sheet{background:var(--card);border-radius:18px;padding:22px 20px 16px;width:min(380px,100%);box-shadow:var(--shadow)}
.wallet-sheet h3{margin:0 0 6px;font-size:18px;font-weight:650}
.wallet-sheet .wallet-sub{margin:0 0 16px;color:var(--muted);font-size:13px}
.wallet-opt{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:#160e16;color:var(--ink);border-radius:12px;padding:12px 14px;margin:0 0 8px;text-align:left;font-weight:600}
.wallet-opt:hover{background:var(--lift);border-color:#5a3a56}
.wallet-opt img,.wallet-mark{width:28px;height:28px;border-radius:8px;flex:none;object-fit:cover}
.wallet-mark{display:grid;place-items:center;background:#101211;color:var(--pink);font-size:13px;font-weight:700}
.wallet-opt .on{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sui)}
.wallet-err{color:#FF6640;font-size:13px;margin:4px 0 8px}
.wallet-x{width:100%;border:0;background:transparent;color:var(--muted);padding:8px;font-size:13px}
.wallet-x:hover{color:var(--ink)}
.meta-sheet{width:min(520px,100%);max-height:min(92dvh,720px);overflow:auto}
.meta-sheet .form-grid{margin:12px 0 0;max-width:none}
.meta-sheet textarea{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#16171A;outline:none;color:var(--ink)}
.meta-sheet textarea:focus{border-color:var(--sui);background:#1C1D21}
.meta-actions{display:flex;gap:8px;margin-top:4px}
.meta-actions .btn-trade{flex:1;margin-top:0}
.search-row{display:flex;align-items:center;gap:10px;margin:10px auto 4px}
.search-bar{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:none;min-width:0}
.search-bar svg{flex:none;opacity:.45}
.search-bar input{flex:1;border:0;outline:none;background:transparent;min-width:0;font-size:15px}
.search-bar input::placeholder{color:#9CA3AF}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);background:#16171A;border-radius:6px;padding:3px 7px;flex:none}
.btn-create{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;box-shadow:none;white-space:nowrap;cursor:pointer;color:var(--ink)}
.btn-create:hover{background:var(--lift)}
main{padding:18px 0 72px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.explore-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:8px 0 14px}
.explore-head h1{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-size:clamp(24px,3.4vw,32px);font-weight:700;margin:0;letter-spacing:-.03em;line-height:1.1}
.explore-head p{margin:8px 0 0;color:var(--muted);max-width:42ch}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:6px 10px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.pill.on{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:none}
.pill:hover{color:var(--ink)}
.pill.quote-xagm{color:var(--silver);border-color:#8E97A3}
.pill.quote-xagm:hover{color:#E8EDF2;border-color:var(--silver)}
.pill.quote-xagm.on,.pill.quote-xagm.on:hover{background:var(--silver);color:#1A1218;border-color:var(--silver)}
.pill.quote-xaum{color:var(--gold);border-color:#A88A5C}
.pill.quote-xaum:hover{color:#E8D09A;border-color:var(--gold)}
.pill.quote-xaum.on,.pill.quote-xaum.on:hover{background:var(--gold);color:#1A1218;border-color:var(--gold)}
.sec-label{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 12px;font-weight:600}
.sec-label span{color:var(--muted);font-weight:500;font-size:13px}
.featured{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.feat{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .18s,box-shadow .18s}
.feat:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.feat-top{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.diamond{width:11px;height:11px;transform:rotate(45deg);background:#fff;border-radius:2px}
.feat-name{font-weight:650;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-tick{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.pair-quote.gold{color:var(--gold)}
.pair-quote.silver{color:var(--silver)}
.btn-buy{margin-left:auto;background:var(--sui);color:#fff;border:0;border-radius:999px;padding:7px 12px;font-weight:650;font-size:13px;flex:none}
.feat-mcap{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.chg{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.feat-meta{display:flex;gap:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.lead-tile{margin:0 0 12px;background:rgba(28,16,28,.82);border-radius:16px;padding:18px 20px;box-shadow:none;cursor:pointer;border:1px solid rgba(255,255,255,.08);transition:border-color .18s;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
.lead-tile:hover{border-color:rgba(255,46,166,.4)}
.lead-tile-top{display:flex;align-items:center;gap:16px;min-width:0}
.lead-tile-copy{min-width:0}
.lead-tile-copy .feat-name{font-size:clamp(28px,4vw,44px);letter-spacing:-.04em;margin-top:2px;text-transform:uppercase}
.lead-stats{display:flex;gap:28px;margin:0 0 0 auto;padding:0;border:0;text-align:right}
.lead-stat .k{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead-stat .v{font-size:clamp(20px,2.6vw,28px);font-weight:700;letter-spacing:-.04em;margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .lead-tile{padding:16px}
  .lead-stats{grid-template-columns:1fr 1fr 1fr;gap:10px}
  .lead-stat .v{font-size:20px}
}
.pit-strip{margin:0 0 28px;background:rgba(28,16,28,.82);border-radius:16px;padding:18px 22px;box-shadow:none;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;cursor:pointer}
.pit-strip:hover{border-color:rgba(255,46,166,.35)}
.pit-kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pit-pot{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(22px,3.2vw,32px);line-height:1;margin-top:4px;font-weight:500;letter-spacing:-.04em}
.pit-right{text-align:right}
.launches{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.lcard{background:var(--card);border-radius:14px;padding:6px 6px 4px;border:1px solid rgba(255,255,255,.08);box-shadow:none;cursor:pointer;min-width:0;transition:border-color .18s,transform .42s cubic-bezier(.22,.61,.36,1),opacity .32s ease;display:flex;flex-direction:column;gap:0;overflow:hidden}
.lcard:hover{border-color:rgba(255,46,166,.4)}
.lcard.flip-move{z-index:2;will-change:transform}
.lcard.flip-enter{opacity:0;transform:translateY(-14px) scale(.96)}

.lcard-art img,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.art-field{display:flex;align-items:center;gap:14px}
.art-preview{width:72px;height:72px;border-radius:18px;background:#101211;overflow:hidden;display:grid;place-items:center;flex:none;font-family:"Instrument Serif",Georgia,serif;font-size:28px;color:rgba(255,255,255,.8)}
.art-preview img{width:100%;height:100%;object-fit:cover}
.art-field input[type=file]{font-size:13px;color:var(--muted)}
.art-note{font-size:12px;color:var(--muted);margin-top:6px}
.lcard-art{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.lcard-art .art-letter{font-family:"Instrument Serif",Georgia,serif;font-size:28px;line-height:1;color:rgba(255,255,255,.92);letter-spacing:-.04em}
.lcard-art .chip{position:absolute;top:6px;left:6px;margin:0;background:rgba(11,12,16,.62);backdrop-filter:blur(8px);color:#fff;font-size:10px;padding:2px 6px}
.quote-badge{position:absolute;left:6px;bottom:6px;margin:0;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 6px;line-height:1.2;white-space:nowrap;backdrop-filter:blur(8px);z-index:1}
.quote-badge.gold{background:rgba(201,169,126,.94);color:#1A1218}
.quote-badge.silver{background:rgba(192,199,209,.94);color:#1A1218}
.quote-badge.tbill{background:rgba(62,207,142,.94);color:#102016}
.avatar-wrap{position:relative;display:inline-block;flex:none;line-height:0}
.avatar-wrap .quote-badge{left:50%;bottom:-5px;transform:translateX(-50%);font-size:8px;padding:2px 5px}
.lcard-body{padding:6px 2px 2px;border-top:0}
.lcard-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;min-width:0}
.lcard-row + .lcard-row{margin-top:1px}
.lcard .feat-name{font-size:12px;font-weight:650}
.lcard .feat-tick{font-size:10px}
.lcard .feat-mcap{font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;flex:none}
.lcard.hot{background:var(--card);color:var(--ink);border-color:rgba(255,46,166,.45)}
.lcard.hot .feat-tick,.lcard.hot .feat-meta,.lcard.hot .chip{color:var(--muted)}
.lcard.hot .feat-mcap{color:var(--ink)}
.lcard.hot .lcard-art .chip{background:var(--pink);color:#fff}
.lcard.hot .ago{color:var(--pink)}
.lcard-foot{display:none}
.ago{color:var(--pink);font-weight:650;font-variant-numeric:tabular-nums}
.count-pill{display:inline-flex;align-items:center;margin-left:10px;background:#101211;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);vertical-align:middle}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.bar-row .bar{flex:1;margin:0}
.bar-pct{font-size:12px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.lcard-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chip{font-size:11px;font-weight:600;border-radius:999px;padding:3px 8px;background:#16171A;color:var(--muted);margin-left:auto;white-space:nowrap}
.chip.live{color:#7EB6FF;background:rgba(41,141,255,.16)}
.chip.grad{color:#fff;background:var(--sui)}
.bar{height:4px;background:#101211;border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--sui);border-radius:99px}
.rowlist{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 1fr 90px 72px 120px 110px;gap:12px;align-items:center;padding:14px 4px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--lift)}
.footer{margin:48px auto 0;background:var(--card);border-radius:var(--radius);padding:28px 32px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px;color:var(--muted);font-size:13px}
.footer h4{margin:0 0 8px;color:var(--ink);font-size:14px}
.footer a,.footer div[data-go]{display:block;padding:3px 0;cursor:pointer;color:var(--muted)}
.footer a:hover,.footer div[data-go]:hover{color:var(--ink)}
.hero-card{background:var(--card);border-radius:var(--radius);padding:clamp(28px,4vw,48px);box-shadow:var(--shadow);text-align:center}
.hero-card h1{font-family:"Bagel Fat One","Grandstander",system-ui,sans-serif;font-size:clamp(40px,8vw,88px);margin:8px 0 0;line-height:1;font-weight:400;width:fit-content;background:linear-gradient(90deg,var(--pink) 12%,var(--sui) 88%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.launch-points{list-style:none;margin:16px 0 22px;padding:0;display:grid;gap:8px;max-width:52ch}
.launch-points li{color:var(--muted);font-size:15px;line-height:1.35;padding-left:14px;position:relative}
.launch-points li:before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:99px;background:var(--pink)}
@media (min-width:720px){
  .launch-points{grid-template-columns:1fr 1fr;gap:10px 28px;max-width:640px}
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,380px);grid-template-areas:"about ticket" "main ticket";gap:14px;align-items:start}
.split>.split-about{grid-area:about;min-width:0}
.split>.split-main{grid-area:main}
.split>.ticket{grid-area:ticket}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.stat{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:18px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}
.tv-wrap{position:relative}
.tv-host{height:360px;width:100%;position:relative;background:#1C101C;border-radius:0;overflow:hidden}
.chart-pending{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.chart-card{padding:0;overflow:hidden}
.chart-toolbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:#161018}
.chart-tf{border:0;background:transparent;color:var(--muted);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.04em;padding:5px 8px;border-radius:6px;cursor:pointer}
.chart-tf.on{background:var(--lift);color:var(--ink)}
.chart-ind-gap{flex:1;min-width:10px;height:1px}
.chart-ohlc{position:absolute;top:8px;left:12px;z-index:3;display:flex;flex-wrap:wrap;gap:4px 10px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--muted);pointer-events:none;max-width:calc(100% - 72px);line-height:1.35}
.chart-ohlc b{color:var(--ink);font-weight:500}
.chart-ohlc .up{color:var(--sui)}
.chart-ohlc .down{color:var(--down)}
.chart-ohlc .ma7{color:#FF2EA6}
.chart-ohlc .ma25{color:#298DFF}
.chart-ohlc .ma99{color:#C9B458}
.chart-ohlc .ema{color:#7AE0B8}
.tv-host iframe,.tv-host svg.local-chart{border:0;display:block;width:100%;height:100%}
.ticket{background:var(--card);border-radius:28px;padding:18px;box-shadow:var(--shadow);position:sticky;top:84px;min-width:0;max-width:100%;overflow:hidden}
.sides{display:flex;background:#16171A;border-radius:999px;padding:4px}
.sides>div{flex:1;text-align:center;padding:10px;border-radius:999px;font-weight:650;cursor:pointer;color:var(--muted)}
.sides>div.on-buy{background:var(--lift);color:var(--ink)}
.sides>div.on-sell{background:#3A2422;color:#FF8A70}
.amt{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:26px;font-weight:650;outline:none;background:#16171A;color:var(--ink)}
.amt:focus{border-color:var(--sui);background:#1C1D21}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips>div{flex:1;text-align:center;background:#16171A;border-radius:999px;padding:8px 0;font-size:12px;font-weight:600;cursor:pointer}
.chips>div:hover{background:var(--lift)}
.chips>div.on{background:var(--lift);color:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;min-width:0}
.kv>span:last-child{min-width:0;text-align:right;overflow-wrap:anywhere;word-break:break-word}
.fee-chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.fee-chip{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:2px 7px;opacity:.9}

  /// A Move module name must be a valid identifier: letters, digits and

  function buildCoinModule(tpl, opts){
    var ident = tickerToIdent(opts.ticker);

    var bytes = tpl.update_identifiers(b64ToBytes(COIN_TEMPLATE_B64), {

    bytes = tpl.update_constants(bytes, bcsU8(opts.decimals), bcsU8(TPL_DEFAULTS.decimals), "U8");
    bytes = tpl.update_constants(bytes, bcsU64(opts.supply), bcsU64(TPL_DEFAULTS.supply), "U64");
    var vecs = uniquifyVecs(opts.symbol, opts.name, opts.description || "", opts.icon || "");
    bytes = tpl.update_constants(bytes, bcsString(vecs.symbol), bcsString(TPL_DEFAULTS.symbol), "Vector(U8)");
    bytes = tpl.update_constants(bytes, bcsString(vecs.name), bcsString(TPL_DEFAULTS.name), "Vector(U8)");
    bytes = tpl.update_constants(bytes, bcsString(vecs.description), bcsString(TPL_DEFAULTS.description), "Vector(U8)");
    bytes = tpl.update_constants(bytes, bcsString(vecs.icon), bcsString(TPL_DEFAULTS.icon), "Vector(U8)");

    if (bytes.length < 64 || bytes[0] !== 0xa1 || bytes[1] !== 0x1c || bytes[2] !== 0xeb || bytes[3] !== 0x0b){

    var fx = result.effects || {};

  async function rpcJson(method, params){

          headers: { "content-type": "application/json" },

  /// Pull the objects the coin's `init` created out of a publish result.
  /// Accepts wallet JSON-RPC objectChanges and GraphQL transaction effects.
  function readPublishResult(result, ident){
    var changes = flattenObjectChanges(result);
    var out = { packageId: "", capId: "", coinId: "", metaId: "", coinType: "", digest: txDigest(result) };

    for (var i = 0; i < changes.length; i++){
      var c = changes[i] || {};
      if (c.type === "published" && c.packageId){
        out.packageId = c.packageId;
        continue;
      }
      var pkg = c.outputState && c.outputState.asMovePackage;
      if (pkg){
        out.packageId = pkg.address || c.address || out.packageId;
      }
    }
    if (!out.packageId) return out;
    if (ident) out.coinType = out.packageId + "::" + ident + "::" + ident.toUpperCase();

    // Only objects this transaction created, and only ones parameterised by the
    // coin type just published. objectChanges also reports the mutated gas coin,
    // which is a Coin<0x2::sui::SUI> and would otherwise be mistaken for the
    // freshly minted supply.
    var mine = out.packageId.replace(/^0x0*/, "");
    for (var j = 0; j < changes.length; j++){
      var ch = changes[j] || {};
      var t = "";
      var id = ch.objectId || ch.address || "";
      if (ch.type === "created") t = String(ch.objectType || "");
      else if (ch.outputState && ch.outputState.asMoveObject){
        if (ch.idCreated === false) continue;
        var cont = ch.outputState.asMoveObject.contents || {};
        t = String((cont.type && (cont.type.repr || cont.type)) || "");
      } else continue;
      if (!t || t.replace(/0x0*/g, "").indexOf(mine) < 0) continue;
      if (t.indexOf("::coin::TreasuryCap<") >= 0) out.capId = id;
      else if (t.indexOf("::coin::CoinMetadata<") >= 0) out.metaId = id;
      else if (t.indexOf("::coin::Coin<") >= 0) out.coinId = id;
    }
    return out;
  }

  async function fetchPublishTx(digest){
    try {
      var rpc = await rpcJson("sui_getTransactionBlock", [digest, { showEffects: true, showObjectChanges: true, showEvents: true }]);
      if (rpc && (rpc.objectChanges || rpc.effects)) return rpc;
    } catch (e) {}
    var data = await gql(
      "query($d:String!){ transaction(digest:$d){ digest effects { status objectChanges(first:50){ nodes { address idCreated outputState { asMovePackage { address } asMoveObject { contents { type { repr } } } } } } } } }",
      { d: digest }

  async function waitForPublish(digest, ident){
    var last = "";
    for (var i = 0; i < 20; i++){
      try {
        var tx = await fetchPublishTx(digest);
        if (tx){
          var rawSt = tx.effects && tx.effects.status;
          var st = (rawSt && (rawSt.status || rawSt)) || "";
          st = String(st);
          if (st && st !== "SUCCESS" && st !== "success"){
            var why = (rawSt && rawSt.error) || st;
            throw new Error("Publish failed on-chain (" + why + "). Digest " + digest);
          }
          var made = readPublishResult(tx, ident);
          made.digest = digest;
          if (made.packageId && made.capId && made.coinId) return made;
          if (made.packageId) last = "package "+made.packageId.slice(0,10)+" indexed, waiting on TreasuryCap/Coin";
        }
      } catch (e) {
        last = (e && e.message) ? e.message : String(e);
        if (/failed on-chain/i.test(last)) throw e;
      }
      await sleep(400 + i * 150);

    throw new Error("Publish sent (" + digest.slice(0, 8) + "…) but the package id is not indexed yet. Check wallet history before retrying." + (last ? " " + last : ""));

    // bytecode and the next SILVER publish aborted

    // first; JSON is a fallback only.

    if (json && json !== tx) payloads.push(json);
    var last = null;
    if (signTx){

        try {
          var signed = await signTx({ transaction: payloads[i], account: account, chain: "sui:mainnet" });
          var bytes = signed && (signed.bytes || signed.transactionBlockBytes);

  function metricsRollup(){
    const win = state.metricsWindow || "All";
    const cut = win === "24h" ? Date.now() - 86400000 : 0;
    const rows = (bus.trades || []).filter(function(t){ return (t.ts || 0) >= cut; });
    const out = {fills:rows.length, suiVol:0, rwaVol:0, rwaVolUsd:0, suiFee:0, rwaFee:0, refl:0, creator:0, pit:0, plat:0, byPool:{}, hours:[]};
    const hourMap = {};
    rows.forEach(function(t){
      const q = poolQuote(t.pool_id);
      const amt = fromQuoteAmt(t.quote_amount, q);
      var instaLp = 0;
      if (t.bluefin && t.is_buy){
        var feeQ = fromQuoteAmt(t.fee, q);
        if (!(feeQ > 0)) feeQ = amt * 0.01;
        instaLp = feeQ * 0.8;
        out.creator += instaLp * 0.6;
        out.plat += instaLp * 0.1;
        out.pit += instaLp * 0.3;
      } else if (!t.bluefin){
        out.creator += fromMist(t.creator_fee);
        out.pit += fromMist(t.pit_fee);
        out.plat += fromMist(t.platform_fee);
      }
      const f = t.bluefin ? instaLp : (fromMist(t.creator_fee)+fromMist(t.pit_fee)+fromMist(t.platform_fee));
      if (q === "SUI"){ out.suiVol += amt; out.suiFee += f; }
      else {
        out.rwaVol += quoteSuiAmt(amt, q);
        var usd = amt * (quoteUsd(q) || 0);
        if (!(usd > 0) && hop.suiUsd > 0) usd = quoteSuiAmt(amt, q) * hop.suiUsd;
        out.rwaVolUsd += usd;
        out.rwaFee += f;
      }
      const tk = listedTok(t.pool_id);
      if (tk){
        const key = tk.t;
        const usd = amt * (quoteUsd(q) || 0);
        if (!out.byPool[key]) out.byPool[key] = {id:key, vol:0, volUsd:0, fills:0, q:q};
        out.byPool[key].vol += amt;
        out.byPool[key].volUsd += usd;
        out.byPool[key].fills += 1;
      }
      const h = Math.floor((t.ts||0)/3600000)*3600000;
      hourMap[h] = (hourMap[h]||0) + amt;
    });
    const hours = Object.keys(hourMap).map(Number).sort(function(a,b){return a-b;}).slice(-24);
    const max = hours.reduce(function(m,h){return Math.max(m, hourMap[h]);}, 0) || 1;
    out.hours = hours.map(function(h){ return {t:h, v:hourMap[h], pct: Math.max(4, hourMap[h]/max*100)}; });
    out.launches = T.length;
    out.grads = GRADS.length;
    const bells = (pitState.bells && pitState.bells.length) ? pitState.bells : [];
    out.bells = bells.length;
    out.bellPaid = bells.reduce(function(a,b){ return a + (Number(b.amt)||0); }, 0);
    return out;
  }

  function parseHash(){

    const h = (location.hash || "#/").replace(/^#/, "");

    if (!parts.length) return {route:"explore", sym:state.sym};
    if (parts[0] === "token"){
      const raw = (parts[1]||"").toUpperCase();
      return {route:"token", sym: raw || state.sym};
    }
    const r = parts[0];
    if (r === "discover" || r === "floor" || r === "home" || r === "explore" || r === "strip") return {route:"explore", sym:state.sym};
    if (r === "pit" || r === "pot" || r === "night" || r === "fight") return {route:"pit", sym:state.sym};

  function creatorTxError(e){

    }

    }

  async function transferCreatorRewards(tk, newAddr){
    var CALL = window.ARENA_CALL_PACKAGE || window.ARENA_COLLECT_PACKAGE;
    if (!CALL) throw new Error("Package missing");
    if (!tk.lockId) throw new Error("This token has no Instant lock to reassign");
    var next = padAddr(newAddr);
    if (!next) throw new Error("Creator rewards wallet must be a Sui address");
    if (sameAddr(next, "0x0")) throw new Error("Creator rewards wallet cannot be 0x0");
    var current = await lockBeneficiary(tk.lockId);
    if (current){
      tk.lockBeneficiary = current;
      if (sameAddr(current, next)) return "";
    }
    var me = suiSession.address;
    var Transaction = await loadTransaction();
    var tx = new Transaction();
    tx.setSender(me);
    if (sameAddr(me, platformWallet())){
      var cap = window.ARENA_ADMIN_CAP;
      if (!cap) throw new Error("ARENA_ADMIN_CAP missing");
      tx.moveCall({
        target: CALL + "::lock::admin_set_beneficiary",
        arguments: [tx.object(tk.lockId), tx.object(cap), txPure(tx, "address", next)]
      });
    } else if ((current && sameAddr(me, current)) || (!current && tk.creator && sameAddr(me, tk.creator))){
      tx.moveCall({
        target: CALL + "::lock::set_beneficiary",
        arguments: [tx.object(tk.lockId), txPure(tx, "address", next)]
      });
    } else {
      throw new Error("Connect the current creator-rewards wallet or the platform wallet to reassign");
    }
    try {
      var result = await walletExec(tx);
      var digest = result && (result.digest || (result.effects && result.effects.transactionDigest) || result.transactionDigest);
      if (!digest) throw new Error("Rewards wallet transfer was not sent");
      return digest;
    } catch (e) {
      throw new Error(creatorTxError(e));
    }
  }

      var Ttype = normType(typeNameStr(tk.token) || demoTypeId(tk));

          tx.object(tk.bluefinPool),
          tx.object(window.ARENA_CONFIG),

      if (xaumUsd > 0){ hop.xaumUsd = xaumUsd; hop.usd = xaumUsd; }
      const n = Number(d.suiPerXaum);
      if (n > 0) hop.suiPerXaum = n;
      const perUsdy = Number(d.suiPerUsdy);
      if (perUsdy > 0) hop.suiPerUsdy = perUsdy;
      else if (hop.usdyUsd > 0 && hop.suiUsd > 0) hop.suiPerUsdy = hop.usdyUsd / hop.suiUsd;
      const perXagm = Number(d.suiPerXagm);
      if (perXagm > 0) hop.suiPerXagm = perXagm;
      else if (hop.xagmUsd > 0 && hop.suiUsd > 0) hop.suiPerXagm = hop.xagmUsd / hop.suiUsd;
      if (!(hop.suiPerXaum > 0) && hop.xaumUsd > 0 && hop.suiUsd > 0) hop.suiPerXaum = hop.xaumUsd / hop.suiUsd;
      if (!(hop.suiUsd > 0) && hop.xaumUsd > 0 && hop.suiPerXaum > 0) hop.suiUsd = hop.xaumUsd / hop.suiPerXaum;
      hop.source = d.source || "Cetus USDY/USDC · Bluefin XAGM/USDC · Bluefin XAUM/USDC";
      paintTicket();
      paintCaps();
      paintFirstBuyPreview();
      if (state.route === "metrics" || state.route === "pit") renderScreen();
      else if (state.route === "explore") paintExploreList();
    }
    fetch("/api/hop").then(function(r){ return r.ok ? r.json() : Promise.reject(); }).then(apply).catch(function(){
      Promise.all([
        fetch("https://api.dexpaprika.com/networks/sui/pools/0xdcd762ad374686fa890fc4f3b9bbfe2a244e713d7bffbfbd1b9221cb290da2ed").then(function(r){ return r.json(); }),
        fetch("https://api.dexpaprika.com/networks/sui/pools/0x4d3cc875e334440ad3485d4455d7ee072ea01b18c526ad64f9ebe2aa0a4f01b9").then(function(r){ return r.json(); }),
        fetch("https://api.dexpaprika.com/networks/sui/pools/0x458fc3722cc88babd7cbe78273aa5e4ecbdff75c76a2ad14cd1f75418b569649").then(function(r){ return r.json(); }),
        fetch("https://api.dexpaprika.com/networks/sui/pools/0x51e883ba7c0b566a26cbc8a94cd33eb0abd418a77cc1e60ad22fd9b1f29cd2ab").then(function(r){ return r.json(); }),
        fetch("https://api.coingecko.com/api/v3/simple/price?ids=sui&vs_currencies=usd").then(function(r){ return r.json(); }).catch(function(){ return {}; })
      ]).then(function(quad){
        const usdy = quad[0] || {};
        const xagm = quad[1] || {};
        const xaum = quad[2] || {};
        const suiUsdc = quad[3] || {};
        const g = quad[4] || {};
        apply({
          usdyUsd: usdy.last_price_usd,
          xagmUsd: xagm.last_price_usd,
          xaumUsd: xaum.last_price_usd,
          suiUsd: suiUsdc.last_price_usd || (g.sui && g.sui.usd),
          source: "DexPaprika SUI/USDC"
        });
      }).catch(function(){});
    });
  }
  loadHop();
  startWalletResume();
  const parsed = parseHash();
  state.route = parsed.route;
  state.sym = parsed.sym;
  const wantHash = hashFor(state.route, state.sym);
  if (wantHash.charAt(0) === "#"){
    if ((location.hash || "#/") !== wantHash){
      hashLock = true;
      location.hash = wantHash;
    }
  } else if ((location.pathname.replace(/\/+$/, "") || "/") !== wantHash){
    try { history.replaceState({ route: state.route, sym: state.sym }, "", wantHash); } catch (e) {}
  }
  renderScreen();
})();
</script>
