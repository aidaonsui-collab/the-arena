    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) applyLaunchArtFile(file, $("#l-art"));
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      closeDockSheet();
      closeWalletPicker();
      if (!metaEdit.saving) closeMetaEditor();
    }
    if (e.key === "Enter" && e.target && e.target.id === "tape-wallet"){
      e.preventDefault();
      applyTapeWallet(e.target.value);
      return;
    }
    if (e.key === "Enter" && e.target && e.target.id === "rw-addr"){
      e.preventDefault();
      if (!rewardsCardLookup.busy) runRewardsLookup(e.target.value);
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
      e.preventDefault();
      const q = $("#q"); if (q) q.focus();
    }
  });
  document.addEventListener("scroll", function(){ closeDockSheet(); }, { capture: true, passive: true });
  window.addEventListener("scroll", function(){ closeDockSheet(); }, { passive: true });
  window.addEventListener("hashchange", function(){
    if (hashLock){ hashLock = false; return; }
    const p = parseHash();
    go(p.route, p.sym);
  });
  window.addEventListener("popstate", function(){
    if (hashLock){ hashLock = false; return; }
    const p = parseHash();
    state.route = p.route;
    if (p.sym) state.sym = p.sym;
    renderScreen();
  });
  if (!SHOT) setInterval(function(){
    secs = secs > 0 ? secs - 1 : ROUND_SECONDS;
    if (secs === ROUND_SECONDS){
      rollover();
    }
    if (++bshift >= 20){
      bshift = 0;
      T.forEach(function(k){ k.buckets.shift(); k.buckets.push(0); k.fbuckets.shift(); k.fbuckets.push(0); });
    }
    if (state.route === "pit"){
      if (bshift % 8 === 0){
        refreshPitObject();
      }
      if (!pitStatePollAt || Date.now() - pitStatePollAt >= 120000){
        pitStatePollAt = Date.now();
        loadPitState();
      }
    } else if ((state.route === "explore" || state.route === "metrics") && bshift % 3 === 0){
      refreshPitObject();
      if (state.route === "explore"){
        if (bus.sub && bus.sub.refreshBluefin && bshift % 6 === 0) bus.sub.refreshBluefin();
        hydrateScreener();
        paintExploreList();
      }
    }
    paintLive();
  }, 1000);
  if (Index){
    hydrating = true;
    bus.index = Index.demoSnapshot(T, DEMO_WALLET);
    bus.sub = Index.subscribe({
      packageId: (window.ARENA_PACKAGE_ID && window.ARENA_PACKAGE_ID !== "0x0") ? window.ARENA_PACKAGE_ID : "",
      rpc: window.SUI_RPC || "https://mainnet.suiet.app",
      tokens: T,
      live: !SHOT,
      demoMs: 1000,
      bluefinMs: 12000,
      instadexMs: 45000,
      onTrade: function(ev){
        if (hydrating) return;
        if (Date.now() - (ev.ts||0) < 8000) applyLiveTrade(ev);
        else if (ev && ev.bluefin){
          const k = T.find(function(t){ return matchesPool(ev, t); });
          if (k){
            const px = tradeQuotePx(ev, poolQuote(k));
            if (px > 0) k.cap = px * VIRTUAL_SUPPLY;
          }
        }
        if (state.route === "explore") scheduleExploreList();
        if (state.route === "token"){
          if (lw.chart) applyLwData(findT(state.sym));
          else {
            var ch = document.querySelector(".tv-host[data-local]");
            if (ch) paintLocalChart(ch, findT(state.sym));
          }
        }
        scheduleLivePaint();
      },
      onLaunch: function(l){
        if (l && l.instadex) upsertInstadex(l);
        else upsertLaunch(l);
      },
      onInstadex: function(l){ upsertInstadex(l); },
      onGraduate: function(g){ applyGraduate(g); },
      onLock: function(g){ applyLock(g); },
      onBluefinLock: function(g){ applyBluefinLock(g); },
      onInstadexBurn: function(b){ applyInstadexBurn(b); },
      onInstadexMintLock: function(m){ applyInstadexMintLock(m); },
      onBeneficiarySet: function(b){ applyBeneficiarySet(b); },
      onHolderYieldLaunch: function(e){ applyHolderYieldLaunch(e); },
      onHolderYieldFunded: function(e){ applyHolderYieldFunded(e); },
      onHolderYieldClaim: function(e){ applyHolderYieldClaim(e); },
      onCollectLpFees: function(e){ applyCollectLpFees(e); },
      onBasketYieldLaunch: function(e){ applyBasketYieldLaunch(e); },
      onBasketYieldFunded: function(e){ applyBasketYieldFunded(e); },
      onBasketYieldConverted: function(e){ applyBasketYieldConverted(e); },
      onBasketYieldClaim: function(e){ applyBasketYieldClaim(e); },
      onBasketYieldPush: function(e){ applyBasketYieldPush(e); },
      onBasketYieldRotate: function(e){ applyBasketYieldRotate(e); },
      onHolderYieldPush: function(e){ applyHolderYieldPush(e); },
      holderYieldPackages: [window.ARENA_HOLDER_YIELD_PUSH_EVENT_PACKAGE, window.ARENA_HOLDER_YIELD_EVENT_PACKAGE, window.ARENA_CALL_PACKAGE, window.ARENA_COLLECT_PACKAGE].filter(Boolean),
      collectLpPackages: [window.ARENA_COLLECT_LP_EVENT_PACKAGE, window.ARENA_CALL_PACKAGE, window.ARENA_COLLECT_PACKAGE].filter(Boolean),
      basketYieldPackages: [window.ARENA_BASKET_YIELD_PUSH_EVENT_PACKAGE, window.ARENA_BASKET_YIELD_EVENT_PACKAGE, window.ARENA_CALL_PACKAGE, window.ARENA_COLLECT_PACKAGE].filter(Boolean),
      burnPackages: [window.ARENA_COLLECT_PACKAGE, "0xd8531cc8c4e1ee914f0e4e48aea9a796faa0603459cc4665838f688e51bf23d9", "0x47ea732e44f21470aa3dd449a7b26731ed2c377e2c02e650f3ede6ea581bf000"].filter(Boolean),
      beneficiaryPackages: [window.ARENA_CALL_PACKAGE, window.ARENA_COLLECT_PACKAGE].filter(Boolean),
      callPackage: window.ARENA_INSTADEX_PACKAGE,
      instadexPackages: [window.ARENA_INSTADEX_PACKAGE, window.ARENA_CALL_PACKAGE, window.ARENA_COLLECT_PACKAGE].filter(Boolean),
      lockPackages: [window.ARENA_INSTADEX_PACKAGE, window.ARENA_LOCK_PACKAGE, window.ARENA_BLUEFIN_EVENT_PACKAGE].filter(Boolean)
    });
    bus.trades = bus.sub.trades;
    setTimeout(function(){ hydrating = false; }, 2000);
    T.forEach(function(k){
      if (k && k.bluefinPool && bus.sub.watchBluefinPool) bus.sub.watchBluefinPool(k.bluefinPool);
    });
    if (!SHOT){
      Index.loadIndex(window.ARENA_INDEX_URL).then(function(res){
        if (res && res.index) bus.index = res.index;
        paintHolder();
      }).catch(function(){ paintHolder(); });
    }
  }
  function loadHop(){
    function apply(d){
      d = d || {};
      const suiUsd = Number(d.suiUsd);
      if (suiUsd > 0) hop.suiUsd = suiUsd;
      const usdyUsd = Number(d.usdyUsd);
      if (usdyUsd > 0) hop.usdyUsd = usdyUsd;
      const xagmUsd = Number(d.xagmUsd);
      if (xagmUsd > 0) hop.xagmUsd = xagmUsd;
      const xaumUsd = Number(d.xaumUsd);
      if (xaumUsd > 0){ hop.xaumUsd = xaumUsd; hop.usd = xaumUsd; }
      const n = Number(d.suiPerXaum);
      if (n > 0) hop.suiPerXaum = n;
      const perUsdy = Number(d.suiPerUsdy);
      if (perUsdy > 0) hop.suiPerUsdy = perUsdy;
      else if (hop.usdyUsd > 0 && hop.suiUsd > 0) hop.suiPerUsdy = hop.usdyUsd / hop.suiUsd;
      const perXagm = Number(d.suiPerXagm);
      if (perXagm > 0) hop.suiPerXagm = perXagm;
      else if (hop.xagmUsd > 0 && hop.suiUsd > 0) hop.suiPerXagm = hop.xagmUsd / hop.suiUsd;
      const vicefunUsd = Number(d.vicefunUsd);
      if (vicefunUsd > 0) hop.vicefunUsd = vicefunUsd;
      if (Number(d.axolUsd) > 0) hop.axolUsd = Number(d.axolUsd);
      if (Number(d.lofiUsd) > 0) hop.lofiUsd = Number(d.lofiUsd);
      if (Number(d.manifestUsd) > 0) hop.manifestUsd = Number(d.manifestUsd);
      ["wal","deep","ns","sca","blue"].forEach(function(k){
        if (Number(d[k+"Usd"]) > 0) hop[k+"Usd"] = Number(d[k+"Usd"]);
      });
      if (Number(d.nvdaUsd) > 0) hop.nvdaUsd = Number(d.nvdaUsd);
      if (Number(d.amcUsd) > 0) hop.amcUsd = Number(d.amcUsd);
      const perVicefun = Number(d.suiPerVicefun);
      if (perVicefun > 0) hop.suiPerVicefun = perVicefun;
      else if (hop.vicefunUsd > 0 && hop.suiUsd > 0) hop.suiPerVicefun = hop.vicefunUsd / hop.suiUsd;
      const perAxol = Number(d.suiPerAxol);
      if (perAxol > 0) hop.suiPerAxol = perAxol;
      else if (hop.axolUsd > 0 && hop.suiUsd > 0) hop.suiPerAxol = hop.axolUsd / hop.suiUsd;
      const perLofi = Number(d.suiPerLofi);
      if (perLofi > 0) hop.suiPerLofi = perLofi;
      else if (hop.lofiUsd > 0 && hop.suiUsd > 0) hop.suiPerLofi = hop.lofiUsd / hop.suiUsd;
      const perManifest = Number(d.suiPerManifest);
      if (perManifest > 0) hop.suiPerManifest = perManifest;
      else if (hop.manifestUsd > 0 && hop.suiUsd > 0) hop.suiPerManifest = hop.manifestUsd / hop.suiUsd;
      if (!(hop.suiPerXaum > 0) && hop.xaumUsd > 0 && hop.suiUsd > 0) hop.suiPerXaum = hop.xaumUsd / hop.suiUsd;
      if (!(hop.suiUsd > 0) && hop.xaumUsd > 0 && hop.suiPerXaum > 0) hop.suiUsd = hop.xaumUsd / hop.suiPerXaum;
      hop.source = d.source || "Cetus USDY/USDC · Bluefin XAGM/USDC · Bluefin XAUM/USDC · Dexscreener VICEFUN/SUI";
      paintTicket();
      paintCaps();
      paintFirstBuyPreview();
      paintBasketCost();
      if (lw.chart && state.route === "token") applyLwData(findT(state.sym));
      if (state.route === "metrics" || state.route === "pit") renderScreen();
      else if (state.route === "explore") paintExploreList();
    }
    function loadStockUsd(){
      var nvdaId = window.ARENA_NVDA_USDC_POOL;
      var amcId = window.ARENA_AMC_USDC_POOL;
      Promise.all([
        nvdaId ? fetch("https://api.dexscreener.com/latest/dex/pairs/sui/"+nvdaId).then(function(r){ return r.json(); }).catch(function(){ return null; }) : Promise.resolve(null),
        amcId ? fetch("https://api.dexscreener.com/latest/dex/pairs/sui/"+amcId).then(function(r){ return r.json(); }).catch(function(){ return null; }) : Promise.resolve(null)
      ]).then(function(pair){
        var n = pair[0] && pair[0].pairs && pair[0].pairs[0];
        var a = pair[1] && pair[1].pairs && pair[1].pairs[0];
        if (n && Number(n.priceUsd) > 0) hop.nvdaUsd = Number(n.priceUsd);
        if (a && Number(a.priceUsd) > 0) hop.amcUsd = Number(a.priceUsd);
        paintFirstBuyPreview();
      }).catch(function(){});
      loadNvdaUsdcPool().then(function(snap){
        var px = usdcPerStock(snap, window.ARENA_STOCK_NVDA_TYPE);
        if (px > 0 && !(hop.nvdaUsd > 0)) hop.nvdaUsd = px;
        paintFirstBuyPreview();
      }).catch(function(){});
      loadAmcUsdcPool().then(function(snap){
        var px = usdcPerStock(snap, window.ARENA_STOCK_AMC_TYPE);
        if (px > 0 && !(hop.amcUsd > 0)) hop.amcUsd = px;
        paintFirstBuyPreview();
      }).catch(function(){});
    }
    loadStockUsd();
    function loadMemeUsd(){
      var ids = [
        ["axolUsd", window.ARENA_AXOL_SUI_POOL],
        ["lofiUsd", window.ARENA_LOFI_SUI_POOL],
        ["manifestUsd", window.ARENA_MANIFEST_SUI_POOL],
        ["walUsd", window.ARENA_WAL_SUI_POOL],
        ["deepUsd", window.ARENA_DEEP_SUI_POOL],
        ["nsUsd", window.ARENA_NS_SUI_POOL],
        ["scaUsd", window.ARENA_SCA_SUI_POOL],
        ["blueUsd", window.ARENA_BLUE_SUI_POOL]
      ];
      Promise.all(ids.map(function(row){
        var id = row[1];
        return id ? fetch("https://api.dexscreener.com/latest/dex/pairs/sui/"+id).then(function(r){ return r.json(); }).catch(function(){ return null; }) : Promise.resolve(null);
      })).then(function(rows){
        function px(j){ var p = j && j.pairs && j.pairs[0]; return p && Number(p.priceUsd) > 0 ? Number(p.priceUsd) : 0; }
        rows.forEach(function(j, i){
          var n = px(j);
          if (n > 0) hop[ids[i][0]] = n;
        });
        paintFirstBuyPreview();
        paintBasketCost();
      }).catch(function(){});
    }
    loadMemeUsd();
    fetch("/api/hop").then(function(r){ return r.ok ? r.json() : Promise.reject(); }).then(apply).catch(function(){
      Promise.all([
        fetch("https://api.dexpaprika.com/networks/sui/pools/0xdcd762ad374686fa890fc4f3b9bbfe2a244e713d7bffbfbd1b9221cb290da2ed").then(function(r){ return r.json(); }),
        fetch("https://api.dexpaprika.com/networks/sui/pools/0x4d3cc875e334440ad3485d4455d7ee072ea01b18c526ad64f9ebe2aa0a4f01b9").then(function(r){ return r.json(); }),
        fetch("https://api.dexpaprika.com/networks/sui/pools/0x458fc3722cc88babd7cbe78273aa5e4ecbdff75c76a2ad14cd1f75418b569649").then(function(r){ return r.json(); }),
        fetch("https://api.dexpaprika.com/networks/sui/pools/0x51e883ba7c0b566a26cbc8a94cd33eb0abd418a77cc1e60ad22fd9b1f29cd2ab").then(function(r){ return r.json(); }),
        fetch("https://api.coingecko.com/api/v3/simple/price?ids=sui&vs_currencies=usd").then(function(r){ return r.json(); }).catch(function(){ return {}; }),
        fetch("https://api.dexscreener.com/latest/dex/pairs/sui/0xcae6fe00841fbccb44fbe8128a7c4b2e8800e87c7952af8444d24d0e76eb31c5").then(function(r){ return r.json(); }).catch(function(){ return {}; })
      ]).then(function(quad){
        const usdy = quad[0] || {};
        const xagm = quad[1] || {};
        const xaum = quad[2] || {};
        const suiUsdc = quad[3] || {};
        const g = quad[4] || {};
        const vicefunPair = (quad[5] && quad[5].pairs && quad[5].pairs[0]) || {};
        apply({
          usdyUsd: usdy.last_price_usd,
          xagmUsd: xagm.last_price_usd,
          xaumUsd: xaum.last_price_usd,
          suiUsd: suiUsdc.last_price_usd || (g.sui && g.sui.usd),
          vicefunUsd: vicefunPair.priceUsd,
          suiPerVicefun: vicefunPair.priceNative,
          source: "DexPaprika SUI/USDC · Dexscreener VICEFUN/SUI"
        });
      }).catch(function(){});
    });
  }
  loadHop();
  startWalletResume();
  tryResumeEvm();
  const parsed = parseHash();
  state.route = parsed.route;
  state.sym = parsed.sym;
  // Open quote pairs on SUI too; the ticket flips it back where SUI is locked.
  if (!state.payWith) state.payWith = "SUI";
  const wantHash = hashFor(state.route, state.sym);
  if (wantHash.charAt(0) === "#"){
    if ((location.hash || "#/") !== wantHash){
      hashLock = true;
      location.hash = wantHash;
    }
  } else if ((location.pathname.replace(/\/+$/, "") || "/") !== wantHash){
    try { history.replaceState({ route: state.route, sym: state.sym }, "", wantHash); } catch (e) {}
  }
  renderScreen();
})();
</script>
