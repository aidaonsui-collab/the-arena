<style>
:root{
  --bg:#120814; --color-page-background:#120814; --card:#1c101c; --ink:#F4EEF2; --muted:#A898A8; --line:#3A2438;
  --lift:#261626; --well:#16171A; --well-focus:#1C1D21; --topbar:rgba(18,8,20,.9); --overlay:rgba(12,6,14,.72);
  --sui:#298DFF; --up:#298DFF; --down:#FF6640; --pink:#FF2EA6;
  --silver:#C0C7D1; --gold:#C9A97E;
  --radius:14px; --shadow:0 8px 22px rgba(0,0,0,.38);
  --scr-up:#3ECF8E;
  color-scheme: dark;
}
html[data-theme="pastel"]{
  --bg:#FFF6FA; --color-page-background:#FFF6FA; --card:#FFFFFF; --ink:#3A1730; --muted:#9A6B86; --line:#F0C9DC;
  --lift:#FFEAF3; --well:#FFF0F6; --well-focus:#FFE0EE; --topbar:rgba(255,246,250,.92); --overlay:rgba(58,23,48,.28);
  --sui:#2B7AE8; --up:#2B7AE8; --down:#E85A4A; --pink:#FF2EA6;
  --silver:#7E8896; --gold:#A67C3D;
  --shadow:0 10px 28px rgba(255,46,166,.10);
  --scr-up:#1FA971;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)!important;background-color:var(--bg)!important;color:var(--ink);-webkit-font-smoothing:antialiased}
html{overflow-x:hidden}
body{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg)!important;background-color:var(--bg)!important}
a{color:var(--sui);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(41,141,255,.45)}
.shell{width:min(1360px,calc(100% - 40px));margin:0 auto}
.serif{font-family:"Instrument Serif",Georgia,serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:40;background:var(--topbar);backdrop-filter:blur(16px);border-bottom:1px solid transparent}
html[data-theme="pastel"] .topbar{border-bottom-color:var(--line)}
.btn-theme{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--lift);color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
.btn-theme:hover{border-color:var(--pink);color:var(--pink)}
.btn-theme svg{display:block}
.btn-theme .theme-moon{display:none}
html[data-theme="pastel"] .btn-theme .theme-sun{display:none}
html[data-theme="pastel"] .btn-theme .theme-moon{display:block}
html[data-theme="pastel"] .lcard{border-color:rgba(255,46,166,.14)}
html[data-theme="pastel"] .lead-tile{text-shadow:none}
html[data-theme="pastel"] .search-bar input::placeholder{color:#C196B0}
html[data-theme="pastel"] .art-preview{color:rgba(58,23,48,.5)}
html[data-theme="pastel"] .quote-badge.platform{background:rgba(255,246,250,.92)}
html[data-theme="pastel"] .feat:hover{box-shadow:0 14px 34px rgba(255,46,166,.12)}
html[data-theme="pastel"] .dock{background:color-mix(in srgb,var(--card) 94%,transparent);box-shadow:0 12px 40px rgba(255,46,166,.14)}
.topbar-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:12px 0;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;flex:none;cursor:pointer}
.brand-mark{width:36px;height:36px;border-radius:10px;display:block;object-fit:cover;background:#140818}
.brand-name{font-family:"Bagel Fat One","Grandstander",system-ui,sans-serif;font-size:30px;font-style:normal;font-weight:400;letter-spacing:.01em;line-height:1;text-transform:none;display:inline-block;color:var(--pink);-webkit-text-fill-color:var(--pink);-webkit-text-stroke:0.7px var(--sui);paint-order:stroke fill}
.nav-pill{display:flex;align-items:center;gap:8px;margin:0;justify-self:center;background:transparent;border-radius:0;padding:0}
.nav-item{padding:10px 12px 12px;border-radius:0;font-size:15px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);cursor:pointer;transition:color .2s;white-space:nowrap;border-bottom:2px solid transparent}
.nav-item.on{background:transparent;color:var(--ink);box-shadow:none;border-bottom-color:var(--sui)}
.nav-item:hover{color:var(--ink)}
.topbar-actions{display:flex;align-items:center;gap:8px;justify-self:end}
.btn-top-launch{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--sui);color:var(--sui);background:transparent;border-radius:10px;padding:11px 16px;min-height:44px;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:background .15s,color .15s,transform .15s}
.btn-top-launch:hover{background:color-mix(in srgb,var(--sui) 14%,transparent)}
.btn-top-launch:active{transform:scale(.96)}
.btn-connect{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:filter .15s;position:relative;z-index:41;min-height:44px}
.btn-connect:hover{filter:brightness(.97)}
.btn-connect:active{transform:scale(.96)}
.wallet-overlay{position:fixed;inset:0;z-index:80;background:var(--overlay);display:grid;place-items:center;padding:20px}
.wallet-overlay[hidden]{display:none}
.wallet-sheet{background:var(--card);border-radius:18px;padding:22px 20px 16px;width:min(380px,100%);box-shadow:var(--shadow)}
.wallet-sheet h3{margin:0 0 6px;font-size:18px;font-weight:650}
.wallet-sheet .wallet-sub{margin:0 0 16px;color:var(--muted);font-size:13px}
.wallet-opt{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--well);color:var(--ink);border-radius:12px;padding:12px 14px;margin:0 0 8px;text-align:left;font-weight:600}
.wallet-opt:hover{background:var(--lift);border-color:#5a3a56}
.wallet-opt img,.wallet-mark{width:28px;height:28px;border-radius:8px;flex:none;object-fit:cover}
.wallet-mark{display:grid;place-items:center;background:var(--well);color:var(--pink);font-size:13px;font-weight:700}
.wallet-opt .on{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sui)}
.wallet-err{color:#FF6640;font-size:13px;margin:4px 0 8px}
.wallet-x{width:100%;border:0;background:transparent;color:var(--muted);padding:8px;font-size:13px}
.wallet-x:hover{color:var(--ink)}
.meta-sheet{width:min(520px,100%);max-height:min(92dvh,720px);overflow:auto}
.meta-sheet .form-grid{margin:12px 0 0;max-width:none}
.meta-sheet textarea{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--well);outline:none;color:var(--ink)}
.meta-sheet textarea:focus{border-color:var(--sui);background:var(--well-focus)}
.meta-actions{display:flex;gap:8px;margin-top:4px}
.meta-actions .btn-trade{flex:1;margin-top:0}
.search-row{display:flex;align-items:center;gap:10px;margin:10px auto 4px}
.search-bar{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:none;min-width:0}
.search-bar svg{flex:none;opacity:.45}
.search-bar input{flex:1;border:0;outline:none;background:transparent;min-width:0;font-size:15px}
.search-bar input::placeholder{color:#9CA3AF}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);background:var(--well);border-radius:6px;padding:3px 7px;flex:none}
.btn-create{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;box-shadow:none;white-space:nowrap;cursor:pointer;color:var(--ink)}
.btn-create:hover{background:var(--lift)}
main{padding:18px 0 72px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.explore-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:8px 0 14px}
.explore-head h1{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-size:clamp(24px,3.4vw,32px);font-weight:700;margin:0;letter-spacing:-.03em;line-height:1.1}
.explore-head p{margin:8px 0 0;color:var(--muted);max-width:42ch}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:6px 10px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.pill.on{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:none}
.pill:hover{color:var(--ink)}
.pill.quote-xagm{color:var(--silver);border-color:#8E97A3}
.pill.quote-xagm:hover{color:#E8EDF2;border-color:var(--silver)}
.pill.quote-xagm.on,.pill.quote-xagm.on:hover{background:var(--silver);color:#1A1218;border-color:var(--silver)}
.pill.quote-xaum{color:var(--gold);border-color:#A88A5C}
.pill.quote-xaum:hover{color:#E8D09A;border-color:var(--gold)}
.pill.quote-xaum.on,.pill.quote-xaum.on:hover{background:var(--gold);color:#1A1218;border-color:var(--gold)}
.sec-label{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 12px;font-weight:600}
.sec-label span{color:var(--muted);font-weight:500;font-size:13px}
.featured{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.feat{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .18s,box-shadow .18s}
.feat:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.feat-top{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.diamond{width:11px;height:11px;transform:rotate(45deg);background:#fff;border-radius:2px}
.feat-name{font-weight:650;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-tick{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.pair-quote{display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
.pair-quote-logo,.pair-quote .q-logo{width:14px;height:14px;border-radius:50%;object-fit:cover;flex:none;background:#F4EEF2}
.pair-quote.gold{color:var(--gold)}
.pair-quote.silver{color:var(--silver)}
.btn-buy{margin-left:auto;background:var(--sui);color:#fff;border:0;border-radius:999px;padding:7px 12px;font-weight:650;font-size:13px;flex:none}
.feat-mcap{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.chg{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.feat-meta{display:flex;gap:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.lead-tile{margin:0;background:transparent;border-radius:16px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;border:1.5px solid var(--pink);text-shadow:0 1px 2px rgba(18,8,20,.7),0 4px 18px rgba(18,8,20,.55);transition:box-shadow .18s,border-color .18s}
.lead-tile:hover{box-shadow:0 0 0 1px var(--pink),0 0 22px rgba(255,46,166,.35)}
.lead-tile-top{display:flex;align-items:center;gap:16px;min-width:0}
.lead-tile-copy{min-width:0}
.lead-tile-copy .feat-name{font-size:clamp(28px,4vw,44px);letter-spacing:-.04em;margin-top:2px;text-transform:uppercase}
.lead-tile .avatar{width:72px;height:72px;border-radius:16px;box-shadow:0 8px 22px rgba(18,8,20,.4)}
.lead-stats{display:flex;gap:28px;margin:0 0 0 auto;padding:0;border:0;text-align:right}
.lead-stat .k,.lead-tile .pit-kicker{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead-stat .v{font-size:clamp(20px,2.6vw,28px);font-weight:700;letter-spacing:-.04em;margin-top:4px;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (max-width:860px){
  .living-hero{min-height:78vh}
  .lead-tile{padding:14px 16px}
  .lead-tile-copy .feat-name{font-size:26px}
  .lead-stats{width:100%;justify-content:space-between;margin-left:0;gap:12px}
  .lead-tile .avatar{width:56px;height:56px}
}
.pit-strip{margin:0 0 28px;background:rgba(28,16,28,.82);border-radius:16px;padding:18px 22px;box-shadow:none;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;cursor:pointer}
.pit-strip:hover{border-color:rgba(255,46,166,.35)}
.pit-kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pit-pot{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(22px,3.2vw,32px);line-height:1;margin-top:4px;font-weight:500;letter-spacing:-.04em}
.pit-right{text-align:right}
.launches{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.lcard{background:var(--card);border-radius:14px;padding:6px 6px 4px;border:1px solid rgba(255,255,255,.08);box-shadow:none;cursor:pointer;min-width:0;transition:border-color .18s,transform .42s cubic-bezier(.22,.61,.36,1),opacity .32s ease;display:flex;flex-direction:column;gap:0;overflow:hidden}
.lcard:hover{border-color:rgba(255,46,166,.4)}
.lcard.flip-move{z-index:2;will-change:transform}
.lcard.flip-enter{opacity:0;transform:translateY(-14px) scale(.96)}

.lcard-art img,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.art-field{display:flex;align-items:center;gap:14px}
.art-preview{width:72px;height:72px;border-radius:18px;background:var(--well);overflow:hidden;display:grid;place-items:center;flex:none;font-family:"Instrument Serif",Georgia,serif;font-size:28px;color:rgba(255,255,255,.8)}
.art-preview img{width:100%;height:100%;object-fit:cover}
.art-field input[type=file]{font-size:13px;color:var(--muted)}
.art-note{font-size:12px;color:var(--muted);margin-top:6px}
.lcard-art{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.lcard-art .art-letter{font-family:"Instrument Serif",Georgia,serif;font-size:28px;line-height:1;color:rgba(255,255,255,.92);letter-spacing:-.04em}
.lcard-art .chip{position:absolute;top:6px;left:6px;margin:0;background:rgba(11,12,16,.62);backdrop-filter:blur(8px);color:#fff;font-size:10px;padding:2px 6px}
.quote-badge{position:absolute;left:6px;bottom:6px;margin:0;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 6px;line-height:1.2;white-space:nowrap;backdrop-filter:blur(8px);z-index:1}
.quote-badge.gold{background:rgba(201,169,126,.94);color:#1A1218}
.quote-badge.silver{background:rgba(192,199,209,.94);color:#1A1218}
.quote-badge.tbill{background:rgba(62,207,142,.94);color:#102016}
.quote-badge.platform{background:rgba(18,8,20,.82);color:var(--pink);border:1.5px solid var(--pink);box-shadow:0 0 0 1px rgba(255,46,166,.12)}
.rwa-stack{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;z-index:1}
.rwa-stack img{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(18,8,20,.9);object-fit:cover;background:#F4EEF2;display:block}
.rwa-stack img + img{margin-left:-7px}
.avatar-wrap .rwa-stack{left:50%;bottom:-7px;transform:translateX(-50%)}
.about-yield{margin:0 0 18px;padding-top:4px;display:grid;gap:12px}
.about-rwa{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.about-rwa img{width:20px;height:20px;border-radius:50%;object-fit:cover;border:1px solid rgba(244,238,242,.12);background:#F4EEF2}
.about-rwa span{font-size:14px;font-weight:600}
.about-split{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.about-split i{font-style:normal;font-size:12px;font-weight:650;border-radius:999px;padding:4px 8px;background:rgba(244,238,242,.06)}
.avatar-wrap{position:relative;display:inline-block;flex:none;line-height:0}
.avatar-wrap .quote-badge{left:50%;bottom:-5px;transform:translateX(-50%);font-size:8px;padding:2px 5px}
.lcard-body{padding:6px 2px 2px;border-top:0}
.lcard-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;min-width:0}
.lcard-row + .lcard-row{margin-top:1px}
.lcard .feat-name{font-size:12px;font-weight:650}
.lcard .feat-tick{font-size:10px}
.lcard .feat-mcap{font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;flex:none}
.lcard.hot{background:var(--card);color:var(--ink);border-color:rgba(255,46,166,.45)}
.lcard.hot .feat-tick,.lcard.hot .feat-meta,.lcard.hot .chip{color:var(--muted)}
.lcard.hot .feat-mcap{color:var(--ink)}
.lcard.hot .lcard-art .chip{background:var(--pink);color:#fff}
.lcard.hot .ago{color:var(--pink)}
.lcard-foot{display:none}
.ago{color:var(--pink);font-weight:650;font-variant-numeric:tabular-nums}
.count-pill{display:inline-flex;align-items:center;margin-left:10px;background:var(--well);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);vertical-align:middle}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.bar-row .bar{flex:1;margin:0}
.bar-pct{font-size:12px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.lcard-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chip{font-size:11px;font-weight:600;border-radius:999px;padding:3px 8px;background:var(--well);color:var(--muted);margin-left:auto;white-space:nowrap}
.chip.live{color:#7EB6FF;background:rgba(41,141,255,.16)}
.chip.grad{color:#fff;background:var(--sui)}
.bar{height:4px;background:var(--well);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--sui);border-radius:99px}
.rowlist{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 1fr 90px 72px 120px 110px;gap:12px;align-items:center;padding:14px 4px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--lift)}
.footer{margin:48px auto 0;background:var(--card);border-radius:var(--radius);padding:28px 32px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px;color:var(--muted);font-size:13px}
.footer h4{margin:0 0 8px;color:var(--ink);font-size:14px}
.footer a,.footer div[data-go]{display:block;padding:3px 0;cursor:pointer;color:var(--muted)}

     avatar + name block + star: at 158px with 8px gaps and a 44px avatar the
     name block was squeezed to exactly 30px, and .mrow-tick (nowrap, and
     previously unclipped) painted its 51-78px of text straight over the star.
     Widened a little, avatar back down to the 32px the rest of the screener
     uses, tighter gaps — and the tick line now clips, so text can never reach
     the star again regardless of ticker length. */
  .mrow-id{position:sticky;left:0;z-index:2;display:flex;align-items:center;gap:6px;width:182px;flex:none;background:var(--bg);padding:8px 8px 8px 0;box-shadow:12px 0 12px -8px var(--bg)}

  .mrow-tick{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;min-width:0;overflow:hidden;padding-right:2px}

     by the clip above. */
  .mrow-sym{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .mrow-tick > span:not(.mrow-sym){flex:none}
  .mrow-name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

  .mrow-id .scr-star{width:36px;height:36px;margin-left:auto;flex:none}

  async function rpcJson(method, params){

    for (var i = 0; i < changes.length; i++){

    if (ident) out.coinType = out.packageId + "::" + ident + "::" + ident.toUpperCase();

    // Only objects this transaction created, and only ones parameterised by the
    // coin type just published. objectChanges also reports the mutated gas coin,

    // freshly minted supply.

      } else continue;
      if (!t || t.replace(/0x0*/g, "").indexOf(mine) < 0) continue;
      if (t.indexOf("::coin::TreasuryCap<") >= 0) out.capId = id;
      else if (t.indexOf("::coin::CoinMetadata<") >= 0) out.metaId = id;

  function gqlOnce(url, query, variables){

   * throws TypeError "Failed to fetch". Most callers catch that and quietly
   * degrade, which is why the site looks healthy; coinsOfExact does not, so the
   * bridge burn surfaced it as a bare "Failed to fetch" and redeem could never
   * complete. /api/sui-gql takes the browser out of the CORS equation. The

        var v = vaults[i];

        }

              typeArguments: [Ttype, Qtype, A],

  async function vicefunRewardsFor(addr){

    var j = {};
    try { j = await r.json(); } catch (e) {}

  function paintRewardsCardCanvas(canvas, res, markImg){

    var rowH = 32;

    drawRoundedRectPath(ctx, 36, 36, W - 72, H - 72, 24);

    ctx.lineWidth = 2;
    ctx.stroke();
    drawRoundedRectPath(ctx, 48, 48, W - 96, H - 96, 18);
    ctx.strokeStyle = "rgba(202,161,74,0.35)";

    if (markImg){

  function basketPlan(){
    var legs = state.bLegs || [];
    if (legs.length < 2 || legs.length > 3) return { error: "Use 2 or 3 assets" };
    var seed = wholeBig(state.bSeed);
    var capN = wholeBig(state.bCap);
    if (!(seed > 0n)) return { error: "Seed shares must be a whole number above 0" };
    if (capN < seed) return { error: "Share cap must be at least the seed" };
    var usd = Number(state.bUsd);
    if (!(usd > 0)) return { error: "Dollars per share must be above 0" };
    var raw = [];
    var sum = 0;
    var seen = {};
    for (var i = 0; i < legs.length; i++){
      var q = String(legs[i].q || "");
      if (CREATE_QUOTES.indexOf(q) < 0) return { error: "Asset "+(i+1)+" is not on the Create list" };
      if (seen[q]) return { error: q+" is listed twice" };
      seen[q] = 1;
      var w = Number(legs[i].weight);
      if (!(w > 0)) return { error: q+" weight must be above 0" };
      raw.push(w);
      sum += w;
    }
    var out = [];
    for (var j = 0; j < legs.length; j++){
      var lab = String(legs[j].q);
      var px = quoteUsd(lab);
      if (!(px > 0)) return { error: "No USD price for "+lab+" yet" };
      var rec = quoteRec(lab);
      var human = (raw[j] / sum) * usd / px;
      var unitsStr = basketHumanStr(human, rec.decimals);
      var units = toSmallestBig(unitsStr, rec.decimals);
      if (!(units > 0n)) return { error: lab+" amount rounds to zero. Raise dollars per share." };
      var pay = basketMintDeposit(units * seed, basketOwnerBps());
      if (pay > 18446744073709551615n) return { error: lab+" seed amount overflows" };
      var suiIn = 0n;
      if (lab !== "SUI"){
        var suiPx = quoteUsd("SUI");
        if (!(suiPx > 0)) return { error: "No USD price for SUI yet" };
        var paidHuman = Number(pay) / Math.pow(10, rec.decimals);
        var suiHuman = (paidHuman * px / suiPx) * 1.03;
        suiIn = toSmallestBig(basketHumanStr(suiHuman, 9), 9);
        if (!(suiIn > 0n)) return { error: "SUI amount for "+lab+" rounds to zero" };
      }
      out.push({
        q: lab,
        type: rec.type,
        units: units,
        pay: pay,
        suiIn: suiIn,
        decimals: rec.decimals,
        human: human,
        pct: raw[j] / sum * 100,
        px: px
      });
    }
    return { legs: out, seed: seed, cap: capN, usd: usd };
  }

  /**
   * Deposits locked on RH but not yet minted on Sui. Without this the wait for
   * Robinhood Chain finality is invisible and a perfectly healthy deposit looks
   * like it vanished.
   */
  /**
   * Wallet compatibility check.
   *
   * Bitget was only found to be broken because a real user hit it: it
   * advertised all four signing features and then fulfilled the request with a
   * result carrying no digest. Nothing in CI can catch that, because the bug
   * lives in a wallet extension we do not own. This lets anyone holding any
   * wallet exercise the real signing path on the real site and report back.
   *
   * Hidden unless ?walletcheck is in the URL, so it adds nothing to the normal
   * bridge UI.
   */
  function walletCheckOn(){
    try {
      return /(^|[?&])walletcheck(=|&|$)/i.test(String(location.search || "")) ||
             /walletcheck/i.test(String(location.hash || ""));
    } catch (e) { return false; }
  }

  /** A transaction of the same shape as a burn: a split plus a transfer. */
  async function walletCheckTx(){
    var Transaction = await loadTransaction();
    var tx = new Transaction();
    tx.setSender(suiSession.address);
    var split = tx.splitCoins(tx.gas, [txAmt(1n)]);
    var coin = Array.isArray(split) ? split[0] : split;
    // Back to the sender: if the execute step is ever run, it moves 1 MIST to
    // the tester themselves and costs only gas.
    tx.transferObjects([coin], suiSession.address);
    return tx;
  }

  /**
   * Sign-only by default: sui:signTransaction produces a signature without
   * broadcasting, so the default run cannot move anything or cost anything.
   * `execute` additionally exercises the signAndExecute path — the one Bitget
   * failed — by really submitting the 1 MIST self-transfer above.
   */
  async function walletCheckRun(execute){
    var out = { wallet: walletLabel(suiSession.wallet) || "unknown", steps: [], features: [] };
    var w = suiSession.wallet;
    if (!w) { out.steps.push({ step: "connect", ok: false, detail: "no wallet connected" }); return out; }
    var feats = w.features || {};
    out.features = ["sui:signTransaction","sui:signTransactionBlock",
                    "sui:signAndExecuteTransaction","sui:signAndExecuteTransactionBlock"]
                   .filter(function(k){ return !!feats[k]; })
                   .map(function(k){ return k.replace("sui:",""); });

    var tx = null;
    try { tx = await walletCheckTx(); out.steps.push({ step: "build tx", ok: true }); }
    catch (e){ out.steps.push({ step: "build tx", ok: false, detail: walletErrText(e) }); return out; }

    var bytes = null;
    try { bytes = await buildTxBytes(tx); out.steps.push({ step: "serialize", ok: !!bytes }); }
    catch (e){ out.steps.push({ step: "serialize", ok: false, detail: walletErrText(e) }); }

    var signTx = feats["sui:signTransaction"] && feats["sui:signTransaction"].signTransaction;
    if (signTx){
      try {
        var signed = await signTx({ transaction: tx, account: suiSession.account, chain: "sui:mainnet" });
        var sig = signed && signed.signature;
        out.steps.push({ step: "signTransaction (no broadcast)", ok: !!sig,
                         detail: sig ? "signature returned" : "resolved without a signature" });
      } catch (e){
        out.steps.push({ step: "signTransaction (no broadcast)", ok: false, detail: walletErrText(e) });
      }
    } else {
      out.steps.push({ step: "signTransaction (no broadcast)", ok: false, detail: "feature not exposed" });
    }

    if (execute){
      try {
        var res = await walletExec(tx);
        var dg = txDigest(res);
        out.steps.push({ step: "signAndExecute (1 MIST to self)", ok: !!dg,
                         detail: dg ? ("digest "+String(dg).slice(0,12)+"…")
                                    : "resolved with NO digest — this is the Bitget failure" });
      } catch (e){
        out.steps.push({ step: "signAndExecute (1 MIST to self)", ok: false, detail: walletErrText(e) });
      }
    }
    return out;
  }

  function lockDefaultTok(){
    return padType(normType(window.ARENA_VICEFUN_TYPE || SUI_TYPE));
  }
  function lockParseAmt(human, decimals){
    var s = String(human || "").trim().replace(/,/g, "");
    if (!s || !isFinite(Number(s)) || Number(s) <= 0) throw new Error("Enter an amount");
    var d = Number(decimals);
    if (!(d >= 0)) d = 9;
    var parts = s.split(".");
    var whole = (parts[0] || "0").replace(/^0+(?=\d)/, "") || "0";
    var frac = (parts[1] || "").slice(0, d);
    while (frac.length < d) frac += "0";
    return BigInt(whole) * (10n ** BigInt(d)) + BigInt(frac || "0");
  }
  function lockDaysMs(n){
    return Math.round(Number(n) * 86400000);
  }
  function lockTickOf(type){
    var t = padType(normType(type || ""));
    if (t === padType(normType(SUI_TYPE))) return "SUI";
    if (window.ARENA_VICEFUN_TYPE && t === padType(normType(window.ARENA_VICEFUN_TYPE))) return "VICEFUN";
    var parts = String(type || "").split("::");
    return (parts[parts.length - 1] || "TOKEN").toUpperCase();
  }
  function lockCoinTypeFromObj(objType){
    var m = String(objType || "").match(/<(.+)>$/);
    return m ? m[1] : "";

  async function fetchVicelockEntries(filterAddr){
    var pkg = window.VICELOCK_PKG;
    if (!pkg) return [];
    var lockType = pkg + "::token_locker::TokensLocked";
    var vestType = pkg + "::vesting_schedule::VestingScheduleCreated";
    var q = "query($t:String!){ events(last:40, filter:{ type:$t }){ nodes { contents { json } } } }";
    var lockPage, vestPage;
    try {
      lockPage = await gql(q, { t: lockType });
      vestPage = await gql(q, { t: vestType });
    } catch (e) { return []; }
    var lockNodes = (lockPage && lockPage.events && lockPage.events.nodes) || [];
    var vestNodes = (vestPage && vestPage.events && vestPage.events.nodes) || [];
    var out = [];
    var seen = {};
    async function one(n, kind){
      var f = (n.contents && n.contents.json) || {};
      var id = decodeLockObjId(f.lock_id || f.wallet_id || f.schedule_id || f.vesting_id || f.id);
      if (!id || seen[id]) return;
      seen[id] = 1;
      var obj;
      try { obj = await moveObject(id); } catch (e) { return; }
      var fields = (obj && obj.json) || {};
      var ben = String(fields.beneficiary || f.beneficiary || "");
      if (filterAddr && padAddr(ben) !== padAddr(filterAddr)) return;
      var bal = lockFieldBal(fields, kind === "vest" ? (f.total_amount || "0") : (f.amount || "0"));
      if (!(bal > 0n)) return;
      var tokenType = lockCoinTypeFromObj(obj.type) || String(f.token_type || "");
      var decimals = 9;
      try { decimals = await lockDecimalsOf(tokenType); } catch (e) {}
      out.push({
        id: id,
        type: kind,
        tokenType: tokenType,
        balance: String(bal),
        decimals: decimals == null ? 9 : decimals,
        beneficiary: ben,
        creator: String(fields.creator || f.creator || ""),
        unlockTime: Number(fields.unlock_time || f.unlock_time || 0),
        cliffTime: Number(fields.cliff_time || f.cliff_time || 0),
        endTime: Number(fields.end_time || f.end_time || 0),
        totalAmount: String(fields.total_amount || f.total_amount || "0"),
        claimed: String(fields.claimed || "0")
      });
    }
    for (var i = 0; i < lockNodes.length; i++) await one(lockNodes[i], "lock");
    for (var j = 0; j < vestNodes.length; j++) await one(vestNodes[j], "vest");
    return out;
  }

  async function queryStockMinted(limit){

          method: "POST",

        }).then(function(r){ return r.json(); });

  // --- RH redeem preflight -------------------------------------------------
  // StockLockVault.release(depositId,to) is all-or-nothing per deposit, so the
  // keeper can only pay a burn that equals a FIFO prefix-sum of whole
  // unreleased locks. A burn that does not is irreversible on Sui but only
  // partly (or never) paid on RH — the leftover is not retried and the coins
  // are already gone. So refuse to build that burn in the first place and tell
  // the user exactly what is redeemable. Mirrors keepers-stocks/src/matchFifo.ts.
  var RH_NEXT_DEPOSIT_ID_SEL = "0x8070a4bd"; // nextDepositId()
  var RH_GET_LOCK_SEL = "0xd68f4dd1";        // getLock(uint256)

  /** RH base units per wrapper unit, e.g. 18dp RH -> 9dp wrap = 1e9. */
  function rhToSuiScale(st){
    var rhDec = stockBridgeDecimals(st, false);
    var suiDec = stockBridgeDecimals(st, true);
    var d = rhDec - suiDec;
    if (!(d >= 0)) throw new Error("bad decimals for "+(st && st.ticker));
    return 10n ** BigInt(d);
  }

  /**
   * One RH JSON-RPC call.
   *
   * Goes through our own /api/rh proxy first: the public RH endpoint
   * intermittently answers with a duplicated `Access-Control-Allow-Origin: *,*`
   * header that browsers reject (~half of requests, measured), which would
   * otherwise make the redeem preflight refuse legitimate burns at random.
   * Falls back to calling RH directly so this still works when the proxy is not
   * deployed (e.g. a static local preview).
   */

  async function rhRpc(method, params){
    var body = JSON.stringify({ jsonrpc:"2.0", id:1, method: method, params: params });
    var urls = ["/api/rh", window.ARENA_RH_RPC || "https://rpc.mainnet.chain.robinhood.com"];
    var lastErr = null;
    for (var i = 0; i < urls.length; i++){
      try {
        var res = await fetch(urls[i], {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: body
        });
        if (!res.ok){
          lastErr = new Error("RH RPC HTTP "+res.status);
          continue;
        }
        var j = await res.json();
        if (j && j.error) throw new Error("RH RPC: "+(j.error.message || method+" failed"));
        return j.result;
      } catch (e){
        lastErr = e;
      }
    }
    throw lastErr || new Error("RH RPC unavailable");
  }

  async function rhEthCall(to, data){
    var result = await rhRpc("eth_call", [{ to: to, data: data }, "latest"]);
    return String(result || "0x");
  }

  function rhWord(hex, i){
    var h = String(hex || "").replace(/^0x/, "");

  }

    var w = rhWord(hex, i);
    return w ? BigInt("0x"+w) : 0n;
  }
  function rhWordAddr(hex, i){
    return ("0x" + rhWord(hex, i).slice(-40)).toLowerCase();
  }
  function rhPad32(n){
    return n.toString(16).padStart(64, "0");
  }

  /** Unreleased locks for one RH token, oldest first. Read-only, no wallet. */

  async function rhUnreleasedLocks(vaultAddr, rhToken, scale){
    var next = await rhEthCall(vaultAddr, RH_NEXT_DEPOSIT_ID_SEL);
    var n = next && next !== "0x" ? BigInt(next) : 0n;
    if (n <= 1n) return [];
    var want = String(rhToken || "").toLowerCase();
    var out = [];
    // Sequential ids from 1; batch a few at a time to stay polite to the RPC.

    var ids = [];
    for (var i = 1n; i < n; i++) ids.push(i);
    for (var c = 0; c < ids.length; c += 8){
      var slice = ids.slice(c, c + 8);
      var parts = await Promise.all(slice.map(function(id){
        return rhEthCall(vaultAddr, RH_GET_LOCK_SEL + rhPad32(id)).then(function(d){
          return { id: id, data: d };
        }).catch(function(){ return null; });
      }));
      for (var p = 0; p < parts.length; p++){
        var part = parts[p];
        if (!part) continue;
        var hex = String(part.data || "").replace(/^0x/, "");
        if (hex.length < 320) continue;
        var depositor = rhWordAddr(part.data, 0);
        if (depositor === "0x0000000000000000000000000000000000000000") continue;
        var token = rhWordAddr(part.data, 1);
        if (token !== want) continue;
        if (rhWordBig(part.data, 4) !== 0n) continue; // released

        var amount = rhWordBig(part.data, 2);
        if (amount <= 0n) continue;
        out.push({ depositId: part.id, amount: amount, sui: amount / scale });
      }
    }
    out.sort(function(a,b){ return a.depositId < b.depositId ? -1 : a.depositId > b.depositId ? 1 : 0; });
    return out;
  }

  /**
   * Prefix sums of whole unreleased locks, in wrapper units — the only burn
   * amounts the keeper can pay in full. Dust locks (sui === 0) are skipped,
   * matching the keeper's own matcher.
   */

  function rhRedeemableAmounts(locks){
    var sums = [];
    var acc = 0n;
    for (var i = 0; i < locks.length; i++){
      if (locks[i].sui === 0n) continue;
      acc += locks[i].sui;
      sums.push(acc);
    }
    return sums;
  }

  function fmtWrap(v, dec){
    try { return fromBaseStr(v, dec); } catch (e) { return String(v); }
  }

  /**

  // --- RH finality + pending deposits --------------------------------------
  // The keeper only mints deposits that have reached Robinhood Chain's
  // L1-anchored `safe` block, because minting on Sui is irreversible and a
  // reorg would leave a wrapper with no collateral behind it. `safe` trails the
  // tip by roughly ten minutes, so a deposit is legitimately pending for a
  // while. Surface that honestly instead of letting the deposit look stuck.
  var RH_DEPOSIT_TOPIC0 =
    "0xcd369024a239038366adb9f97aeb7dc8fd7b4b4ff5aeeaf4d0717a8d4a5e0c6d";

  async function rhBlock(tagOrNumber){

  }

  /** Live finality lag, cached briefly. Null fields when the RPC is unhappy. */
  async function rhFinalityInfo(force){

    if (!force && _rhFinality.at && now - _rhFinality.at < 60000) return _rhFinality;
    try {
      var latest = await rhBlock("latest");
      var safe = await rhBlock("safe");
      if (latest && safe){
        _rhFinality = {
          at: now,
          tip: Number(BigInt(latest.number)),
          safeBlock: Number(BigInt(safe.number)),
          lagSec: Math.max(0, Number(BigInt(latest.timestamp)) - Number(BigInt(safe.timestamp)))
        };
      }
    } catch (e) { /* keep whatever we had */ }
    return _rhFinality;
  }

  function fmtEta(sec){
    if (!(sec > 0)) return "a few minutes";
    if (sec < 90) return "under a minute";
    var m = Math.round(sec / 60);
    return "~" + m + " min";

  /** vector<u8> from Sui parsedJson → string (number[], 0x-hex, or utf8). */
  function vecU8ToStr(v){
    try {
      if (Array.isArray(v)) return String.fromCharCode.apply(null, v.map(Number));
      if (typeof v === "string"){
        if (/^0x[0-9a-fA-F]+:\d+$/i.test(v)) return v;
        if (/^0x[0-9a-fA-F]*$/.test(v) && v.length % 2 === 0 && v.length > 10){
          var out = "";
          for (var i = 2; i < v.length; i += 2) out += String.fromCharCode(parseInt(v.slice(i, i+2), 16));
          if (out.indexOf(":") >= 0 || /^[\x20-\x7e]+$/.test(out)) return out;
        }
        if (/^[A-Za-z0-9+/]+=*$/.test(v) && v.length >= 8){
          try {
            var bin = atob(v);
            if (bin && (/^0x/i.test(bin) || bin.indexOf(":") >= 0 || /^[A-Za-z0-9]+$/.test(bin))) return bin;
          } catch (e0) {}
        }
        return v;
      }
    } catch (e) {}
    return "";
  }

  /**

   *   half of a redeem receipt — the burn alone tells the user nothing about
   *   whether their stock actually moved.
   */
  var RH_RELEASED_TOPIC0 =
    "0xa665ffb445611e4a69ea6bd353374f390a656906ea2da3245a8aae47a360a6cc";
  async function rhReleases(vaultAddr){
    var logs = await rhRpc("eth_getLogs", [
      { address: vaultAddr, fromBlock:"0x0", toBlock:"latest", topics:[RH_RELEASED_TOPIC0] }
    ]);

      if (String(l.address || "").toLowerCase() !== vaultAddr.toLowerCase()) return null;
      var t = l.topics || [];
      if (t.length < 4) return null;
      var data = String(l.data || "").replace(/^0x/, "");
      return {
        txHash: String(l.transactionHash || "").toLowerCase(),
        blockNumber: Number(BigInt(l.blockNumber)),
        token: ("0x"+String(t[1]).slice(-40)).toLowerCase(),
        to: ("0x"+String(t[2]).slice(-40)).toLowerCase(),
        suiBurnRef: String(t[3] || "").toLowerCase(),

    }).filter(Boolean).sort(function(a,b){ return a.blockNumber - b.blockNumber; });
  }

  /**
   * The connected wallet's redeems, paired with their RH release.
   *
   * Pairing is by (token, destination, amount) in block order rather than by
   * suiBurnRef, which would need keccak in the browser for no real gain: the
   * release carries the exact RH-scaled amount of its burn, so a same-amount
   * same-destination repeat still pairs correctly oldest-first.
   */
  async function loadMyBurns(vaultAddr){
    var sui = normSuiAddr(suiSession.address || "");
    if (!sui) return [];
    var burns = [];
    try {
      var rows = await queryStockRedeemed(50);
      for (var i = 0; i < rows.length; i++){
        if (normSuiAddr(rows[i].burner) !== sui) continue;
        burns.push(rows[i]);
      }
    } catch (e) { return []; }
    if (!burns.length) return [];

    var releases = [];
    try { releases = await rhReleases(vaultAddr); } catch (e) { /* status stays "settling" */ }
    var used = {};

    burns.sort(function(a,b){ return (a.ts || 0) - (b.ts || 0); });
    var out = burns.map(function(b){
      var tick = vecU8ToStr(b.ticker).trim().toUpperCase();
      var rec = STOCKS[tick] || null;
      var amt9 = BigInt(String(b.amount || "0"));
      var rhAmount = amt9 * 1000000000n;
      var token = rec ? String(rec.rhToken || "").toLowerCase() : "";
      var hit = null;
      for (var j = 0; j < releases.length; j++){
        var r = releases[j];
        if (used[r.txHash + ":" + j]) continue;
        if (token && r.token !== token) continue;
        if (b.rhDest && r.to !== b.rhDest) continue;
        if (r.amount !== rhAmount) continue;
        used[r.txHash + ":" + j] = true;
        hit = r;
        break;
      }
      return {
        ref: "burn:" + b.digest + ":" + b.eventSeq,
        dir: "out",
        ticker: tick || "?",
        amount: amt9,
        decimals: rec ? stockBridgeDecimals(rec, true) : 9,
        status: hit ? "released" : "settling",
        suiDigest: b.digest,
        rhTx: hit ? hit.txHash : "",
        rhDest: b.rhDest,
        ts: b.ts || 0
      };
    });
    out.sort(function(a,b){ return (b.ts || 0) - (a.ts || 0); });
    return out;
  }

  async function rhAllDeposits(vaultAddr){
    var logs = await rhRpc("eth_getLogs", [
      { address: vaultAddr, fromBlock:"0x0", toBlock:"latest", topics:[RH_DEPOSIT_TOPIC0] }
    ]);
    return (logs || []).map(function(log){
      var data = String(log.data || "").replace(/^0x/, "");
      if (data.length < 128) return null;
      if (String(log.address || "").toLowerCase() !== vaultAddr.toLowerCase()) return null;
      return {
        txHash: String(log.transactionHash || "").toLowerCase(),
        blockNumber: Number(BigInt(log.blockNumber)),
        token: ("0x" + String(log.topics[1] || "").slice(-40)).toLowerCase(),
        depositor: ("0x" + String(log.topics[2] || "").slice(-40)).toLowerCase(),
        depositId: BigInt(log.topics[3] || "0x0").toString(),
        amount: BigInt("0x" + data.slice(0, 64)),
        suiRecipient: ("0x" + data.slice(64, 128)).toLowerCase()
      };
    }).filter(Boolean);
  }

  /**
   * Deposits belonging to the connected wallets, with mint status.
   * Matched to mints by rh_ref (txHash:depositId), the same key the keeper
   * writes on-chain — exact, rather than guessing from amount and recipient.
   */
  async function loadPendingDeposits(){
    var vaultAddr = window.ARENA_RH_VAULT;
    if (!vaultAddr) return [];
    var sui = normSuiAddr(suiSession.address || "");
    var evm = String(evmSession.address || "").toLowerCase();
    if (!sui && !evm) return [];

    // Redeems are loaded alongside deposits: the panel used to be built from
    // DepositLocked alone, so a burn left no trace anywhere in the UI even
    // though it produced a Sui digest and an RH release transaction.
    var burnRows = await loadMyBurns(vaultAddr);

    var deposits = await rhAllDeposits(vaultAddr);
    var mine = deposits.filter(function(d){
      return (evm && d.depositor === evm) || (sui && normSuiAddr(d.suiRecipient) === sui);
    });
    if (!mine.length) return burnRows;

    var mintedRefs = {};
    try {
      var rows = await queryStockMinted(50);
      for (var i = 0; i < rows.length; i++){
        var ref = vecU8ToStr(rows[i].rhRef).trim().toLowerCase();
        if (ref){
          mintedRefs[ref] = rows[i].digest || true;
          if (ref.indexOf("0x") === 0) mintedRefs[ref.slice(2)] = rows[i].digest || true;
        }
      }
    } catch (e) { /* treat as "unknown"; rows below just stay pending */ }

    var fin = await rhFinalityInfo();
    return mine.map(function(d){
      var rec = null;
      for (var k in STOCKS) if (STOCKS[k].rhToken && STOCKS[k].rhToken.toLowerCase() === d.token) rec = STOCKS[k];
      var ref = String(d.txHash || "").toLowerCase() + ":" + String(d.depositId);
      var mintedDigest = mintedRefs[ref] || mintedRefs[ref.replace(/^0x/, "")];
      var status = mintedDigest ? "minted"
        : (fin.safeBlock != null && d.blockNumber > fin.safeBlock) ? "awaiting-finality"
        : "minting";
      var blocksLeft = (fin.safeBlock != null) ? Math.max(0, d.blockNumber - fin.safeBlock) : null;
      return {
        ref: ref,
        dir: "in",
        txHash: d.txHash,
        depositId: d.depositId,
        ticker: rec ? rec.ticker : "?",
        amount: d.amount,
        decimals: rec ? stockBridgeDecimals(rec, false) : 18,
        status: status,
        mintedDigest: typeof mintedDigest === "string" ? mintedDigest : "",
        blocksLeft: blocksLeft,
        etaSec: (status === "awaiting-finality" && fin.lagSec != null && fin.tip != null && blocksLeft != null && fin.tip > fin.safeBlock)
          ? Math.round(fin.lagSec * (blocksLeft / (fin.tip - fin.safeBlock)))
          : null
      };
    }).sort(function(a,b){ return Number(b.depositId) - Number(a.depositId); }).concat(burnRows);
  }

  /** Throws with an actionable message when `amount` is not fully payable. */

  async function assertRedeemable(st, amount){
    var vaultAddr = st.rhVault || window.ARENA_RH_VAULT;
    if (!vaultAddr) throw new Error("ARENA_RH_VAULT missing");
    if (!st.rhToken) throw new Error("RH token missing for "+st.ticker);
    var scale = rhToSuiScale(st);

    // Pooled (v2) vault: any amount is payable up to the backing, so only check
    // that the pool actually covers it.
    var pooled = await rhPooledBacking(vaultAddr, st.rhToken);
    if (pooled !== null){
      if (amount * scale > pooled){
        throw new Error(
          "Only "+fmtWrap(pooled / scale, stockBridgeDecimals(st, true))+" "+st.ticker+
          " is currently backed on Robinhood Chain, less than this redeem. Nothing was burned."
        );
      }
      return true;
    }


    var locks = await rhUnreleasedLocks(vaultAddr, st.rhToken, scale);
    var sums = rhRedeemableAmounts(locks);
    var dec = stockBridgeDecimals(st, true);
    if (!sums.length){
      throw new Error(
        "No "+st.ticker+" collateral is currently unlocked on Robinhood Chain, so this burn could not be paid out. "+
        "Burning is irreversible — nothing was burned. Try again once a deposit is outstanding."
      );

    }
    for (var i = 0; i < sums.length; i++) if (sums[i] === amount) return true;
    var max = sums[sums.length - 1];
    var best = null;
    for (var j = 0; j < sums.length; j++) if (sums[j] < amount) best = sums[j];
    var opts = sums.slice(0, 4).map(function(s){ return fmtWrap(s, dec); }).join(", ");
    var hint = amount > max
      ? ("Most that can be redeemed right now is "+fmtWrap(max, dec)+" "+st.ticker+".")
      : ("Nearest payable amount below yours is "+(best !== null ? fmtWrap(best, dec) : "none")+" "+st.ticker+".");
    throw new Error(
      "That amount can't be paid out in full yet. RH releases whole deposits, so only these amounts redeem cleanly right now: "+
      opts+(sums.length > 4 ? ", …" : "")+". "+hint+" Nothing was burned."
    );
  }


  async function doBridgeBurn(){
    /* sunset: Bridge tab removed — doBridgeBurn is a no-op */
    return;

    if (state.bridgeBusy) return;
    var st = stockRec(state.bridgeTick);
    var btn = $("#bridge-go");
    try {
      if (!suiSession.address) { openWalletPicker(); return; }
      if (!st.suiVault || !st.suiCoin) throw new Error("Vault or coin type missing for "+st.ticker);
      var amount = toSmallestBig(state.bridgeAmt, stockBridgeDecimals(st, true)); // Sui wrap = 9
      if (!(amount > 0n)) throw new Error("Enter an amount to burn");
      if (!isEvmAddr(state.bridgeRhDest)) throw new Error("Enter the RH wallet that should receive "+st.ticker+" — a Sui address can't receive it.");
      state.bridgeBusy = true;
      state.bridgeNote = "";
      state.bridgeNoteErr = false;
      if (btn){ btn.disabled = true; btn.textContent = "Building…"; }
      var bal = await coinBalanceOf(suiSession.address, st.suiCoin);
      if (bal < amount) throw new Error("Need "+fromBaseStr(amount, stockBridgeDecimals(st, true))+" "+st.ticker+" wrap. Wallet has "+fromBaseStr(bal, stockBridgeDecimals(st, true))+".");

      var feeParts = bridgeFeeParts(amount);
      if (feeParts.net <= 0n) throw new Error("Amount too small after 1% fee");
      // Preflight the RH payout BEFORE burning. bridge::burn destroys the coin
      // unconditionally; the release side can only pay whole unreleased
      // deposits, and an unpayable remainder is never retried. Refuse rather
      // than let the user burn into a partial (or zero) payout.
      if (btn) btn.textContent = "Checking RH…";
      await assertRedeemable(st, feeParts.net);

      var Transaction = await loadTransaction();
      var tx = new Transaction();
      tx.setSender(suiSession.address);
      // No hardcoded gas budget — a burn is one object-take + one moveCall,
      // the same class of tx as swap/vote/deposit elsewhere in this file,
      // none of which set a budget either. A fixed 0.05 SUI budget forced
      // the wallet's gas coin to hold that much even though the tx itself
      // costs a small fraction of it, so wallets under 0.05 SUI got
      // "Balance of gas object ... lower than the needed amount" even
      // though they had plenty to actually pay for the transaction.
      var coinArg = await takeSwapCoin(tx, st.suiCoin, amount);
      if (feeParts.fee > 0n){
        // partnerAddr() was never defined — the fee split shipped with a
        // dangling call, so every burn threw ReferenceError before reaching
        // bridge::burn. platformWallet() is the established Sui-side partner
        // (ARENA_SWAP_PARTNER), the same address the swap commission uses.
        // Not rhFeeAddr(): that is ARENA_RH_FEE, a 20-byte EVM address for the
        // RH side, and transferObjects needs a 32-byte Sui address.
        var feeTo = padAddr(platformWallet());
        if (!/^0x[0-9a-f]{64}$/.test(feeTo)){
          throw new Error("Bridge fee recipient is misconfigured — not burning.");
        }
        var feeSplit = tx.splitCoins(coinArg, [txAmt(feeParts.fee)]);
        var feeCoin = Array.isArray(feeSplit) ? feeSplit[0] : feeSplit;
        tx.transferObjects([feeCoin], feeTo);
      }
      var PKG = window.ARENA_STOCKS_PACKAGE;
      if (!PKG) throw new Error("ARENA_STOCKS_PACKAGE missing");
      var rhDestArg = txPureBytes(tx, evmAddrToBytes(state.bridgeRhDest));
      tx.moveCall({
        target: PKG + "::bridge::burn",
        typeArguments: [st.suiCoin],
        arguments: [tx.object(st.suiVault), coinArg, rhDestArg]
      });
      if (btn) btn.textContent = "Sign burn…";
      var burnStartedMs = Date.now();
      var result = await walletExec(tx);
      var digest = txDigest(result);
      if (!digest){
        // A wallet can resolve without throwing and still not have executed
        // anything — that is how a burn that never happened was being reported
        // as "Burned." Burning is irreversible, so confirm against chain
        // instead of inferring success from the absence of an exception.
        if (btn) btn.textContent = "Confirming…";
        var landed = await findRecentBurn({
          burner: suiSession.address,
          amount: feeParts.net,
          sinceMs: burnStartedMs - 15000
        });
        if (landed && landed.digest){
          digest = landed.digest;
        } else {
          // Name the wallet and what it actually exposes: a digest-less resolve
          // is almost always a signing feature the wallet does not implement
          // the way we called it, and that detail is what makes the next
          // report diagnosable.
          var wf = (suiSession.wallet && suiSession.wallet.features) || {};
          var have = ["sui:signTransaction","sui:signTransactionBlock",
                      "sui:signAndExecuteTransaction","sui:signAndExecuteTransactionBlock"]
                     .filter(function(k){ return !!wf[k]; })
                     .map(function(k){ return k.replace("sui:",""); });
          throw new Error(
            "Your wallet did not return a signed transaction, and no burn for this "+
            "amount has appeared on Sui. Nothing was burned — your "+st.ticker+
            " wrap is still in your wallet. Check the wallet is unlocked and connected, "+
            "then try again. (wallet: "+(walletLabel(suiSession.wallet) || "unknown")+
            "; signing: "+(have.length ? have.join(", ") : "none exposed")+")"
          );
        }
      }
      state.bridgeNote = "Burned. RedeemBurned emitted — RH unlock watcher picks it up. "+String(digest).slice(0,10)+"…";
      state.bridgeNoteErr = false;
      state.bridgeAmt = "";
      await refreshBridgeBal();
      if (state.route === "bridge") renderScreen();
    } catch (e) {
      var msg = (e && e.message) ? e.message : String(e || "burn failed");
      if (/reject|denied|cancelled|canceled/i.test(msg)) msg = "Wallet rejected the burn.";
      state.bridgeNote = msg;
      state.bridgeNoteErr = true;
      if (state.route === "bridge") renderScreen();
    } finally {
      state.bridgeBusy = false;
      if (state.route === "bridge") {
        var b2 = $("#bridge-go");
        if (b2 && state.bridgeDir !== "in" && suiSession.address){
          b2.disabled = false;
          b2.textContent = "Burn & redeem";
        }
      }
    }
  }

    var req = { message: message, account: suiSession.account, chain: "sui:mainnet" };
    var out;
    if (feats["sui:signPersonalMessage"] && feats["sui:signPersonalMessage"].signPersonalMessage){
      out = await feats["sui:signPersonalMessage"].signPersonalMessage(req);
    } else if (typeof w.signPersonalMessage === "function"){
      out = await w.signPersonalMessage(req);
    } else if (feats["sui:signMessage"] && feats["sui:signMessage"].signMessage){
      out = await feats["sui:signMessage"].signMessage(req);

    if (!sig) throw new Error("Wallet did not return a signature");

  // Mobile pickers (Android content:// URIs, iOS Photos) hand back a File that is
  // only a pointer to the original. After the page backgrounds for a wallet
  // signature, or a few minutes pass, reading it again can fail and fetch()
  // rejects with a bare "Failed to fetch" / "Load failed" before any request
  // reaches /api/upload. Copy the bytes into memory at pick time (downscaling
  // big stills) and upload that copy instead.
  var ART_SNAPS = typeof WeakMap === "function" ? new WeakMap() : null;
  var ART_MAX_BYTES = 2 * 1024 * 1024;
  var ART_SHRINK_OVER = 1024 * 1024;
  var ART_MAX_EDGE = 1024;
  function artName(file){ return String((file && file.name) || "token"); }
  function artCanvasBlob(file){
    return new Promise(function(resolve){
      if (typeof createImageBitmap !== "function" || typeof document === "undefined"){ resolve(null); return; }
      createImageBitmap(file).then(function(bmp){
        var w = bmp.width, h = bmp.height;
        var k = Math.min(1, ART_MAX_EDGE / Math.max(w, h || 1));
        var cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
        var c = document.createElement("canvas");
        c.width = cw; c.height = ch;
        var g = c.getContext("2d");
        if (!g){ resolve(null); return; }
        g.drawImage(bmp, 0, 0, cw, ch);
        if (bmp.close) bmp.close();
        var outType = file.type === "image/jpeg" ? "image/jpeg" : "image/png";
        c.toBlob(function(b){ resolve(b && b.size > 0 ? b : null); }, outType, 0.9);
      }).catch(function(){ resolve(null); });
    });
  }
  function snapshotArt(file){
    if (!file) return Promise.resolve(null);
    if (file.__artSnap) return Promise.resolve(file);
    if (ART_SNAPS && ART_SNAPS.has(file)) return ART_SNAPS.get(file);
    var p = (async function(){
      var buf;
      try {
        buf = await file.arrayBuffer();
      } catch (e) {
        throw new Error("could not read the image file. Re-select it and try again");
      }
      var type = file.type || "image/png";
      var blob = new Blob([buf], { type: type });
      var name = artName(file);
      if (type !== "image/gif" && blob.size > ART_SHRINK_OVER){
        var small = await artCanvasBlob(blob);
        if (small && small.size < blob.size){
          blob = small;
          type = small.type || type;
          name = name.replace(/\.[a-z0-9]+$/i, "") + (type === "image/jpeg" ? ".jpg" : ".png");
        }
      }
      if (blob.size > ART_MAX_BYTES) throw new Error("image is over 2MB");
      var out;
      try { out = new File([blob], name, { type: type }); } catch (e) { out = blob; out.name = name; }
      out.__artSnap = true;
      return out;
    })();
    if (ART_SNAPS) ART_SNAPS.set(file, p);
    p.catch(function(){ if (ART_SNAPS) ART_SNAPS.delete(file); });
    return p;
  }
  function postArt(snap, ticket){
    var fd = new FormData();
    fd.append("file", snap, artName(snap));
    fd.append("address", ticket.address);
    fd.append("signature", ticket.sig);
    fd.append("ts", ticket.ts);
    return fetch("/api/upload", { method: "POST", body: fd });
  }
  async function uploadArt(file){
    // Read the bytes before asking for a signature so a bad file fails fast.
    var snap = await snapshotArt(file);
    if (!snap) throw new Error("no image selected");
    var ticket = await signUploadTicket();
    var res;
    try {
      res = await postArt(snap, ticket);
    } catch (e) {
      // Network-level failure (flaky mobile data, app switch). One retry with the in-memory copy.
      await sleep(800);
      try {
        res = await postArt(snap, ticket);
      } catch (e2) {
        throw new Error("network error sending the image. Check your connection and retry");
      }
    }
    var raw = await res.text();
    var j = {};
    try { j = raw ? JSON.parse(raw) : {}; } catch (e) {}
    if (res.status === 413) throw new Error("image too large for upload. Use one under 2MB");
    if (!res.ok || !j.url) throw new Error(j.error || ("upload failed (" + res.status + ")"));
    return j.url;
  }

    for (var i = 0; i < legsIn.length; i++){

      var base;
      try { base = BigInt(leg.units) * BigInt(shares); }
      catch (e) { return { error: "Basket recipe units are not a number" }; }

      var pay = basketMintDeposit(base, Number(basket.mintFeeBps) || 0);
      var suiIn = 0n;
      if (leg.q === "SUI") suiNeed += pay;
      else {

        if (!(px > 0) || !(suiPx > 0)) return { error: "No USD price for "+leg.q };

  /// Cetus CLMM hop (USDC ↔ USDY). Returns the output Coin.
  function cetusHop(tx, snap, fromType, coinIn){
    if (!snap || !snap.a || !snap.b) throw new Error("Cetus pool types missing");
    var a2b = a2bFor(snap, fromType);
    var amountArg = nested0(tx.moveCall({
      target: "0x2::coin::value",
      typeArguments: [fromType],
      arguments: [coinIn]
    }));
    var res = tx.moveCall({
      target: window.ARENA_CETUS_CLMM + "::pool::flash_swap",
      typeArguments: [snap.a, snap.b],
      arguments: [
        tx.object(window.ARENA_CETUS_CONFIG),
        tx.object(snap.id),
        txPure(tx, "bool", a2b),
        txPure(tx, "bool", true),
        amountArg,
        txPure(tx, "u128", cetusSqrtLimit(a2b)),
        tx.object(window.ARENA_CLOCK || "0x6")
      ]
    });
    var receiveA = res[0];
    var receiveB = res[1];
    var receipt = res[2];
    var payAmt = nested0(tx.moveCall({
      target: window.ARENA_CETUS_CLMM + "::pool::swap_pay_amount",
      typeArguments: [snap.a, snap.b],
      arguments: [receipt]
    }));
    var paySplit = tx.splitCoins(coinIn, [payAmt]);
    var payCoin = Array.isArray(paySplit) ? paySplit[0] : paySplit;
    var payBal = coinIntoBalance(tx, fromType, payCoin);
    var payA = a2b ? payBal : zeroBalance(tx, snap.a);
    var payB = a2b ? zeroBalance(tx, snap.b) : payBal;
    tx.moveCall({
      target: window.ARENA_CETUS_CLMM + "::pool::repay_flash_swap",
      typeArguments: [snap.a, snap.b],
      arguments: [
        tx.object(window.ARENA_CETUS_CONFIG),
        tx.object(snap.id),
        payA,
        payB,
        receipt
      ]
    });
    tx.transferObjects([coinIn], suiSession.address);
    var dust = coinFromBalance(tx, a2b ? snap.a : snap.b, a2b ? receiveA : receiveB);
    tx.transferObjects([dust], suiSession.address);
    return coinFromBalance(tx, a2b ? snap.b : snap.a, a2b ? receiveB : receiveA);
  }
  // 7k settle::settle aborts with code 0 when the routed output is below min_out.
  function isAggregatorSlipAbort(e){
    var m = String((e && e.message) || e || "");
    if (!/MoveAbort/.test(m)) return false;
    // JSON-RPC style: MoveAbort(MoveLocation { ... name: Identifier("settle") ... }, 0)
    if (/name: (Identifier\()?"settle"/.test(m) && /\}, 0\)/.test(m)) return true;
    // gRPC / GraphQL style: abort code: 0, in '0x…::settle::settle'
    return /abort code: 0\b/.test(m) && /::settle::settle/.test(m);
  }
  async function sevenkOnto(tx, coinIn, fromType, toType, amountIn, slip){
    var sdk = await loadSevenK();
    var q = await sdk.getQuote({ tokenIn: fromType, tokenOut: toType, amountIn: String(amountIn) });
    if (!q || !(q.returnAmountWithDecimal || q.returnAmount)) throw new Error("No 7k route " + fromType.split("::").pop() + " → " + toType.split("::").pop());
    var built = await sdk.buildTx({
      quoteResponse: q,
      accountAddress: suiSession.address,
      slippage: (slip > 0 && slip < 0.2) ? slip : SWAP_SLIP,
      commission: { partner: window.ARENA_SWAP_PARTNER, commissionBps: 0 },
      extendTx: { tx: tx, coinIn: coinIn }
    });
    tx = (built && built.tx) || tx;
    if (!(built && built.coinOut)) throw new Error("7k did not return an output coin");
    return { tx: tx, coinOut: built.coinOut };
  }
  /// Exact quote-coin output of the Bluefin sell leg, from a dry run of that leg
  /// alone. The spot estimate is off by the pool fee plus impact, and the 7k
  /// quote must match the real coin: 7k splits its amount off the coin and hands
  /// the rest back, so a low guess leaves quote dust and a high one aborts.
  async function sellLegQuoteOut(insta, fromType, amount, outType){
    try {
      var Transaction = await loadTransaction();
      var t = new Transaction();
      t.setSender(suiSession.address);
      var c = await takeSwapCoin(t, fromType, amount);
      t.transferObjects([bluefinHop(t, insta, fromType, c, 0)], suiSession.address);
      var dry = await rpcJson("sui_dryRunTransactionBlock", [toB64(await buildTxBytes(t))]);
      var st = dry && dry.effects && dry.effects.status;
      if (!st || st.status !== "success") return 0n;
      var want = normType(outType);
      var got = 0n;
      (dry.balanceChanges || []).forEach(function(b){
        var who = b && b.owner && (b.owner.AddressOwner || b.owner.address);
        if (who && sameAddr(who, suiSession.address) && normType(b.coinType) === want) got += asBigAmt(b.amount);
      });
      return got > 0n ? got : 0n;
    } catch (e) { return 0n; }
  }
  /// Any quote with no dedicated SUI route: the quote coin from the sell leg →
  /// SUI through 7k, same PTB. 7k gets 99.5% of the dry-run amount so a small
  /// pool move can't short the split; the sliver left over goes back into the
  /// token on the same pool, so the seller keeps no quote dust.
  async function sellQuoteVia7k(tx, tk, insta, q, Qtype, qOut, amount, slip){
    var exactQ = await sellLegQuoteOut(insta, tokenTypeOf(tk), amount, Qtype);
    // No dry run (RPC down): spot estimate less 3% more, since Instadex pools charge
    // 2% and the spot math only takes 1%.
    var quoteAmt = exactQ > 0n ? (exactQ * 995n) / 1000n : (estimatePoolOut(insta, tokenTypeOf(tk), amount) * 97n) / 100n;
    if (!(quoteAmt > 0n)) throw new Error("No "+q+" in the pool to hop back to SUI");
    var sp = tx.splitCoins(qOut, [txAmt(quoteAmt)]);
    var back = await sevenkOnto(tx, Array.isArray(sp) ? sp[0] : sp, Qtype, SUI_TYPE, quoteAmt, slip);
    tx = back.tx;
    tx.transferObjects([bluefinHop(tx, insta, Qtype, qOut, 0)], suiSession.address);
    return back;
  }
  // splitCoins came up short: the pool moved between the dry run and signing.

        var quoted = BigInt(String(swapQuote.amountOut));
        var bps = swapQuote.venue === "bluefin" ? 9000n : BigInt(Math.round((1 - SWAP_SLIP) * 10000));
        minOut = (quoted * bps) / 10000n;

            // before signing. Re-quote (fresh dry run) with wider slippage, as #58.
            if (hopTry >= 2 || isWalletReject(hopErr) || !(isAggregatorSlipAbort(hopErr) || isSellLegShortAbort(hopErr))) throw hopErr;
            hopSlip = hopTry === 0 ? 0.05 : 0.08;

        if (can7k){
          try {
            result = await swapVia7k(tk, amount);
          } catch (e7) {
            result = await swapViaBluefin(tk, amount, minOut);
          }
        } else {
          result = await swapViaBluefin(tk, amount, minOut);
        }
      }
      var digest = txDigest(result);

        btn.textContent = digest ? ("Swapped · " + String(digest).slice(0, 8)) : "Swapped";
      }

      if (!hasSuiWallet() && !suiSession.address){

      }

      if (!CALL) throw new Error("ARENA_COLLECT_PACKAGE missing");
      var Ttype = normType(typeNameStr(tk.token) || demoTypeId(tk));
      if (!Ttype || Ttype.indexOf("::") < 0){
        if (tk.bluefinPool) Ttype = normType((await poolSnap(tk.bluefinPool)).a);
      }
      var q = poolQuote(tk);
      var rec = quoteRec(q);
      var Qtype = rec.type;

      tk.mintLock = mint;
      if (Ttype) tk.token = Ttype;
      var tx = new Transaction();
      tx.setSender(suiSession.address);
      if (!rewardsVaultByLock(tk.lockId) && !tk.yieldHydrated){

      }
      var yv = rewardsVaultByLock(tk.lockId);
      if (yv && yv.kind === "basket" && (yv.basket_id || yv.yield_id)){
        // Basket yield: vault staging, no Pit.
        tx.moveCall({
          target: CALL + "::launch::collect_instadex_fees_basket_yield",
          typeArguments: [Ttype, Qtype],
          arguments: [
            tx.object(tk.lockId),
            tx.object(mint),
            tx.object(yv.basket_id || yv.yield_id),
            tx.object(window.ARENA_CLOCK || "0x6"),
            tx.object(window.ARENA_BLUEFIN_CONFIG),
            tx.object(tk.bluefinPool),
            tx.object(window.ARENA_CONFIG)
          ]
        });
      } else if (yv && yv.kind === "holder" && yv.yield_id){
        tx.moveCall({
          target: CALL + "::launch::collect_instadex_fees_holder_yield",
          typeArguments: [Ttype, Qtype],
          arguments: [
            tx.object(tk.lockId),
            tx.object(mint),
            tx.object(yv.yield_id),
            tx.object(window.ARENA_CLOCK || "0x6"),
            tx.object(window.ARENA_BLUEFIN_CONFIG),
            tx.object(tk.bluefinPool),
            tx.object(window.ARENA_CONFIG)
          ]
        });
      } else {
        var pit = rec.pit;
        if (!pit) throw new Error("The pot for "+q+" is not registered yet. Collect needs an official pot.");
        tx.moveCall({
          target: CALL + "::launch::collect_instadex_fees",
          typeArguments: [Ttype, Qtype],
          arguments: [
            tx.object(tk.lockId),
            tx.object(mint),
            tx.object(window.ARENA_CLOCK || "0x6"),
            tx.object(window.ARENA_BLUEFIN_CONFIG),
            tx.object(tk.bluefinPool),
            tx.object(window.ARENA_CONFIG),
            tx.object(pit)
          ]
        });
      }
      var result = await walletExec(tx);
      var digest = result && (result.digest || (result.effects && result.effects.transactionDigest) || result.transactionDigest);
      if (btn){ btn.disabled = false; btn.textContent = digest ? ("Collected · " + String(digest).slice(0, 8)) : "Collected"; }

        if (btn) btn.title = yv.kind === "basket"
          ? "Rewards slice staged for the RWA basket, then pushed to holders."
          : "Rewards slice funded for holders of this token.";
      }
    } catch (err){
      var msg = (err && err.message) ? err.message : String(err || "Collect failed");
      if (btn){ btn.disabled = false; btn.textContent = msg.length > 28 ? "Collect failed" : msg; }
    }
  }
