<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arena — Fair launches on Sui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141615; --card:#1C1E1C; --ink:#F4F4F2; --muted:#8B8E86; --line:#2A2C28;
  --lift:#242624; --sui:#298DFF; --lime:#298DFF; --up:#298DFF; --down:#FF6640;
  --radius:22px; --shadow:0 10px 28px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
html{overflow-x:hidden}
body{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background-image:radial-gradient(900px 480px at -10% -10%,rgba(41,141,255,.16),transparent 58%)}
a{color:var(--sui);text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(41,141,255,.45)}
.shell{width:min(1180px,calc(100% - 32px));margin:0 auto}
.serif{font-family:"Instrument Serif",Georgia,serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:40;background:rgba(20,22,21,.86);backdrop-filter:blur(16px);border-bottom:1px solid transparent}
.topbar-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:14px 0;min-height:64px}
.brand{display:flex;align-items:center;gap:9px;flex:none;cursor:pointer}
.brand svg{display:block}
.brand-name{font-family:"Instrument Serif",Georgia,serif;font-size:18px;letter-spacing:.2em;line-height:1;text-transform:uppercase}
.nav-pill{display:flex;align-items:center;gap:4px;margin:0;justify-self:center;background:#101211;border-radius:999px;padding:4px}
.nav-item{padding:8px 18px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.nav-item.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.nav-item:hover{color:var(--ink)}
.btn-connect{background:var(--sui);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;justify-self:end;transition:filter .15s}
.btn-connect:hover{filter:brightness(.97)}
.search-row{display:flex;align-items:center;gap:10px;margin:8px auto 6px}
.search-bar{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:12px 16px;box-shadow:var(--shadow);min-width:0}
.search-bar svg{flex:none;opacity:.45}
.search-bar input{flex:1;border:0;outline:none;background:transparent;min-width:0;font-size:15px}
.search-bar input::placeholder{color:#9CA3AF}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);background:#16171A;border-radius:6px;padding:3px 7px;flex:none}
.btn-create{background:var(--card);border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;cursor:pointer;color:var(--ink)}
.btn-create:hover{background:var(--lift)}
main{padding:18px 0 72px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.explore-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:10px 0 22px}
.explore-head h1{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-size:clamp(28px,4vw,40px);font-weight:700;margin:0;letter-spacing:-.03em;line-height:1.1}
.explore-head p{margin:8px 0 0;color:var(--muted);max-width:42ch}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.pill.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pill:hover{color:var(--ink)}
.sec-label{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 12px;font-weight:600}
.sec-label span{color:var(--muted);font-weight:500;font-size:13px}
.featured{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.feat{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .18s,box-shadow .18s}
.feat:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.feat-top{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.diamond{width:11px;height:11px;transform:rotate(45deg);background:#fff;border-radius:2px}
.feat-name{font-weight:650;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-tick{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.btn-buy{margin-left:auto;background:var(--sui);color:#fff;border:0;border-radius:999px;padding:7px 12px;font-weight:650;font-size:13px;flex:none}
.feat-mcap{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.chg{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.feat-meta{display:flex;gap:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.pit-strip{margin:18px 0;background:var(--card);border-radius:28px;padding:18px 22px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;cursor:pointer}
.pit-strip:hover{box-shadow:0 14px 34px rgba(0,0,0,.4)}
.pit-kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pit-pot{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(28px,4vw,40px);line-height:1;margin-top:4px;font-weight:500;letter-spacing:-.04em}
.pit-right{text-align:right}
.launches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lcard{background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--shadow);cursor:pointer;min-width:0;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;gap:10px}
.lcard:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.4)}

.lcard-art img,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.art-field{display:flex;align-items:center;gap:14px}
.art-preview{width:72px;height:72px;border-radius:18px;background:#101211;overflow:hidden;display:grid;place-items:center;flex:none;font-family:"Instrument Serif",Georgia,serif;font-size:28px;color:rgba(255,255,255,.8)}
.art-preview img{width:100%;height:100%;object-fit:cover}
.art-field input[type=file]{font-size:13px;color:var(--muted)}
.art-note{font-size:12px;color:var(--muted);margin-top:6px}
.lcard-art{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;display:grid;place-items:center}
.lcard-art .art-letter{font-family:"Instrument Serif",Georgia,serif;font-size:64px;line-height:1;color:rgba(255,255,255,.92);letter-spacing:-.04em}
.lcard-art .chip{position:absolute;top:8px;left:8px;margin:0;background:rgba(16,18,17,.55);backdrop-filter:blur(8px);color:#fff}
.lcard.hot{background:var(--sui);color:#fff}
.lcard.hot .feat-tick,.lcard.hot .feat-meta,.lcard.hot .chip{color:rgba(255,255,255,.82)}
.lcard.hot .feat-mcap{color:#fff}
.lcard.hot .lcard-art .chip{background:rgba(0,0,0,.2);color:#fff}
.lcard.hot .bar{background:rgba(17,17,17,.18)}
.lcard.hot .bar>i{background:#fff}
.lcard.hot .ago{color:#fff}
.lcard-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ago{color:var(--lime);font-weight:650;font-variant-numeric:tabular-nums}
.count-pill{display:inline-flex;align-items:center;margin-left:10px;background:#101211;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);vertical-align:middle}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.bar-row .bar{flex:1;margin:0}
.bar-pct{font-size:12px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.lcard-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chip{font-size:11px;font-weight:600;border-radius:999px;padding:3px 8px;background:#16171A;color:var(--muted);margin-left:auto;white-space:nowrap}
.chip.live{color:#8EC5FF;background:rgba(41,141,255,.16)}
.chip.grad{color:#fff;background:var(--sui)}
.bar{height:4px;background:#101211;border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--lime);border-radius:99px}
.rowlist{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 1fr 90px 72px 120px 110px;gap:12px;align-items:center;padding:14px 4px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--lift)}
.footer{margin:48px auto 0;background:var(--card);border-radius:var(--radius);padding:28px 32px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px;color:var(--muted);font-size:13px}
.footer h4{margin:0 0 8px;color:var(--ink);font-size:14px}
.footer a,.footer div[data-go]{display:block;padding:3px 0;cursor:pointer;color:var(--muted)}
.footer a:hover,.footer div[data-go]:hover{color:var(--ink)}
.hero-card{background:var(--card);border-radius:var(--radius);padding:clamp(28px,4vw,48px);box-shadow:var(--shadow);text-align:center}
.hero-card h1{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(40px,8vw,88px);margin:8px 0 0;line-height:1;font-weight:400}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,380px);grid-template-areas:"main ticket";gap:14px;align-items:start}
.split>.split-main{grid-area:main}
.split>.ticket{grid-area:ticket}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.stat{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:18px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}
.tv-host{height:360px;width:100%;position:relative;background:#1C1D21;border-radius:16px;overflow:hidden}
.tv-host iframe{border:0;display:block;width:100%;height:100%}
.ticket{background:var(--card);border-radius:28px;padding:18px;box-shadow:var(--shadow);position:sticky;top:84px}
.sides{display:flex;background:#16171A;border-radius:999px;padding:4px}
.sides>div{flex:1;text-align:center;padding:10px;border-radius:999px;font-weight:650;cursor:pointer;color:var(--muted)}
.sides>div.on-buy{background:var(--lift);color:var(--ink)}
.sides>div.on-sell{background:#3A2422;color:#FF8A70}
.amt{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:26px;font-weight:650;outline:none;background:#16171A;color:var(--ink)}
.amt:focus{border-color:#298DFF;background:#1C1D21}
.chips{display:flex;gap:6px;margin-top:10px}
.chips>div{flex:1;text-align:center;background:#16171A;border-radius:999px;padding:8px 0;font-size:12px;font-weight:600;cursor:pointer}
.chips>div:hover{background:var(--lift)}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.fee-chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.fee-chip{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:2px 7px;opacity:.9}
.btn-trade{width:100%;border:0;border-radius:999px;padding:14px;font-weight:700;background:var(--sui);color:#fff;margin-top:12px}
.btn-trade.sell{background:#FECACA}

.tape-tabs{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tape-row{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,.9fr) 36px;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tape-row:hover{background:var(--lift)}
.tape-row.open{background:rgba(41,141,255,.08);border-radius:12px;border-bottom-color:transparent}
.tape-arrow{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.tape-arrow.buy{background:rgba(41,141,255,.18);color:#298DFF}
.tape-arrow.sell{background:rgba(255,102,64,.16);color:#FF6640}
.tape-sz{font-size:14px;font-weight:650;line-height:1.2}
.tape-sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:"IBM Plex Mono",monospace}
.tape-quote{text-align:right}
.tape-quote .tape-sz{font-family:"IBM Plex Mono",ui-monospace,monospace}
.tape-ago{text-align:right;color:var(--muted);font-size:12px}
.tape-fees{grid-column:1/-1;display:none;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.tape-row.open .tape-fees{display:flex}
.tape-count{margin-left:auto}

.form-grid{display:grid;gap:12px;text-align:left;max-width:520px;margin:28px auto 0}
.form-grid label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.form-grid input{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#16171A;outline:none;color:var(--ink)}
.form-grid input:focus{border-color:#298DFF;background:#1C1D21}
.toggle{display:flex;gap:8px;flex-wrap:wrap}
.back{font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:12px}
.back:hover{color:var(--ink)}
.token-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.token-head h1{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-size:clamp(28px,4.5vw,44px);margin:0;font-weight:700;letter-spacing:-.03em;line-height:1}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:650;border-radius:999px;padding:5px 10px;background:var(--card);box-shadow:var(--shadow)}

.about-card{padding:22px 24px;margin:14px 0 0}
.about-card h2{font-size:18px;font-weight:650;margin:0;letter-spacing:-.02em}
.about-desc{color:var(--muted);margin:10px 0 22px;max-width:56ch;line-height:1.5}
.about-metrics{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px;margin-bottom:22px}
.about-k{font-size:12px;color:var(--muted);font-weight:500}
.about-v{font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.04em;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.about-v .tick{font-size:14px;font-weight:550;color:var(--muted);margin-left:6px;letter-spacing:0}
.about-s{font-size:13px;color:var(--muted);margin-top:6px}
.about-links{display:flex;flex-wrap:wrap;gap:8px}
.about-link{display:inline-flex;align-items:center;gap:7px;background:#101211;border:0;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:none}
.about-link:hover{background:var(--lift);color:var(--ink)}
.about-link svg{flex:none;opacity:.9}
@media (max-width:860px){
  .about-metrics{grid-template-columns:1fr;gap:18px}
}
.holder-card{background:var(--card);border-radius:20px;padding:14px 18px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:12px 0}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}

.pit-hero{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 32px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"pot clock" "copy copy";gap:6px 40px;align-items:end;text-align:left}
.pit-hero .pit-pot{font-size:clamp(40px,5vw,64px);margin:6px 0 0;letter-spacing:-.05em}
.pit-hero .pit-clock{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(32px,4vw,48px);line-height:1;letter-spacing:-.04em;text-align:right}
.pit-hero .pit-clock span{display:block;margin-top:8px;font-size:13px;color:var(--muted);font-family:"Instrument Sans",sans-serif;letter-spacing:0;font-weight:500}
.pit-hero p{grid-area:copy;max-width:62ch;margin:14px 0 0;color:var(--muted)}
.pit-row{display:grid;grid-template-columns:40px 44px minmax(0,1.4fr) 100px 72px 80px;gap:10px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer}
.pit-row:first-child{border-top:0}
.pit-row:hover{background:transparent}
.pit-row .rank{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:13px}
.pit-row .cap{font-family:"IBM Plex Mono",monospace;font-weight:650;text-align:right}
.pit-row.lead{background:rgba(41,141,255,.1);border-radius:12px;padding:12px 8px;border-top:0;margin-top:2px}
.bell-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 2px;border-top:1px solid var(--line)}
.bell-row:first-of-type{border-top:0}
.bells-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.bell-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
.bell-card .feat-name{font-size:18px;margin-top:8px}
.bell-card .chip{margin-left:0}
html[data-route="pit"] .search-row,html[data-route="launch"] .search-row,html[data-route="token"] .search-row,html[data-route="metrics"] .search-row{display:none}
@media (max-width:860px){
  .pit-hero{grid-template-columns:1fr;grid-template-areas:"pot" "clock" "copy";text-align:left;padding:22px}
  .pit-hero .pit-clock{text-align:left;margin-top:10px}
  .pit-row{grid-template-columns:28px 36px minmax(0,1fr) 64px; }
  .pit-row .mode-col,.pit-row .chg{display:none}
  .bells-grid{grid-template-columns:1fr}
  [data-screen-label="Pit"] > .card:last-of-type{grid-template-columns:1fr!important}
}

.metrics-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:8px 0 18px}
.mstat{background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow)}
.mstat .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mstat .v{font-size:clamp(22px,3vw,32px);font-weight:650;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;font-family:"IBM Plex Mono",ui-monospace,monospace}
.mstat .s{margin-top:4px;font-size:12px;color:var(--muted)}
.vol-bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 0 0}
.vol-bars i{flex:1;background:var(--lime);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.fee-rows{display:grid;gap:10px}
.fee-row{display:grid;grid-template-columns:88px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.fee-row b{height:6px;border-radius:99px;background:#101211;overflow:hidden;display:block}
.fee-row b>i{display:block;height:100%;border-radius:99px}
.m-table{width:100%;border-collapse:collapse;font-size:14px}
.m-table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
.m-table td{padding:12px 6px;border-bottom:1px solid var(--line)}
.m-table tr{cursor:pointer}
.m-table tr:hover td{background:var(--lift)}
.m-note{margin-top:18px;font-size:12px;color:var(--muted);max-width:62ch}
@media (max-width:860px){
  .metrics-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .nav-item{padding:8px 12px;font-size:13px}
}
html.shot,html.shot *{animation:none!important;transition:none!important}
@media (max-width:1100px){
  .featured,.launches{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  .split,.grid-2,.footer,.stats{grid-template-columns:1fr}
  .split{grid-template-areas:"main" "ticket"}
  .ticket{position:static}
  .featured,.launches{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:24px 1fr 64px auto; }
  .row .spark,.row .st-col{display:none}
}
@media (max-width:720px){

  function metricsRollup(){
    const win = state.metricsWindow || "All";
    const cut = win === "24h" ? Date.now() - 86400000 : 0;
    const rows = (bus.trades || []).filter(function(t){ return (t.ts || 0) >= cut; });
    const out = {fills:rows.length, suiVol:0, xaumVol:0, suiFee:0, xaumFee:0, refl:0, creator:0, pit:0, plat:0, byPool:{}, hours:[]};
    const hourMap = {};
    rows.forEach(function(t){
      const q = poolQuote(t.pool_id);
      const amt = fromMist(t.quote_amount);
      const f = fromMist(t.reflection_fee)+fromMist(t.creator_fee)+fromMist(t.pit_fee)+fromMist(t.platform_fee);
      if (q === "XAUM"){ out.xaumVol += amt; out.xaumFee += f; }
      else { out.suiVol += amt; out.suiFee += f; }
      out.refl += fromMist(t.reflection_fee);
      out.creator += fromMist(t.creator_fee);
      out.pit += fromMist(t.pit_fee);
      out.plat += fromMist(t.platform_fee);
      const id = t.pool_id || "?";
      if (!out.byPool[id]) out.byPool[id] = {id:id, vol:0, fills:0, q:q};
      out.byPool[id].vol += amt;
      out.byPool[id].fills += 1;
      const h = Math.floor((t.ts||0)/3600000)*3600000;
      hourMap[h] = (hourMap[h]||0) + amt;
    });
    const hours = Object.keys(hourMap).map(Number).sort(function(a,b){return a-b;}).slice(-24);
    const max = hours.reduce(function(m,h){return Math.max(m, hourMap[h]);}, 0) || 1;
    out.hours = hours.map(function(h){ return {t:h, v:hourMap[h], pct: Math.max(4, hourMap[h]/max*100)}; });
    const claims = (bus.sub && bus.sub.claims) || [];
    out.claims = claims.length;
    out.reflClaims = claims.filter(function(c){ return Number(c.kind)===0; }).length;
    out.pitClaims = claims.filter(function(c){ return Number(c.kind)===1; }).length;
    out.launches = T.length;
    out.grads = GRADS.length;
    out.bells = BELLS.length;

    return out;

  function tvBars(sym){

    return Index.toCandles(trades, 60000).map(function(c){
      const t = Number(c.time);
      const ms = t > 0 && t < 1e12 ? t * 1000 : t;

  function staticDatafeed(ticker, candles, res, pricescale, quote){
    const desc = ticker + " / " + quote;
    return {
      onReady: function(cb){ setTimeout(function(){ cb({ supported_resolutions: [res], supports_time: true }); }, 0); },
      searchSymbols: function(){},
      resolveSymbol: function(_n, onResolve){
        setTimeout(function(){
          onResolve({
            name: ticker, ticker: ticker, description: desc, type: "crypto", session: "24x7", timezone: "Etc/UTC",
            minmov: 1, pricescale: pricescale, has_intraday: true, has_daily: true, supported_resolutions: [res],
            volume_precision: 2, data_status: "streaming", format: "price"
          });
        }, 0);
      },
      getBars: function(_s, _r, p, onResult){
        p = p || {};
        if (!candles.length){ onResult([], { noData: true }); return; }
        if (p.firstDataRequest){ onResult(candles, { noData: false }); return; }
        function asMs(x){ x = Number(x); if (!isFinite(x)) return NaN; return x < 1e12 ? x * 1000 : x; }
        var from = asMs(p.from), to = asMs(p.to);
        var bars = candles.filter(function(c){
          if (isFinite(from) && c.time < from) return false;
          if (isFinite(to) && c.time > to) return false;
          return true;
        });
        onResult(bars, { noData: bars.length === 0 });
      },
      subscribeBars: function(){},
      unsubscribeBars: function(){},
      getServerTime: function(cb){ cb(Math.floor(Date.now() / 1000)); }
    };
  }

    if (secs === ROUND_SECONDS) rollover();
    if (++bshift >= 20){
      bshift = 0;
      T.forEach(function(k){ k.buckets.shift(); k.buckets.push(0); k.fbuckets.shift(); k.fbuckets.push(0); });
    }
    paintLive();
  }, 1000);
  if (Index){
    hydrating = true;
    bus.index = Index.demoSnapshot(T, DEMO_WALLET);
    bus.sub = Index.subscribe({
      packageId: window.ARENA_PACKAGE_ID || "",
      rpc: window.SUI_RPC || "https://fullnode.mainnet.sui.io:443",
      tokens: T,
      live: !SHOT,
      demoMs: 1000,
      onTrade: function(ev){
        if (hydrating) return;
        if (Date.now() - (ev.ts||0) < 8000) applyLiveTrade(ev);
        paintTape();
        paintPx();
        updateChartLive();
      },
      onLaunch: function(l){
        bus.launches[l.pool_id] = l;
        if (l.symbol) bus.launches[l.symbol] = l;
      }
    });
    bus.trades = bus.sub.trades;
    hydrating = false;
    if (!SHOT){
      Index.loadIndex(window.ARENA_INDEX_URL).then(function(res){
        if (res && res.index) bus.index = res.index;
        paintHolder();
      }).catch(function(){ paintHolder(); });
    }
  }
  function loadHop(){
    function apply(d){
      const n = Number(d && (d.suiPerXaum || d.last_price));
      if (n > 0){ hop.suiPerXaum = n; hop.usd = Number(d.usd || d.last_price_usd)||null; hop.source = d.source || "Bluefin XAUM/SUI"; paintTicket(); }
    }
    fetch("/api/hop").then(function(r){ return r.ok ? r.json() : Promise.reject(); }).then(apply).catch(function(){
      fetch("https://api.dexpaprika.com/networks/sui/pools/0xe80e81a24dc18b5ce708bea23dc151385df291767db4b1cccb4517105f35aa17")
        .then(function(r){ return r.json(); }).then(apply).catch(function(){});
    });
  }
  loadHop();
  const parsed = parseHash();
  state.route = parsed.route;
  state.sym = parsed.sym;
  renderScreen();
})();
</script>
</body>
