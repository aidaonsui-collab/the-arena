<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arena — Fair launches on Sui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#191A1F;color:#F2F0EC;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:"Instrument Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;overflow-x:hidden}
a{color:#C9BBA3;text-decoration:none}
a:hover{color:#F2F0EC}
::selection{background:rgba(41,141,255,.34)}
input,button{font:inherit;color:inherit}
@keyframes ar-rise{0%{transform:translateY(30px) scale(.6);opacity:0}18%{opacity:.55}100%{transform:translateY(-220px) scale(1);opacity:0}}
@keyframes ar-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes ar-flame{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.14);opacity:1}}
@keyframes ar-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes ar-tape{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes ar-roll{0%{transform:translateY(-.42em);opacity:.2;color:#298DFF}100%{transform:none;opacity:1}}
@keyframes ar-draw{to{stroke-dashoffset:0}}
@keyframes ar-seam{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
@keyframes ar-sweep{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.btn-launch:hover{border-color:rgba(41,141,255,.8)!important;color:#F2F0EC!important;background:rgba(41,141,255,.08)!important}
.btn-connect:hover{background:#298DFF!important}
.card-top:hover{border-color:rgba(41,141,255,.5)!important;box-shadow:0 26px 70px rgba(0,0,0,.42)!important}
.link-pit:hover{color:#F2F0EC!important}
.row-bout:hover{background:rgba(255,255,255,.05)!important}
.chip:hover{border-color:rgba(41,141,255,.6)!important;color:#F2F0EC!important}
.btn-trade:hover{box-shadow:0 0 30px rgba(41,141,255,.45)!important}
.inp-amt:focus{border-color:rgba(41,141,255,.7)!important;outline:none}
html.fine-pointer,html.fine-pointer body,html.fine-pointer body *:not(input):not(textarea){cursor:none!important}
html.shot,html.shot *{animation:none!important}
html.shot [data-cursor]{display:none!important}
html.shot [data-plate],html.shot [data-mark],html.shot [data-herotype]{will-change:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div data-stage style="position:relative;min-height:100vh;background:radial-gradient(ellipse 130% 100% at 50% 24%,#23252D,#191A1F 60%,#15161A);isolation:isolate">

  <div data-cursor style="position:fixed;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:999px;border:1px solid rgba(41,141,255,.55);pointer-events:none;z-index:90;opacity:0;will-change:transform;mix-blend-mode:screen"><div style="position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:999px;background:#298DFF"></div></div>

  <div id="gate" style="position:fixed;inset:0;z-index:92;pointer-events:none;overflow:hidden;display:none">
    <div id="gate-seam" style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,#298DFF 30%,#C9BBA3 50%,#298DFF 70%,transparent);opacity:0;box-shadow:0 0 24px rgba(41,141,255,.8)"></div>
    <div id="gate-l" style="position:absolute;left:0;top:0;bottom:0;width:50.4%;background:linear-gradient(90deg,#1E2027,#282B34 62%,#34383F);border-right:1px solid rgba(201,187,163,.22);transition:transform .46s cubic-bezier(.76,0,.24,1);transform:translateX(-100%)">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.42) 0 2px,transparent 2px 34px);opacity:.7"></div>
    </div>
    <div id="gate-r" style="position:absolute;right:0;top:0;bottom:0;width:50.4%;background:linear-gradient(270deg,#1E2027,#282B34 62%,#34383F);border-left:1px solid rgba(201,187,163,.22);transition:transform .46s cubic-bezier(.76,0,.24,1);transform:translateX(100%)">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.42) 0 2px,transparent 2px 34px);opacity:.7"></div>
    </div>
  </div>

  <div data-topbar style="position:fixed;top:0;left:0;right:0;z-index:70;border-bottom:1px solid rgba(255,255,255,0);transition:background .4s ease,border-color .4s ease,backdrop-filter .4s ease">
    <div style="max-width:1280px;margin:0 auto;padding:0 clamp(18px,3.6vw,42px);height:68px;display:flex;align-items:center;gap:18px">
      <div data-magnet data-go="floor" style="display:flex;align-items:center;gap:11px">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="#298DFF" style="display:block;filter:drop-shadow(0 0 10px rgba(41,141,255,.55))" aria-hidden="true"><path d="M17.636 10.009a7.16 7.16 0 0 1 1.565 4.474 7.2 7.2 0 0 1-1.608 4.53l-.087.106-.023-.135a7 7 0 0 0-.07-.349c-.502-2.21-2.142-4.106-4.84-5.642-1.823-1.034-2.866-2.278-3.14-3.693-.177-.915-.046-1.834.209-2.62.254-.787.631-1.446.953-1.843l1.05-1.284a.46.46 0 0 1 .713 0l5.28 6.456zm1.66-1.283L12.26.123a.336.336 0 0 0-.52 0L4.704 8.726l-.023.029a9.33 9.33 0 0 0-2.07 5.872C2.612 19.803 6.816 24 12 24s9.388-4.197 9.388-9.373a9.32 9.32 0 0 0-2.07-5.871zM6.389 9.981l.63-.77.018.142q.023.17.055.34c.408 2.136 1.862 3.917 4.294 5.297 2.114 1.203 3.345 2.586 3.7 4.103a5.3 5.3 0 0 1 .109 1.801l-.004.034-.03.014A7.2 7.2 0 0 1 12 21.67c-3.976 0-7.2-3.218-7.2-7.188 0-1.705.594-3.27 1.587-4.503z"/></svg>
        <span style="font-family:Cinzel,serif;font-weight:600;font-size:14px;letter-spacing:.3em">ARENA</span>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:clamp(6px,1.4vw,14px)">
        <div data-magnet data-go="launch" class="btn-launch" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#C9BBA3;border:1px solid rgba(201,187,163,.3);padding:9px 15px;white-space:nowrap;transition:border-color .3s ease,color .3s ease,background .3s ease">Launch</div>
        <div data-magnet data-wallet class="btn-connect" id="wallet-btn" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#191A1F;background:#F2F0EC;padding:9px 15px;white-space:nowrap;transition:background .3s ease">Connect</div>
      </div>
    </div>
  </div>

  <div id="screens"></div>

  <div style="position:fixed;left:50%;bottom:clamp(14px,2.4vw,26px);transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:clamp(2px,1vw,6px);padding:7px;border-radius:999px;background:rgba(32,34,41,.8);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 18px 50px rgba(0,0,0,.45);max-width:calc(100vw - 24px)">
    <div id="dock-nav" style="display:contents"></div>
    <div style="width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 4px;flex:none"></div>
    <div style="display:flex;align-items:center;gap:7px;padding-right:9px;white-space:nowrap">
      <span style="width:5px;height:5px;border-radius:999px;background:#298DFF;box-shadow:0 0 8px #298DFF;animation:ar-breathe 1.5s ease-in-out infinite;flex:none"></span>
      <span data-clock style="font-family:'IBM Plex Mono',monospace;font-size:clamp(9px,2.4vw,10.5px);letter-spacing:.14em;color:#C9BBA3;font-variant-numeric:tabular-nums">1:36</span>
    </div>
  </div>
</div>
<script>
(function(){
  const GRAD = 2000;
  const ACCENT = "#298DFF";
  const ROUND_SECONDS = 96;
  const T = [
    {t:"VOLT",n:"Voltcats",b:"Nine lives, one curve. Currently clawing at graduation.",cap:4650,ch:31.3,h:612,st:"Graduating",mode:"Holders",c:"#298DFF",pit:true},
    {t:"IRON",n:"Ironclad",b:"Object-centric collateral. One vault, many blows.",cap:4380,ch:18.9,h:503,st:"Graduating",mode:"Buy & burn",c:"#8A99A8"},
    {t:"BRINE",n:"Brine",b:"Spreads so tight they sting. Order-book spray for Sui.",cap:2140,ch:9.6,h:466,st:"Live",mode:"Buy & burn",c:"#3FA0A8"},
    {t:"HEX",n:"Hexweaver",b:"Compose Move packages like hexes. No mercy for bad bytecode.",cap:1540,ch:22.5,h:328,st:"Live",mode:"Holders",c:"#9A7FB0"},
    {t:"SILK",n:"Silk",b:"Soft launch, sharp exits. A quiet book with teeth.",cap:1280,ch:-1.8,h:266,st:"Live",mode:"Holders",c:"#C9A97E"},
    {t:"NITE",n:"Night Market",b:"After-hours liquidity. The floor never really closes.",cap:1020,ch:-4.7,h:215,st:"Live",mode:"Holders",c:"#5A6472"},
    {t:"RAZR",n:"Razorfin",b:"Latency as a weapon. Built for the hot path.",cap:769,ch:41.0,h:169,st:"Live",mode:"Holders",c:"#C9A05A"},
    {t:"GLOW",n:"Glowmoth",b:"Drawn to the light. A moth that refuses to rug.",cap:454,ch:12.7,h:140,st:"Live",mode:"Holders",c:"#93B27C"},
    {t:"PBL",n:"Pebble",b:"Small stone, long throw. Microcaps with a spine.",cap:257,ch:8.2,h:118,st:"Live",mode:"Holders",c:"#7A7A70"},
    {t:"QUILL",n:"Quill",b:"Write once, settle forever.",cap:179,ch:3.1,h:96,st:"Live",mode:"Holders",c:"#9A8A6E"}
  ];
  T.forEach(function(k,i){
    const base = Math.max(2.4, k.cap/34);
    k.buckets = Array.from({length:12},function(_,j){return +(base*(0.42+Math.abs(Math.sin((i+1.7)*(j+2.3)))*0.95)).toFixed(2);});
    k.fbuckets = k.buckets.map(function(v){return Math.max(1, Math.round(v/2.6));});
  });
  const GRADS = [{t:"DUNE",n:"Dune",cap:12400},{t:"AXM",n:"Axiom",cap:9800},{t:"KRKN",n:"Kraken",cap:6100},{t:"ORBT",n:"Orbit",cap:3450}];
  const BELLS = [
    {t:"VOLT",n:"Voltcats",amt:34.20,ago:"1h",mode:"Holders"},
    {t:"IRON",n:"Ironclad",amt:41.90,ago:"3h",mode:"Buy & burn",burn:"9.1M"},
    {t:"BRINE",n:"Brine",amt:28.10,ago:"4h",mode:"Buy & burn",burn:"6.02M"}
  ];
  const ADDR = ["0x8f2a…ab71","0xa91c…d012","0x11c0…012f","0x70bb…4410","0xcc81…e203","0x5d0e…c801","0x09ae…3290","0xbb21…aa13"];
  let bshift = 0, pot = 31.94, prevPot = "", roundNo = 128, secs = ROUND_SECONDS;
  let tape = [
    {a:ADDR[0],s:"bought",amt:22.40,t:"VOLT",ago:"now"},
    {a:ADDR[1],s:"bought",amt:8.10,t:"IRON",ago:"1m"},
    {a:ADDR[2],s:"sold",amt:3.60,t:"RAZR",ago:"2m"},
    {a:ADDR[3],s:"bought",amt:5.00,t:"GLOW",ago:"4m"},
    {a:ADDR[4],s:"bought",amt:14.20,t:"BRINE",ago:"6m"},
    {a:ADDR[5],s:"sold",amt:2.20,t:"HEX",ago:"8m"},
    {a:ADDR[6],s:"bought",amt:6.80,t:"SILK",ago:"9m"},
    {a:ADDR[7],s:"bought",amt:1.40,t:"PBL",ago:"11m"}
  ];
  const state = {route:"floor", sym:"VOLT", gate:"idle", filter:"All", side:"Buy", amt:"1", connected:false};
  let balance = 48.60;
  const m = {x:-999,y:-999};
  const cur = {x:-999,y:-999,s:1,o:0};
  let hot = null, sy = 0;
  const t0 = Date.now();
  let gt = [], hashLock = false;
  const SHOT = /Headless/i.test(String(navigator.userAgent||"")) || /(?:^|[?&])shot=1(?:&|$)/.test(location.search);
  if (SHOT){ Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.google"]')).forEach(function(l){ l.disabled = true; l.remove(); }); }
  function cinema(){ return !window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  function fmt(n){ return n >= 1000 ? (n/1000).toFixed(2)+"k" : n.toFixed(2); }
  function money(n){ return fmt(n)+" SUI"; }
  function clockStr(){ return Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0"); }
  function $(s,r){ return (r||document).querySelector(s); }
  function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function spark(seed){
    let p = "", y = 18;
    for (let i=0;i<=24;i++){
      y += Math.sin(i*seed)*2.6 + (seed > 0.5 ? -0.55 : 0.42);
      y = Math.max(4, Math.min(26, y));
      p += (i?"L":"M")+(i*3.58).toFixed(1)+" "+y.toFixed(1);
    }
    return p;
  }
  function curve(seed){
    const pts = [];
    let y = 200;
    for (let i=0;i<=30;i++){
      y -= (Math.sin(i*seed)*7 + 5.4);
      y = Math.max(24, Math.min(210, y));
      pts.push([(i*20).toFixed(1), y.toFixed(1)]);
    }
    const line = pts.map(function(p,i){return (i?"L":"M")+p[0]+" "+p[1];}).join(" ");
    return {line:line, area:line+" L600 230 L0 230 Z", dotX:pts[pts.length-1][0], dotY:pts[pts.length-1][1]};
  }
  function stColor(k){ return k.st === "Graduating" ? ACCENT : "#9CA2AD"; }
  function stBorder(k){ return k.st === "Graduating" ? "rgba(41,141,255,.45)" : "rgba(255,255,255,.2)"; }
  function barPct(k){ return Math.min(100, k.cap/GRAD*100).toFixed(0)+"%"; }
  function chText(k){ return (k.ch>=0?"+":"")+k.ch.toFixed(1)+"%"; }
  function chColor(k){ return k.ch>=0 ? "#8FB07A" : "#C98A80"; }
  function rank(i){ return String(i+1).padStart(2,"0"); }
  function sortedT(){ return T.slice().sort(function(a,b){return b.cap-a.cap;}); }
  function vol(k){ return k.buckets.reduce(function(a,b){return a+b;},0); }
  function findT(sym){ return T.find(function(k){return k.t === (sym||"").toUpperCase();}) || T[0]; }
  function marksHTML(kind){
    const hero = kind === "hero";
    const sz = hero ? 8 : 6;
    const glow = hero ? 14 : 10;
    const fs = hero ? "10.5px" : "9.5px";
    const ls = hero ? ".16em" : ".14em";
    const gap = hero ? 7 : 6;
    const col = hero ? "rgba(242,240,236,.82)" : "rgba(242,240,236,.72)";
    const extra = hero ? ",0 0 3px rgba(0,0,0,.9)" : "";
    const wc = hero ? "will-change:transform;" : "";
    return T.map(function(k,i){
      const r = (0.92 - 0.6*Math.min(1, Math.sqrt(k.cap/GRAD))).toFixed(3);
      const a = (i*36 + (i%3)*9).toFixed(1);
      const sp = (0.8 + (i%4)*0.22).toFixed(2);
      const ang0 = parseFloat(a)*Math.PI/180;
      const lx = (Math.cos(ang0)*parseFloat(r)*50).toFixed(2);
      const ly = (Math.sin(ang0)*parseFloat(r)*50).toFixed(2);
      return '<div data-mark="'+k.t+'" data-r="'+r+'" data-a="'+a+'" data-sp="'+sp+'" style="position:absolute;left:calc(50% + '+lx+'%);top:calc(50% + '+ly+'%);width:0;height:0;transform:rotateX(-60deg);transform-style:preserve-3d;'+wc+'">'+
        '<div style="position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:'+gap+'px;white-space:nowrap">'+
          '<div style="width:'+sz+'px;height:'+sz+'px;transform:rotate(45deg);background:'+k.c+';box-shadow:0 0 '+glow+'px '+k.c+extra+'"></div>'+
          '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:'+fs+';letter-spacing:'+ls+';color:'+col+';text-shadow:0 1px 8px rgba(14,15,19,.9)">'+k.t+'</span>'+
        '</div></div>';
    }).join("");
  }
  function tapeHTML(pad){
    const p = pad == null ? 11 : pad;
    return tape.slice(0,8).map(function(r){
      return '<div style="display:flex;align-items:center;gap:12px;padding:'+p+'px 0;border-bottom:1px solid rgba(255,255,255,.1);font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;animation:ar-tape .4s cubic-bezier(.22,1,.36,1) both">'+
        '<span style="color:#7C838F;width:88px;overflow:hidden">'+r.a+'</span>'+
        '<span style="width:52px;color:'+(r.s==="bought"?"#8FB07A":"#C98A80")+'">'+r.s+'</span>'+
        '<span style="font-variant-numeric:tabular-nums">'+r.amt.toFixed(2)+'</span>'+
        '<span style="color:#9CA2AD">'+r.t+'</span>'+
        '<span style="margin-left:auto;color:#7C838F">'+r.ago+'</span></div>';
    }).join("");
  }
  function badge(k){
    return '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:'+stColor(k)+';border:1px solid '+stBorder(k)+';padding:2px 7px">'+k.st+'</span>';
  }
  function sparkSVG(k, animate){
    const d = spark(k.ch>=0?0.7:0.32);
    const anim = animate ? ' style="stroke-dasharray:400;stroke-dashoffset:400;animation:ar-draw 1.5s cubic-bezier(.22,1,.36,1) forwards"' : '';
    return '<svg width="86" height="30" viewBox="0 0 86 30" fill="none" style="flex:none;opacity:.85"><path d="'+d+'" stroke="'+chColor(k)+'" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"'+anim+'></path></svg>';
  }
  function sandRow(k, i){
    return '<div data-magnet data-row data-go="token:'+k.t+'" class="row-bout" style="position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:8px 28px;align-items:center;padding:clamp(18px,2.4vw,28px) 0;border-top:1px solid rgba(255,255,255,.12);transition:background .45s cubic-bezier(.22,1,.36,1)">'+
      '<div style="display:flex;align-items:center;gap:clamp(14px,2vw,26px);min-width:0">'+
        '<span style="font-family:Cinzel,serif;font-size:13px;letter-spacing:.1em;color:#7C838F;width:22px;flex:none">'+rank(i)+'</span>'+
        '<div style="width:9px;height:9px;transform:rotate(45deg);flex:none;background:'+k.c+';box-shadow:0 0 14px '+k.c+'"></div>'+
        '<div style="min-width:0"><div style="display:flex;align-items:baseline;gap:11px;flex-wrap:wrap">'+
          '<span style="font-family:Cinzel,serif;font-size:clamp(19px,2.5vw,27px);letter-spacing:.04em">'+k.n+'</span>'+
          '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;letter-spacing:.16em;color:#7C838F">'+k.t+'</span>'+badge(k)+
        '</div><div style="font-size:13.5px;color:#9CA2AD;margin-top:6px;text-wrap:pretty">'+k.b+'</div></div></div>'+
      '<div style="display:flex;align-items:center;justify-content:flex-end;gap:clamp(16px,2.6vw,38px)">'+sparkSVG(k,true)+
        '<div style="text-align:right;width:74px;flex:none"><div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7C838F">24h</div>'+
          '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:14px;margin-top:5px;font-variant-numeric:tabular-nums;color:'+chColor(k)+'">'+chText(k)+'</div></div>'+
        '<div style="text-align:right;width:104px;flex:none"><div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7C838F">Market cap</div>'+
          '<div data-cap="'+k.t+'" style="font-family:Cinzel,serif;font-size:17px;margin-top:4px;font-variant-numeric:tabular-nums">'+money(k.cap)+'</div></div></div>'+
      '<div style="position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(255,255,255,.08)">'+
        '<div data-bar="'+k.t+'" style="height:100%;background:linear-gradient(90deg,rgba(41,141,255,.35),#298DFF);box-shadow:0 0 10px rgba(41,141,255,.6);transition:width 1.1s cubic-bezier(.22,1,.36,1);width:'+barPct(k)+'"></div></div></div>';
  }
  function discRow(k, i){
    return '<div data-magnet data-row data-go="token:'+k.t+'" class="row-bout" style="position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:8px 28px;align-items:center;padding:clamp(16px,2.2vw,26px) 0;border-top:1px solid rgba(255,255,255,.12);transition:background .45s cubic-bezier(.22,1,.36,1)">'+
      '<div style="display:flex;align-items:center;gap:clamp(14px,2vw,26px);min-width:0">'+
        '<span style="font-family:Cinzel,serif;font-size:13px;color:#7C838F;width:22px;flex:none">'+rank(i)+'</span>'+

        '<div style="display:flex;gap:12px;margin-top:44px;flex-wrap:wrap">'+
          '<div data-magnet data-go="discover" style="padding:14px 22px;background:#F2F0EC;color:#191A1F;font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase">See the floor first</div>'+
          '<div data-magnet data-go="pit" style="padding:14px 22px;border:1px solid rgba(201,187,163,.3);color:#C9BBA3;font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase">Watch the pit</div>'+
        '</div></div></div>';
  }
  function hashFor(route, sym){
    if (route === "floor") return "#/";
    if (route === "token") return "#/token/"+(sym||state.sym);
    return "#/"+route;
  }
  function parseHash(){
    const h = (location.hash || "#/").replace(/^#/, "");
    const parts = h.split("/").filter(Boolean);
    if (!parts.length) return {route:"floor", sym:state.sym};
    if (parts[0] === "token"){
      const raw = (parts[1]||"VOLT").toUpperCase();
      const tk = T.find(function(k){return k.t === raw;});
      return {route:"token", sym: tk ? tk.t : "VOLT"};
    }
    if (parts[0]==="discover" || parts[0]==="pit" || parts[0]==="launch" || parts[0]==="floor" || parts[0]==="home") return {route: parts[0]==="home"||parts[0]==="floor"?"floor":parts[0], sym:state.sym};
    return {route:"floor", sym:state.sym};
  }
  function paintDock(){
    const nav = [["Floor","floor"],["Discover","discover"],["Pit","pit"]];
    $("#dock-nav").innerHTML = nav.map(function(n){
      const on = state.route === n[1];
      return '<div data-magnet data-go="'+n[1]+'" style="padding:9px clamp(10px,2.6vw,17px);border-radius:999px;font-family:\'IBM Plex Mono\',monospace;font-size:clamp(9px,2.4vw,10.5px);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;background:'+(on?"rgba(242,240,236,.94)":"transparent")+';color:'+(on?"#191A1F":"#C9BBA3")+';transition:background .35s ease,color .35s ease">'+n[0]+'</div>';
    }).join("");
  }
  function paintWallet(){
    const el = $("#wallet-btn");
    if (el) el.textContent = state.connected ? balance.toFixed(2)+" SUI" : "Connect";
  }
  function paintClocks(){
    const c = clockStr();
    $$("[data-clock]").forEach(function(el){ el.textContent = c; });
    $$("[data-round]").forEach(function(el){ el.textContent = String(roundNo); });
  }
  function paintPots(){
    const txt = money(pot);
    if (txt !== prevPot){
      prevPot = txt;
      $$("[data-pot]").forEach(function(el){
        el.textContent = txt;
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "ar-roll .5s cubic-bezier(.22,1,.36,1)";
      });
    } else {
      $$("[data-pot]").forEach(function(el){ el.textContent = txt; });
    }
  }
  function paintCaps(){
    T.forEach(function(k){
      $$('[data-cap="'+k.t+'"]').forEach(function(el){
        if (el.closest("#contenders")) el.textContent = fmt(k.cap);
        else el.textContent = money(k.cap);
      });
      $$('[data-bar="'+k.t+'"]').forEach(function(el){ el.style.width = barPct(k); });
      const r = (0.92 - 0.6*Math.min(1, Math.sqrt(k.cap/GRAD))).toFixed(3);
      $$('[data-mark="'+k.t+'"]').forEach(function(el){ el.dataset.r = r; });
    });
  }
  function paintTicket(){
    const buy = $("#btn-buy"), sell = $("#btn-sell");
    if (!buy) return;
    const buyOn = state.side === "Buy";
    const meta = ticketMeta();
    buy.style.background = buyOn ? "#F2F0EC" : "transparent";
    buy.style.color = buyOn ? "#191A1F" : "#9CA2AD";
    sell.style.background = buyOn ? "transparent" : "#C98A80";
    sell.style.color = buyOn ? "#9CA2AD" : "#191A1F";
    const pl = $("#pay-label"); if (pl) pl.textContent = meta.payLabel;
    const bt = $("#bal-text"); if (bt) bt.textContent = balance.toFixed(2)+" SUI";
    const rec = $("#receive"); if (rec) rec.textContent = meta.receive;
    const fee = $("#fee"); if (fee) fee.textContent = meta.fee;
    const tr = $("#trade-btn"); if (tr) tr.textContent = meta.tradeLabel;
  }
  function paintLive(){
    paintClocks();
    paintPots();
    paintCaps();
    const top = $("#top-card");
    if (top) top.innerHTML = topHTML();
    const tapeEl = $("#tape");
    if (tapeEl) tapeEl.innerHTML = tapeHTML(state.route === "token" ? 10 : 11);
    paintTicket();
  }
  function renderScreen(){
    const host = $("#screens");
    const map = {floor:floorHTML, discover:discoverHTML, pit:pitHTML, token:tokenHTML, launch:launchHTML};
    host.innerHTML = (map[state.route] || floorHTML)();
    paintDock();
    paintWallet();
    prevPot = money(pot);
    document.documentElement.classList.toggle("fine-pointer", window.matchMedia("(pointer:fine)").matches);
  }
  function showGate(){
    const g = $("#gate"), L = $("#gate-l"), R = $("#gate-r"), seam = $("#gate-seam");
    if (state.gate === "idle"){ g.style.display = "none"; return; }
    const wasHidden = g.style.display === "none";
    g.style.display = "block";
    if (wasHidden){
      seam.style.animation = "none";
      void seam.offsetWidth;
      seam.style.animation = "ar-seam .9s ease-out .32s both";
    }
    const closing = state.gate === "closing";
    L.style.transform = closing ? "translateX(0%)" : "translateX(-100%)";
    R.style.transform = closing ? "translateX(0%)" : "translateX(100%)";
  }
  function go(route, sym){
    const nextSym = sym || state.sym;
    if (route === state.route && (!sym || nextSym === state.sym)) return;
    gt.forEach(clearTimeout); gt = [];
    state.gate = "arm";
    showGate();
    gt.push(setTimeout(function(){ state.gate = "closing"; showGate(); }, 30));
    gt.push(setTimeout(function(){
      window.scrollTo(0,0);
      state.route = route;
      if (sym) state.sym = nextSym;
      hashLock = true;
      const h = hashFor(route, state.sym);
      if ((location.hash || "#/") !== h) location.hash = h;
      else hashLock = false;
      renderScreen();
      state.gate = "opening";
      showGate();
    }, 500));
    gt.push(setTimeout(function(){ state.gate = "idle"; showGate(); }, 1060));
  }
  function fill(){
    const k = T[Math.floor(Math.random()*T.length)];
    const side = Math.random() > 0.3 ? "bought" : "sold";
    const amt = +(Math.random()*18+0.4).toFixed(2);
    tape.unshift({a:ADDR[Math.floor(Math.random()*ADDR.length)], s:side, amt:amt, t:k.t, ago:"now"});
    tape = tape.slice(0,14);
    tape.forEach(function(r,i){ if(i) r.ago = i<3?"now":(i-1)+"m"; });
    k.buckets[11] += amt; k.fbuckets[11] += 1;
    pot += amt*0.01;
    k.cap = Math.max(40, k.cap + (side === "bought" ? amt*4.2 : -amt*3.1));
  }
  function rollover(){
    roundNo += 1;
    pot = 0.42;
    prevPot = "";
  }
  function onMove(e){
    m.x = e.clientX; m.y = e.clientY;
    const el = e.target && e.target.closest ? e.target.closest("[data-magnet]") : null;
    if (el !== hot){
      if (hot && hot.hasAttribute("data-row")) hot.style.transform = "";
      hot = el;
    }
    if (el && el.hasAttribute("data-row") && cinema()){
      const r = el.getBoundingClientRect();
      el.style.transform = "translate3d("+((e.clientX-(r.left+r.width/2))*0.014).toFixed(2)+"px,"+((e.clientY-(r.top+r.height/2))*0.06).toFixed(2)+"px,0)";
      el.style.transition = "transform .5s cubic-bezier(.22,1,.36,1), background .45s cubic-bezier(.22,1,.36,1)";
    }
  }
  function onLeave(){ cur.o = 0; }
  function onScroll(){ sy = window.scrollY || 0; }
  function raf(){
    const t = (Date.now()-t0)/1000;
    const c = $("[data-cursor]");
    if (c){
      const fine = window.matchMedia("(pointer:fine)").matches;
      let tx = m.x, ty = m.y, ts = 1;
      if (fine && hot){
        const r = hot.getBoundingClientRect();
        tx += (r.left+r.width/2 - m.x)*0.3; ty += (r.top+r.height/2 - m.y)*0.3; ts = 2.3;
      }
      cur.x += (tx-cur.x)*0.19; cur.y += (ty-cur.y)*0.19; cur.s += (ts-cur.s)*0.14;
      const want = fine && m.x > -50 ? 1 : 0;
      cur.o += (want-cur.o)*0.12;
      c.style.transform = "translate3d("+cur.x.toFixed(1)+"px,"+cur.y.toFixed(1)+"px,0) scale("+cur.s.toFixed(3)+")";
      c.style.opacity = cur.o.toFixed(2);
      c.style.borderColor = hot ? "rgba(201,187,163,.85)" : "rgba(41,141,255,.55)";
      c.style.background = hot ? "rgba(41,141,255,.07)" : "transparent";
    }
    const tb = $("[data-topbar]");
    if (tb){
      const on = sy > 40;
      tb.style.background = on ? "rgba(25,26,31,.84)" : "transparent";
      tb.style.borderBottomColor = on ? "rgba(255,255,255,.13)" : "rgba(255,255,255,0)";
      tb.style.backdropFilter = on ? "blur(20px) saturate(1.4)" : "none";
    }
    $$("[data-plate]").forEach(function(pl){
      const base = parseFloat(pl.dataset.tilt) || 60;
      let tilt = base;
      if (pl.dataset.scrub){
        const host = pl.closest("section");
        const span = host ? Math.max(1, host.offsetHeight - window.innerHeight) : 1;
        const p = Math.min(1, Math.max(0, sy/span));
        tilt = base - 46*p;
        pl.style.transform = "rotateX("+tilt.toFixed(2)+"deg) scale("+(1+0.22*p).toFixed(3)+") translateY("+(p*70).toFixed(1)+"px)";
        const ht = $("[data-herotype]");
        if (ht){
          ht.style.transform = "translate3d(0,"+(-p*130).toFixed(1)+"px,0) scale("+(1-0.1*p).toFixed(3)+")";
          ht.style.opacity = (1-p*0.92).toFixed(3);
        }
      } else {
        pl.style.transform = "rotateX("+tilt+"deg)";
      }
      const R = pl.offsetWidth/2;
      const spin = cinema() ? 1 : 0;
      pl.querySelectorAll("[data-mark]").forEach(function(mk){
        const rn = parseFloat(mk.dataset.r)||0.6, a0 = parseFloat(mk.dataset.a)||0, sp = parseFloat(mk.dataset.sp)||1;
        const ang = (a0 + t*sp*spin*0.9) * Math.PI/180;
        const cx = Math.cos(ang);
        mk.style.left = "50%"; mk.style.top = "50%";
        mk.style.transform = "translate3d("+(cx*rn*R).toFixed(1)+"px,"+(Math.sin(ang)*rn*R).toFixed(1)+"px,0) rotateX("+(-tilt).toFixed(2)+"deg)";
        const grp = mk.firstElementChild;
        if (grp) grp.style.flexDirection = cx < 0 ? "row-reverse" : "row";
      });
    });
    if (SHOT) return;
    requestAnimationFrame(raf);
  }
  document.addEventListener("click", function(e){
    const trade = e.target.closest("[data-trade]");
    if (trade){
      if (!state.connected){ state.connected = true; paintWallet(); paintTicket(); }
      else { fill(); paintLive(); }
      return;
    }
    const wal = e.target.closest("[data-wallet]");
    if (wal){ state.connected = !state.connected; paintWallet(); paintTicket(); return; }
    const side = e.target.closest("[data-side]");
    if (side){ state.side = side.getAttribute("data-side"); paintTicket(); return; }
    const chip = e.target.closest("[data-chip]");
    if (chip){
      const v = chip.getAttribute("data-chip");
      state.amt = v === "Max" ? balance.toFixed(2) : v;
      const inp = $("#amt"); if (inp) inp.value = state.amt;
      paintTicket();
      return;
    }
    const filt = e.target.closest("[data-filter]");
    if (filt){
      state.filter = filt.getAttribute("data-filter");
      const box = $("#filters");
      if (box) box.innerHTML = ["All","Live","Graduating","Graduated"].map(filterBtn).join("");
      const list = $("#disc-list");
      if (list) list.innerHTML = discPool().map(discRow).join("");
      return;
    }
    const goEl = e.target.closest("[data-go]");
    if (goEl){
      const v = goEl.getAttribute("data-go");
      if (v.indexOf("token:") === 0) go("token", v.slice(6));
      else go(v);
    }
  });
  document.addEventListener("input", function(e){
    if (e.target && e.target.id === "amt"){ state.amt = e.target.value; paintTicket(); }
  });
  window.addEventListener("mousemove", onMove, {passive:true});
  window.addEventListener("mouseout", onLeave, {passive:true});
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("hashchange", function(){
    if (hashLock){ hashLock = false; return; }
    const p = parseHash();
    go(p.route, p.sym);
  });
  if (!SHOT) setInterval(function(){
    secs = secs > 0 ? secs - 1 : ROUND_SECONDS;
    if (secs === ROUND_SECONDS) rollover();
    if (++bshift >= 20){
      bshift = 0;
      T.forEach(function(k){ k.buckets.shift(); k.buckets.push(0); k.fbuckets.shift(); k.fbuckets.push(0); });
    }
    if (Math.random() < 0.62) fill();
    paintLive();
  }, 1000);
  const parsed = parseHash();
  state.route = parsed.route;
  state.sym = parsed.sym;
  if (SHOT) document.documentElement.classList.add("shot");
  renderScreen();
  if (SHOT) raf();
  else requestAnimationFrame(raf);
})();
</script>
</body>
</html>
