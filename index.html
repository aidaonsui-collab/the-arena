<style>

@keyframes ar-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

@keyframes ar-roll{0%{transform:translateY(-.42em);opacity:.2;color:#298DFF}100%{transform:none;opacity:1}}
@keyframes ar-draw{to{stroke-dashoffset:0}}
@keyframes ar-seam{0%{opacity:0}50%{opacity:1}100%{opacity:0}}

html.fine-pointer,html.fine-pointer body,html.fine-pointer body *:not(input):not(textarea){cursor:none!important}
html.shot,html.shot *{animation:none!important}
html.shot [data-cursor]{display:none!important}
html.shot [data-plate],html.shot [data-mark],html.shot [data-herotype]{will-change:auto!important}

    top:62%!important;

  }

    padding-top:88px!important;

  }
  .floor-sticky{
    overflow:visible!important;
  }
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.tv-host{height:320px;width:100%;position:relative;margin-top:12px;background:#191A1F}
.tv-host iframe{border:0;display:block;width:100%;height:100%}
</style>

        <span style="font-family:Cinzel,serif;font-weight:600;font-size:14px;letter-spacing:.3em">ARENA</span>

        <div data-magnet data-wallet class="btn-connect" id="wallet-btn" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#191A1F;background:#F2F0EC;padding:9px 15px;white-space:nowrap;transition:background .3s ease">Connect</div>
      </div>

  </div>

  <div id="screens"></div>

  <div style="position:fixed;left:50%;bottom:clamp(14px,2.4vw,26px);transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:clamp(2px,1vw,6px);padding:7px;border-radius:999px;background:rgba(32,34,41,.8);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 18px 50px rgba(0,0,0,.45);max-width:calc(100vw - 24px)">
    <div id="dock-nav" style="display:contents"></div>
    <div style="width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 4px;flex:none"></div>
    <div style="display:flex;align-items:center;gap:7px;padding-right:9px;white-space:nowrap">
      <span style="width:5px;height:5px;border-radius:999px;background:#298DFF;box-shadow:0 0 8px #298DFF;animation:ar-breathe 1.5s ease-in-out infinite;flex:none"></span>
      <span data-clock style="font-family:'IBM Plex Mono',monospace;font-size:clamp(9px,2.4vw,10.5px);letter-spacing:.14em;color:#C9BBA3;font-variant-numeric:tabular-nums">1:36</span>
    </div>
  </div>
</div>
<script src="js/indexer.js"></script>
<script>
(function(){
  const GRAD = 2000;
  const ACCENT = "#298DFF";
  const ROUND_SECONDS = 96;
  const T = [
    {t:"VOLT",n:"Voltcats",b:"Nine lives, one curve. Currently clawing at graduation.",cap:4650,ch:31.3,h:612,st:"Graduating",mode:"Holders",q:"SUI",c:"#298DFF",pit:true},
    {t:"IRON",n:"Ironclad",b:"Object-centric collateral. One vault, many blows.",cap:4380,ch:18.9,h:503,st:"Graduating",mode:"Buy & burn",q:"SUI",c:"#8A99A8"},
    {t:"BRINE",n:"Brine",b:"Spreads so tight they sting. Order-book spray for Sui.",cap:2140,ch:9.6,h:466,st:"Live",mode:"Buy & burn",q:"SUI",c:"#3FA0A8"},
    {t:"HEX",n:"Hexweaver",b:"Compose Move packages like hexes. No mercy for bad bytecode.",cap:1540,ch:22.5,h:328,st:"Live",mode:"Holders",q:"SUI",c:"#9A7FB0"},
    {t:"SILK",n:"Silk",b:"Gold bout on the curve. Quote is XAUM; the pit for this bout is Pit<XAUM>.",cap:0.62,ch:16.8,h:266,st:"Live",mode:"Holders",q:"XAUM",quote:"XAUM",c:"#C9A97E"},
    {t:"NITE",n:"Night Market",b:"After-hours liquidity. The floor never really closes.",cap:1020,ch:-4.7,h:215,st:"Live",mode:"Holders",q:"SUI",c:"#5A6472"},
    {t:"RAZR",n:"Razorfin",b:"Latency as a weapon. Built for the hot path.",cap:769,ch:41.0,h:169,st:"Live",mode:"Holders",q:"SUI",c:"#C9A05A"},
    {t:"GLOW",n:"Glowmoth",b:"Drawn to the light. A moth that refuses to rug.",cap:454,ch:12.7,h:140,st:"Live",mode:"Holders",q:"SUI",c:"#93B27C"},
    {t:"PBL",n:"Pebble",b:"Small stone, long throw. Microcaps with a spine.",cap:257,ch:8.2,h:118,st:"Live",mode:"Holders",q:"SUI",c:"#7A7A70"},
    {t:"QUILL",n:"Quill",b:"Write once, settle forever.",cap:179,ch:3.1,h:96,st:"Live",mode:"Holders",q:"SUI",c:"#9A8A6E"}
  ];
  T.forEach(function(k,i){
    const base = Math.max(2.4, k.cap/34);
    k.buckets = Array.from({length:12},function(_,j){return +(base*(0.42+Math.abs(Math.sin((i+1.7)*(j+2.3)))*0.95)).toFixed(2);});
    k.fbuckets = k.buckets.map(function(v){return Math.max(1, Math.round(v/2.6));});
  });
  const GRADS = [{t:"DUNE",n:"Dune",cap:12400},{t:"AXM",n:"Axiom",cap:9800},{t:"KRKN",n:"Kraken",cap:6100},{t:"ORBT",n:"Orbit",cap:3450}];
  const BELLS = [
    {t:"VOLT",n:"Voltcats",amt:34.20,ago:"1h",mode:"Holders"},
    {t:"IRON",n:"Ironclad",amt:41.90,ago:"3h",mode:"Buy & burn",burn:"9.1M"},
    {t:"BRINE",n:"Brine",amt:28.10,ago:"4h",mode:"Buy & burn",burn:"6.02M"}
  ];
  const ADDR = ["0x8f2a…ab71","0xa91c…d012","0x11c0…012f","0x70bb…4410","0xcc81…e203","0x5d0e…c801","0x09ae…3290","0xbb21…aa13"];
  let bshift = 0, pot = 31.94, prevPot = "", roundNo = 128, secs = ROUND_SECONDS;
  let tape = [
    {a:ADDR[0],s:"bought",amt:22.40,t:"VOLT",ago:"now"},
    {a:ADDR[1],s:"bought",amt:8.10,t:"IRON",ago:"1m"},
    {a:ADDR[2],s:"sold",amt:3.60,t:"RAZR",ago:"2m"},
    {a:ADDR[3],s:"bought",amt:5.00,t:"GLOW",ago:"4m"},
    {a:ADDR[4],s:"bought",amt:14.20,t:"BRINE",ago:"6m"},
    {a:ADDR[5],s:"sold",amt:2.20,t:"HEX",ago:"8m"},
    {a:ADDR[6],s:"bought",amt:6.80,t:"SILK",ago:"9m"},
    {a:ADDR[7],s:"bought",amt:1.40,t:"PBL",ago:"11m"}
  ];
  const state = {route:"floor", sym:"VOLT", gate:"idle", filter:"All", side:"Buy", amt:"1", connected:false};
  let balance = 48.60;
  let xaumBal = 2.40;
  const m = {x:-999,y:-999};
  const cur = {x:-999,y:-999,s:1,o:0};
  let hot = null, sy = 0;
  const t0 = Date.now();
  let gt = [], hashLock = false;
  const SHOT = /Headless/i.test(String(navigator.userAgent||"")) || /(?:^|[?&])shot=1(?:&|$)/.test(location.search);
  if (SHOT){ Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.google"]')).forEach(function(l){ l.disabled = true; l.remove(); }); }
  const Index = window.ArenaIndex || window.ArenaIndexer || null;
  const DEMO_WALLET = (Index && Index.DEMO_WALLET) || "0x8f2a00000000000000000000000000000000000000000000000000000000ab71";
  const bus = { trades: [], launches: {}, index: { pools: {}, cursor: null }, sub: null };
  let tvWidget = null;
  let tvSeq = 0;
  let hydrating = true;
  function cinema(){ return !window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  function fmt(n){ return n >= 1000 ? (n/1000).toFixed(2)+"k" : n.toFixed(2); }
  function money(n, q){ return fmt(n)+" "+(q||"SUI"); }
  function gradTarget(k){ return poolQuote(k) === "XAUM" ? 1 : GRAD; }
  function walletBal(q){ return (q === "XAUM" ? xaumBal : balance); }
  function clockStr(){ return Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0"); }
  function $(s,r){ return (r||document).querySelector(s); }
  function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function spark(seed){
    let p = "", y = 18;
    for (let i=0;i<=24;i++){
      y += Math.sin(i*seed)*2.6 + (seed > 0.5 ? -0.55 : 0.42);
      y = Math.max(4, Math.min(26, y));
      p += (i?"L":"M")+(i*3.58).toFixed(1)+" "+y.toFixed(1);
    }
    return p;
  }
  function stColor(k){ return k.st === "Graduating" ? ACCENT : "#9CA2AD"; }
  function stBorder(k){ return k.st === "Graduating" ? "rgba(41,141,255,.45)" : "rgba(255,255,255,.2)"; }
  function barPct(k){ return Math.min(100, k.cap/gradTarget(k)*100).toFixed(0)+"%"; }
  function chText(k){ return (k.ch>=0?"+":"")+k.ch.toFixed(1)+"%"; }
  function chColor(k){ return k.ch>=0 ? "#8FB07A" : "#C98A80"; }
  function rank(i){ return String(i+1).padStart(2,"0"); }
  function sortedT(){ return T.slice().sort(function(a,b){return b.cap-a.cap;}); }
  function vol(k){ return k.buckets.reduce(function(a,b){return a+b;},0); }
  function findT(sym){ return T.find(function(k){return k.t === (sym||"").toUpperCase();}) || T[0]; }
  function poolQuote(sym){
    const id = (sym && sym.t) ? sym.t : (sym || state.sym);
    const tk = findT(id);
    const rec = bus.index && bus.index.pools && (bus.index.pools[tk.t] || bus.index.pools[id]);
    if (rec && rec.quote) return rec.quote === "XAUM" ? "XAUM" : "SUI";
    const launch = bus.launches[tk.t] || bus.launches[id];
    if (launch && Index) return Index.quoteLabel(launch.quote);
    return tk.q || tk.quote || "SUI";
  }
  function isRefl(tk){
    tk = tk && tk.t ? tk : findT(tk || state.sym);
    const rec = bus.index && bus.index.pools && bus.index.pools[tk.t];
    if (rec && rec.reflection != null) return !!rec.reflection;
    const launch = bus.launches[tk.t];
    if (launch && launch.reflection != null) return !!launch.reflection;
    return tk.mode === "Holders";
  }
  function shortAddr(a){
    if (!a) return "0x…";
    if (String(a).indexOf("…") >= 0) return a;
    if (a.length <= 12) return a;
    return a.slice(0,6)+"…"+a.slice(-4);
  }
  function agoOf(ts){
    const s = Math.max(0, (Date.now() - (ts||0))/1000);
    if (s < 8) return "now";
    if (s < 60) return Math.floor(s)+"s";
    if (s < 3600) return Math.floor(s/60)+"m";
    return Math.floor(s/3600)+"h";
  }
  function fmtPx(p){
    if (!(p > 0)) return "—";
    if (p < 1e-4) return p.toExponential(2);
    if (p < 1) return p.toFixed(6);
    return p.toFixed(4);
  }
  function lastPx(sym){
    const id = (sym && sym.t) ? sym.t : (sym || state.sym);
    const rows = bus.trades.filter(function(t){ return t.pool_id === id; });
    if (!rows.length) return 4.65e-6;
    rows.sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
    const last = rows[rows.length-1];
    if (Index) return Index.tradePrice(last);
    const tr = Number(last.token_reserve);
    return tr > 0 ? Number(last.quote_real)/tr : 0;
  }
  function fromMist(s){ return Index ? Index.fromMist(s) : Number(s||0)/1e9; }
  function tapeItems(limit, pool){
    let rows = bus.trades.slice();
    if (pool) rows = rows.filter(function(t){ return t.pool_id === pool; });
    rows.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    return rows.slice(0, limit == null ? 8 : limit);
  }
  function holderHTML(tk){
    if (!isRefl(tk)) return "";
    const q = poolQuote(tk);
    const rec = bus.index && bus.index.pools && bus.index.pools[tk.t];
    let h = null;
    if (rec && rec.holders){
      h = rec.holders[DEMO_WALLET];
      if (!h){
        const keys = Object.keys(rec.holders);
        if (keys.length) h = rec.holders[keys[0]];
      }
    }
    const unpaid = h ? fromMist(h.unpaidReflection) : 0;
    const claimed = h ? fromMist(h.claimedReflection) : 0;
    const who = shortAddr((h && h.address) || DEMO_WALLET);
    return '<div id="holder-refl" style="display:flex;align-items:center;gap:clamp(16px,3vw,32px);flex-wrap:wrap;padding:16px 20px;background:#20222A;border:1px solid rgba(255,255,255,.12);border-top:0">'+
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#7C838F">Reflection · Pit&lt;'+q+'&gt; · '+who+'</div>'+
      '<div style="margin-left:auto;display:flex;gap:28px;flex-wrap:wrap">'+
        '<div><div style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#7C838F">Unpaid</div>'+
          '<div data-unpaid style="font-family:Cinzel,serif;font-size:18px;margin-top:4px;font-variant-numeric:tabular-nums;color:#298DFF">'+unpaid.toFixed(4)+' '+q+'</div></div>'+
        '<div><div style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#7C838F">Claimed</div>'+
          '<div data-claimed style="font-family:Cinzel,serif;font-size:18px;margin-top:4px;font-variant-numeric:tabular-nums">'+claimed.toFixed(4)+' '+q+'</div></div>'+
      '</div></div>';
  }
  function marksHTML(kind){
    const hero = kind === "hero";
    const sz = hero ? 8 : 6;
    const glow = hero ? 14 : 10;
    const fs = hero ? "10.5px" : "9.5px";
    const ls = hero ? ".16em" : ".14em";
    const gap = hero ? 7 : 6;
    const col = hero ? "rgba(242,240,236,.82)" : "rgba(242,240,236,.72)";
    const extra = hero ? ",0 0 3px rgba(0,0,0,.9)" : "";
    const wc = hero ? "will-change:transform;" : "";
    return T.map(function(k,i){
      const r = (0.92 - 0.6*Math.min(1, Math.sqrt(k.cap/GRAD))).toFixed(3);
      const a = (i*36 + (i%3)*9).toFixed(1);
      const sp = (0.8 + (i%4)*0.22).toFixed(2);
      const ang0 = parseFloat(a)*Math.PI/180;
      const lx = (Math.cos(ang0)*parseFloat(r)*50).toFixed(2);
      const ly = (Math.sin(ang0)*parseFloat(r)*50).toFixed(2);
      return '<div data-mark="'+k.t+'" data-r="'+r+'" data-a="'+a+'" data-sp="'+sp+'" style="position:absolute;left:calc(50% + '+lx+'%);top:calc(50% + '+ly+'%);width:0;height:0;transform:rotateX(-60deg);transform-style:preserve-3d;'+wc+'">'+

  function hashFor(route, sym){
    if (route === "floor") return "#/";

    return "#/"+route;

  function parseHash(){
    const h = (location.hash || "#/").replace(/^#/, "");
    const parts = h.split("/").filter(Boolean);
    if (!parts.length) return {route:"floor", sym:state.sym};
    if (parts[0] === "token"){
      const raw = (parts[1]||"VOLT").toUpperCase();
      const tk = T.find(function(k){return k.t === raw;});
      return {route:"token", sym: tk ? tk.t : "VOLT"};
    }
    if (parts[0]==="discover" || parts[0]==="pit" || parts[0]==="launch" || parts[0]==="floor" || parts[0]==="home") return {route: parts[0]==="home"||parts[0]==="floor"?"floor":parts[0], sym:state.sym};
    return {route:"floor", sym:state.sym};
  }

  function loadTvScript(onLoad, onError){
    if (window.TradingView){ onLoad(); return; }
    const candidates = [
      "./charting_library/charting_library/charting_library.standalone.js",
      "/charting_library/charting_library/charting_library.standalone.js",
      "/charting_library/charting_library/charting_library.js"
    ];
    let idx = 0;
    (function tryNext(){
      if (idx >= candidates.length){ onError(); return; }
      const el = document.createElement("script");
      el.src = candidates[idx++];
      el.async = true;
      el.onload = function(){ window.TradingView ? onLoad() : tryNext(); };
      el.onerror = tryNext;
      document.head.appendChild(el);
    })();
  }
  function tvBars(sym){
    const id = String(sym || state.sym || '').toUpperCase();
    if (!Index || !Index.toCandles) return [];
    let trades = (bus.trades || []).filter(function(t){
      return String(t.pool_id || t.symbol || '').toUpperCase() === id;
    });
    if (!trades.length && Index.generateDemoHistory){
      const hist = Index.generateDemoHistory([findT(id)]);
      trades = hist.trades || [];
    }
    return Index.toCandles(trades, 60000).map(function(c){
      const t = Number(c.time);
      const ms = t > 0 && t < 1e12 ? t * 1000 : t;
      return {
        time: ms,
        open: c.open, high: c.high, low: c.low, close: c.close,
        volume: fromMist(c.volume)
      };
    });
  }
  function staticDatafeed(ticker, candles, res, pricescale, quote){
    const desc = ticker + " / " + quote;
    return {
      onReady: function(cb){ setTimeout(function(){ cb({ supported_resolutions: [res], supports_time: true }); }, 0); },
      searchSymbols: function(){},
      resolveSymbol: function(_n, onResolve){
        setTimeout(function(){
          onResolve({
            name: ticker, ticker: ticker, description: desc, type: "crypto", session: "24x7", timezone: "Etc/UTC",
            minmov: 1, pricescale: pricescale, has_intraday: true, has_daily: true, supported_resolutions: [res],
            volume_precision: 2, data_status: "streaming", format: "price"
          });
        }, 0);
      },
      getBars: function(_s, _r, p, onResult){
        p = p || {};
        if (!candles.length){ onResult([], { noData: true }); return; }
        if (p.firstDataRequest){ onResult(candles, { noData: false }); return; }
        function asMs(x){ x = Number(x); if (!isFinite(x)) return NaN; return x < 1e12 ? x * 1000 : x; }
        var from = asMs(p.from), to = asMs(p.to);
        var bars = candles.filter(function(c){
          if (isFinite(from) && c.time < from) return false;
          if (isFinite(to) && c.time > to) return false;
          return true;
        });
        onResult(bars, { noData: bars.length === 0 });
      },
      subscribeBars: function(){},
      unsubscribeBars: function(){},
      getServerTime: function(cb){ cb(Math.floor(Date.now() / 1000)); }
    };
  }

  function showGate(){
    const g = $("#gate"), L = $("#gate-l"), R = $("#gate-r"), seam = $("#gate-seam");
    if (state.gate === "idle"){ g.style.display = "none"; return; }
    const wasHidden = g.style.display === "none";
    g.style.display = "block";
    if (wasHidden){
      seam.style.animation = "none";
      void seam.offsetWidth;
      seam.style.animation = "ar-seam .9s ease-out .32s both";
    }
    const closing = state.gate === "closing";
    L.style.transform = closing ? "translateX(0%)" : "translateX(-100%)";
    R.style.transform = closing ? "translateX(0%)" : "translateX(100%)";
  }
  function go(route, sym){
    const nextSym = sym || state.sym;
    if (route === state.route && (!sym || nextSym === state.sym)) return;
    gt.forEach(clearTimeout); gt = [];
    state.gate = "arm";
    showGate();
    gt.push(setTimeout(function(){ state.gate = "closing"; showGate(); }, 30));
    gt.push(setTimeout(function(){
      window.scrollTo(0,0);
      state.route = route;
      if (sym) state.sym = nextSym;
      hashLock = true;
      const h = hashFor(route, state.sym);
      if ((location.hash || "#/") !== h) location.hash = h;
      else hashLock = false;
      renderScreen();
      state.gate = "opening";
      showGate();
    }, 500));
    gt.push(setTimeout(function(){ state.gate = "idle"; showGate(); }, 1060));
  }
  function applyLiveTrade(ev){
    const k = T.find(function(t){ return t.t === ev.pool_id; });
    if (!k) return;
    const amt = fromMist(ev.quote_amount);
    const gold = poolQuote(k) === "XAUM";
    k.buckets[11] += gold ? amt * 40 : amt; k.fbuckets[11] += 1;
    if (!gold) pot += fromMist(ev.pit_fee);
    if (gold){
      k.cap = Math.max(0.02, Math.min(0.95, k.cap + (ev.is_buy ? Math.min(0.04, amt*0.12) : -Math.min(0.03, amt*0.09))));
    } else {
      k.cap = Math.max(40, k.cap + (ev.is_buy ? amt*4.2 : -amt*3.1));
    }
  }
  function fill(){
    if (!Index || !bus.sub) return;
    const k = T[Math.floor(Math.random()*T.length)];
    const ev = Index.generateDemoLive([k], Date.now());
    if (ev) bus.sub.push(ev);
  }
  function userFill(){
    if (!Index || !bus.sub) return fill();
    const tk = findT(state.sym);
    const amt = parseFloat(state.amt) || 0;
    const ev = Index.makeTrade({
      pool_id: tk.t,
      trader: DEMO_WALLET,
      is_buy: state.side === "Buy",
      quote: amt,
      price: lastPx(tk.t),
      reflection: isRefl(tk),
      raised: Math.max(40, tk.cap * 0.42),
      quote_real: Math.max(8, tk.cap * 0.36),
      ts: Date.now()
    });
    bus.sub.push(ev);
  }
  function rollover(){
    roundNo += 1;
    pot = 0.42;
    prevPot = "";
  }
  function onMove(e){
    m.x = e.clientX; m.y = e.clientY;
    const el = e.target && e.target.closest ? e.target.closest("[data-magnet]") : null;
    if (el !== hot){
      if (hot && hot.hasAttribute("data-row")) hot.style.transform = "";
      hot = el;
    }
    if (el && el.hasAttribute("data-row") && cinema()){
      const r = el.getBoundingClientRect();
      el.style.transform = "translate3d("+((e.clientX-(r.left+r.width/2))*0.014).toFixed(2)+"px,"+((e.clientY-(r.top+r.height/2))*0.06).toFixed(2)+"px,0)";
      el.style.transition = "transform .5s cubic-bezier(.22,1,.36,1), background .45s cubic-bezier(.22,1,.36,1)";
    }
  }
  function onLeave(){ cur.o = 0; }
  function onScroll(){ sy = window.scrollY || 0; }
  function raf(){
    const t = (Date.now()-t0)/1000;
    const c = $("[data-cursor]");
    if (c){
      const fine = window.matchMedia("(pointer:fine)").matches;
      let tx = m.x, ty = m.y, ts = 1;
      if (fine && hot){
        const r = hot.getBoundingClientRect();
        tx += (r.left+r.width/2 - m.x)*0.3; ty += (r.top+r.height/2 - m.y)*0.3; ts = 2.3;
      }
      cur.x += (tx-cur.x)*0.19; cur.y += (ty-cur.y)*0.19; cur.s += (ts-cur.s)*0.14;
      const want = fine && m.x > -50 ? 1 : 0;
      cur.o += (want-cur.o)*0.12;
      c.style.transform = "translate3d("+cur.x.toFixed(1)+"px,"+cur.y.toFixed(1)+"px,0) scale("+cur.s.toFixed(3)+")";
      c.style.opacity = cur.o.toFixed(2);
      c.style.borderColor = hot ? "rgba(201,187,163,.85)" : "rgba(41,141,255,.55)";
      c.style.background = hot ? "rgba(41,141,255,.07)" : "transparent";
    }
    const tb = $("[data-topbar]");
    if (tb){
      const on = sy > 40;
      tb.style.background = on ? "rgba(25,26,31,.84)" : "transparent";
      tb.style.borderBottomColor = on ? "rgba(255,255,255,.13)" : "rgba(255,255,255,0)";
      tb.style.backdropFilter = on ? "blur(20px) saturate(1.4)" : "none";
    }
    $$("[data-plate]").forEach(function(pl){
      const narrow = window.innerWidth < 720;
      let base = parseFloat(pl.dataset.tilt) || 60;
      if (narrow){
        const pit = pl.closest && pl.closest(".pit-plate");
        base = pit ? 44 : Math.min(base, 48);
      }
      let tilt = base;
      if (pl.dataset.scrub){
        const host = pl.closest("section");
        const span = host ? Math.max(1, host.offsetHeight - window.innerHeight) : 1;
        const p = Math.min(1, Math.max(0, sy/span));
        tilt = base - 46*p;
        pl.style.transform = "rotateX("+tilt.toFixed(2)+"deg) scale("+(1+0.22*p).toFixed(3)+") translateY("+(p*70).toFixed(1)+"px)";
        const ht = $("[data-herotype]");
        if (ht){
          ht.style.transform = "translate3d(0,"+(-p*130).toFixed(1)+"px,0) scale("+(1-0.1*p).toFixed(3)+")";
          ht.style.opacity = (1-p*0.92).toFixed(3);
        }
      } else {
        pl.style.transform = "rotateX("+tilt+"deg)";
      }
      const R = pl.offsetWidth/2;
      const spin = cinema() ? 1 : 0;
      pl.querySelectorAll("[data-mark]").forEach(function(mk){
        const rn = parseFloat(mk.dataset.r)||0.6, a0 = parseFloat(mk.dataset.a)||0, sp = parseFloat(mk.dataset.sp)||1;
        const ang = (a0 + t*sp*spin*0.9) * Math.PI/180;
        const cx = Math.cos(ang);
        mk.style.left = "50%"; mk.style.top = "50%";
        mk.style.transform = "translate3d("+(cx*rn*R).toFixed(1)+"px,"+(Math.sin(ang)*rn*R).toFixed(1)+"px,0) rotateX("+(-tilt).toFixed(2)+"deg)";
        const grp = mk.firstElementChild;
        if (grp) grp.style.flexDirection = cx < 0 ? "row-reverse" : "row";
      });
    });
    if (SHOT) return;
    requestAnimationFrame(raf);
  }
  document.addEventListener("click", function(e){
    const trade = e.target.closest("[data-trade]");
    if (trade){
      if (!state.connected){ state.connected = true; paintWallet(); paintTicket(); }
      else { userFill(); paintLive(); }
      return;
    }
    const wal = e.target.closest("[data-wallet]");
    if (wal){ state.connected = !state.connected; paintWallet(); paintTicket(); return; }
    const side = e.target.closest("[data-side]");
    if (side){ state.side = side.getAttribute("data-side"); paintTicket(); return; }
    const chip = e.target.closest("[data-chip]");
    if (chip){
      const v = chip.getAttribute("data-chip");
      state.amt = v === "Max" ? walletBal(poolQuote(state.sym)).toFixed(2) : v;
      const inp = $("#amt"); if (inp) inp.value = state.amt;
      paintTicket();
      return;
    }
    const filt = e.target.closest("[data-filter]");
    if (filt){
      state.filter = filt.getAttribute("data-filter");
      const box = $("#filters");
      if (box) box.innerHTML = ["All","Live","Graduating","Graduated"].map(filterBtn).join("");
      const list = $("#disc-list");
      if (list) list.innerHTML = discPool().map(discRow).join("");
      return;
    }
    const goEl = e.target.closest("[data-go]");
    if (goEl){
      const v = goEl.getAttribute("data-go");
      if (v.indexOf("token:") === 0) go("token", v.slice(6));
      else go(v);
    }
  });
  document.addEventListener("input", function(e){
    if (e.target && e.target.id === "amt"){ state.amt = e.target.value; paintTicket(); }
  });
  window.addEventListener("mousemove", onMove, {passive:true});
  window.addEventListener("mouseout", onLeave, {passive:true});
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("hashchange", function(){
    if (hashLock){ hashLock = false; return; }
    const p = parseHash();
    go(p.route, p.sym);
  });
  if (!SHOT) setInterval(function(){
    secs = secs > 0 ? secs - 1 : ROUND_SECONDS;
    if (secs === ROUND_SECONDS) rollover();
    if (++bshift >= 20){
      bshift = 0;
      T.forEach(function(k){ k.buckets.shift(); k.buckets.push(0); k.fbuckets.shift(); k.fbuckets.push(0); });
    }
    paintLive();
  }, 1000);
  if (Index){
    hydrating = true;
    bus.index = Index.demoSnapshot(T, DEMO_WALLET);
    bus.sub = Index.subscribe({
      packageId: window.ARENA_PACKAGE_ID || "",
      rpc: window.SUI_RPC || "https://fullnode.mainnet.sui.io:443",
      tokens: T,
      live: !SHOT,
      demoMs: 1000,
      onTrade: function(ev){
        if (hydrating) return;
        if (Date.now() - (ev.ts||0) < 8000) applyLiveTrade(ev);
        paintTape();
        paintPx();
        updateChartLive();
      },
      onLaunch: function(l){
        bus.launches[l.pool_id] = l;
        if (l.symbol) bus.launches[l.symbol] = l;
      }
    });
    bus.trades = bus.sub.trades;
    hydrating = false;
    if (!SHOT){
      Index.loadIndex(window.ARENA_INDEX_URL).then(function(res){
        if (res && res.index) bus.index = res.index;
        paintHolder();
      }).catch(function(){ paintHolder(); });
    }
  }
  const parsed = parseHash();
  state.route = parsed.route;
  state.sym = parsed.sym;
  if (SHOT) document.documentElement.classList.add("shot");
  renderScreen();
  if (SHOT) raf();
  else requestAnimationFrame(raf);
})();
</script>
</body>
</html>
