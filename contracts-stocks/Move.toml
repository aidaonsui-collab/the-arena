[package]
name = "stocks"
edition = "2024.beta"
license = "Apache-2.0"
# No published-at — this is a fresh publish, not an upgrade of the old
# package. BridgeVault gains a field (minted), RedeemBurned gains a field
# (rh_dest), and burn() gains a parameter — none of that is a Move
# upgrade-compatible change, so `sui client upgrade` against the old
# UpgradeCap would be rejected. New package id, new coin types.

[dependencies]
Sui = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/sui-framework", rev = "framework/mainnet", override = true }

[addresses]
stocks = "0x0"
